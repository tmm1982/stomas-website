<div class="st-brand">

    <h1 class="st-brand-title">

        {{ T "text_STOMAS Creator Signature" }}

    </h1>

    <div class="st-brand-subtitle">

       {{ T "text_Professional Email Signature Generator" }}

    </div>

    <div class="st-brand-version"></div>

</div>

<div class="st-panel">

    <h3>{{ T "text_👤 Person" }}</h3>

    <label>{{ T "text_Name" }}</label>
    <input id="name">

    <label>{{ T "text_Title 1" }}</label>
    <input id="title1">

    <label>{{ T "text_Title 2" }}</label>
    <input id="title2">

    <label>{{ T "text_Title 3" }}</label>
    <input id="title3">

<label for="company1">{{ T "text_Organisation 1" }}</label>
<input
    id="company1"
    type="text"
    value="Dansk Landsforening for Hals- og Mundhuleopererede">

<label for="company2">{{ T "text_Organisation 2" }}</label>
<input
    id="company2"
    type="text"
    value="Region Syddanmark">

<label for="company3">{{ T "text_Organisation 3" }}</label>
<input
    id="company3"
    type="text"
    value="STOMAS">

</div>

<div class="st-panel">

    <h3>{{ T "text_📞 Contact" }}</h3>

    <label>{{ T "text_Email" }}</label>
    <input id="email">

    <label>{{ T "text_Phone" }}</label>
    <input id="phone">

    <label>{{ T "text_Website" }}</label>
    <input id="website">

<div class="st-panel">

    <h3>{{ T "text_🖼️ Logos" }}</h3>

    <label>
        <input type="checkbox" id="toggle-stomas" checked>
        STOMAS
    </label>

    <label>
        <input type="checkbox" id="toggle-dlhm" checked>
        DLHM
    </label>

    <label>
        <input type="checkbox" id="toggle-region" checked>
        Region Syddanmark
    </label>

</div>

</div>

<div class="st-panel">

</div>
