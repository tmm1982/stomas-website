<section class="bg-slate-950 py-28">
  <div class="mx-auto max-w-7xl px-6">
    <div class="flex flex-col gap-8 lg:flex-row lg:items-end lg:justify-between">
      <div class="max-w-3xl">
        <p class="text-sm font-semibold uppercase tracking-[0.35em] text-cyan-400">Presse & medier</p>
        <h2 class="mt-4 text-5xl font-bold">STOMAS i samtalen.</h2>
        <p class="mt-8 text-xl leading-9 text-slate-300">Historien om livet efter laryngektomi bliver også fortalt uden for mine egne kanaler.</p>
      </div>
      <a href="/medier/" class="inline-flex rounded-xl border border-slate-700 px-7 py-4 font-semibold transition hover:border-cyan-400">Se presse & medier</a>
    </div>

    <div class="mt-14 grid gap-8">
      {{ range sort hugo.Data.media.episodes "date" "desc" }}
        {{ partial "media/episode-card.html" (dict "entry" . "surface" "home") }}
      {{ end }}
    </div>
  </div>
</section>
