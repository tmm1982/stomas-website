<!DOCTYPE html>
<html lang="da">

<head>
    {{ partial "layout/head.html" . }}
</head>

<body class="{{ if eq .Section "signature" }}studio-body{{ else }}bg-slate-950 text-white{{ end }}">

    {{ if ne .Section "signature" }}
        {{ partial "layout/navbar.html" . }}
    {{ end }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ if ne .Section "signature" }}
        {{ partial "layout/footer.html" . }}
    {{ end }}

</body>

</html>
