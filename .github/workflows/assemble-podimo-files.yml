name: Assemble Podimo files

on:
  push:
    paths:
      - '.github/binary-upload/READY.txt'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble binary files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/downloads
          cat .github/binary-upload/pitch.part* | base64 -d > static/downloads/STOMAS_Livet_bagefter_Podimo_pitch.pdf
          cat .github/binary-upload/budget.part* | base64 -d > static/downloads/STOMAS_Livet_bagefter_Podimo_budget.xlsx
          test -s static/downloads/STOMAS_Livet_bagefter_Podimo_pitch.pdf
          test -s static/downloads/STOMAS_Livet_bagefter_Podimo_budget.xlsx
          rm -rf .github/binary-upload
          rm -f .github/workflows/assemble-podimo-files.yml

      - name: Commit assembled files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Podimo pitch and budget files'
          git push
