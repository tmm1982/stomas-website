baseURL = "https://stomasguide.com/"
locale = "en-GB"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "STOMAS Guide"

enableRobotsTXT = true

[[module.mounts]]
  source = "static"
  target = "static"
  files = ["! app/**"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[languages]
  [languages.en]
    label = "English"
    locale = "en-GB"
    title = "STOMAS Guide"
    weight = 1
  [languages.pt-br]
    label = "Português (Brasil)"
    locale = "pt-BR"
    title = "Guia STOMAS"
    weight = 2
