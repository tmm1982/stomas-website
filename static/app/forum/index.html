*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#07121d,#0b1d2d 65%,#102b3a)}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#8feaf0}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #7df3eb;outline-offset:3px}h1,h2,h3,p{margin-top:0}h1,h2,h3{line-height:1.2}small{font-size:.79rem}.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#0b2030;border-right:1px solid #274458;padding:25px 17px;display:flex;flex-direction:column;gap:21px}.brand{padding:3px 14px}.brand b{font-size:28px;letter-spacing:.035em}.brand b span{color:var(--cyan)}.brand small{display:block;font-size:10px;letter-spacing:.18em;color:#a6cad5}.side-nav{display:grid;gap:7px}.side-nav button,.side-nav a{display:flex;align-items:center;gap:11px;min-height:47px;text-align:left;border:0;border-radius:12px;padding:11px 13px;background:none;color:#bad2de;text-decoration:none;font-weight:750}.side-nav button:hover,.side-nav a:hover,.side-nav .active{background:#174455;color:#a2f5f3}.side-foot{margin-top:auto;color:#adc3cf;font-size:12px;border-top:1px solid var(--line);padding:16px 9px 0}.main{min-width:0}.topbar{min-height:74px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(20px,4vw,56px);border-bottom:1px solid #2d4858;background:#0b1c2bc7}.topbar strong{font-size:13px;text-transform:uppercase;letter-spacing:.11em;color:#a6c5d1}.demo{display:inline-flex;align-items:center;font-size:12px;line-height:1.2;border:1px solid #7a704d;color:#f1db9d;background:#584b251f;padding:7px 11px;border-radius:99px}.content{max-width:1160px;margin:auto;padding:34px clamp(20px,4vw,56px) 120px}.hero{border:1px solid #286074;border-radius:24px;padding:clamp(24px,4vw,43px);background:radial-gradient(circle at 91% 10%,#39a9b13a,transparent 36%),linear-gradient(125deg,#163b53,#0f293d);margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:#7fe5e5;font-weight:850}.hero h1{margin:12px 0 13px;font-size:clamp(31px,4.5vw,48px);letter-spacing:-.035em}.hero p{color:#d1e0e9;max-width:770px;margin-bottom:18px}.pill{display:inline-block;border:1px solid #367180;border-radius:99px;padding:6px 10px;color:#9eebed;font-size:12px;margin-right:7px}.notice{border:1px solid #675b42;background:#2b2a28;border-radius:14px;padding:16px 18px;color:#f2dfb3;font-size:14px;margin:18px 0 23px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:12px;margin:22px 0}.search{min-height:46px;border:1px solid #416276;background:#112b3d;color:var(--ink);border-radius:12px;padding:11px 14px;min-width:220px;flex:1;max-width:530px}.btn{border:1px solid #467082;border-radius:12px;padding:10px 15px;background:#1b4056;color:#ebfdff;font-weight:750;min-height:44px}.btn:hover{background:#28566a}.btn-primary{background:#75d8d9;color:#062b36;border-color:#75d8d9}.btn-primary:hover{background:#9df2f0}.btn:disabled{opacity:.5;cursor:not-allowed}.sectiontop{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:25px 0 13px}.sectiontop h2{margin:0;font-size:22px}.muted{color:var(--muted)}.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.topic{background:linear-gradient(140deg,#173548,#102739);border:1px solid var(--line);text-align:left;border-radius:16px;padding:16px;color:var(--ink);min-height:132px}.topic:hover,.topic.active{border-color:#80d6dc;background:#1e4858}.topic .symbol{font-size:24px;color:#70e0e4}.topic strong{display:block;margin:10px 0 4px;font-size:15px}.topic small{color:#9ab8c6}.topic.all{border-style:dashed}.thread-list{display:grid;gap:11px}.thread{width:100%;color:var(--ink);text-align:left;background:linear-gradient(140deg,#152f43,#1128 <body><div class="app"><aside class="sidebar"><div class="brand"><b><span>STO</span>MAS.</b><small>VIDEN · ERFARING · HÅB</small></div><nav class="side-nav" id="side-nav" aria-label="Forum-navigation"></nav><div class="side-foot"><strong>Din stemme. Dit liv.</strong><p>En tryg, invitationsbaseret betaversion med fælles indlæg og moderation.</p></div></aside><div class="main"><header class="topbar"><strong>STOMAS · Fællesskab</strong><span class="demo" id="login-status">Indlæser …</span></header><div class="content"><div class="notice-msg" id="notice-msg" role="alert" aria-live="assertive" hidden></div><main id="content"></main></div></div></div><nav class="mobile-nav" id="mobile-nav" aria-label="Mobilnavigation"></nav><script>(()=>{'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEMBER_CATEGORIES=['Opereret','Medrørende','Fagprofessionel'];
const topics=[['Hverdagen','☀','Hverdag, træthed og gode rutiner'],['Tale og udstyr','◉','Taleventil, HME og hjælpemidler'],['Nyopereret','✚','Den første tid og nye spørgsmål'],['Motion og fritid','↗','Træning, ture og aktiviteter'],['Medrørende','♡','Samtaler, familie og relationer'],['Forslag til STOMAS','✦','Idéer til app og fællesskab']];
let page='home',me=null,setupRequired=false,registrationOpen=false,selectedTopic='Alle',q='',threads=[],more=false,selectedId='',currentThread=null,moderation=null,members=null,notificationStatus=null,pinnedThreads=[],verificationEmail='',inviteCode='',busy=false,bootError='';
async function api(path,method='GET',payload){const opts={method,credentials:'same-origin',headers:{}};if(payload!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(payload)}const res=await fetch('/api/forum'+path,opts);let j;try{j=await res.json()}catch{throw Error('Serveren gav et uventet svar (HTTP '+res.status+'). Prøv igen, og kontrollér mailopsætningen ved fejl 502.')};if(!res.ok)throw Error(j.error||`Serverfejl (${res.status}).`);return j;}
function toast(text,error=false){const el=$('notice-msg');el.textContent=text;el.classList.toggle('error',error);el.hidden=false;el.scrollIntoView({block:'start',behavior:'smooth'});}
function hideToast(){$('notice-msg').hidden=true;}
const date=s=>{try{return new Date(s).toLocaleDateString('da-DK',{year:'numeric',month:'short',day:'numeric'})}catch{return ''}};
const btn=(dest,label,primary=false)=>`<button type="button" class="btn ${primary?'btn-primary':''}" data-page="${dest}">${label}</button>`;
const status=s=>s==='pending'?'<span class="tag warn">Afventer godkendelse</span>':s==='rejected'?'<span class="tag warn">Ikke godkendt</span>':'';
function nav(){let items=[['home','⌂','Forum'],['new','＋','Skriv indlæg'],['profile','◯',me?'Min profil':'Log ind'],['rules','ⓘ','Regler']];if(me?.role==='admin')items.push(['admin','⚙','Moderation']);$('side-nav').innerHTML=items.map(([dest,ic,label])=>`<button type="button" class="${page===dest?'active':''}" data-page="${dest}"><span>${ic}</span>${label}</button>`).join('')+`<a href="/">← Til STOMAS-appen</a>`;$('mobile-nav').innerHTML=items.slice(0,4).map(([dest,ic,label])=>`<button type="button" class="${page===dest?'active':''}" data-page="${dest}"><span>${ic}</span>${label}</button>`).join('')+`<a href="/"><span>⌂</span>App</a>`;$('login-status').textContent=me?'Logget ind: '+me.nickname:(registrationOpen?'Åben tilmelding · e-mailbekræftelse':'Invitationsbaseret beta');}
function hero(){return `<section class="hero"><div class="eyebrow">STOMAS FÆLLESSKAB · BETA</div><h1>Ingen skal stå<br>alene med det hele.</h1><p>Et trygt sted for strubeløse og medrørende. Del dine erfaringer, stil spørgsmål, og vær med på dine egne præmisser.</p><span class="pill">${registrationOpen?"Fri tilmelding med e-mailbekræftelse":"Invitationsbaseret"}</span><span class="pill">Moderation før offentliggørelse</span><span class="pill">18+ beta</span></section>`;}
function categoryList(raw){
 if(Array.isArray(raw))return [...new Set(raw.filter(x=>MEMBER_CATEGORIES.includes(x)))];
 if(typeof raw==='string'&&raw.startsWith('[')){
   try{return categoryList(JSON.parse(raw))}catch(_){return []}
 }
 return MEMBER_CATEGORIES.includes(raw)?[raw]:[];
}
function categoryBadge(raw){
 return categoryList(raw).map(category=>'<span class="member-type" title="Selvvalgt brugerkategori – ingen faglig verificering">'+esc(category)+(category==='Fagprofessionel'?' · selvoplyst':'')+'</span>').join('');
}
function categoryField(id='memberCategory',selected=[]){
 const cats=categoryList(selected);
 return '<fieldset class="member-category-set"><legend>Brugerkategorier (vælg en eller flere)</legend><div class="member-category-choices">'+
 MEMBER_CATEGORIES.map(cat=>'<label class="member-category-option"><input type="checkbox" name="memberCategories" value="'+esc(cat)+'" '+(cats.includes(cat)?'checked':'')+'> '+esc(cat)+'</label>').join('')+
 '</div><small class="member-type-note">Vælg mindst én. Dine valgte kategorier vises ved dine indlæg og svar. De er selvoplyste; faglig uddannelse bliver ikke verificeret.</small></fieldset>';
}
function pinnedTag(t){return t?.pinned?'<span class="tag pin-tag">📌 Fastgjort</span>':'';}
function featuredWelcome(){
 if(!pinnedThreads.length)return '';
 const welcome=pinnedThreads.find(t=>/^velkommen\b/i.test(t.title))||pinnedThreads[0];
 const others=pinnedThreads.filter(t=>t.id!==welcome.id);
 return '<section class="welcome-feature" aria-label="Velkommen til STOMAS Fællesskab"><div class="welcome-eyebrow">📌 START HER · FASTGJORT INDLÆG</div>'+
 '<h2>'+esc(welcome.title==='Velkommen'?'Velkommen til STOMAS Fællesskab':welcome.title)+'</h2>'+
 '<p>Her kan vi dele erfaringer, stille spørgsmål og støtte hinanden – både som strubeløse, medrørende og fagprofessionelle. Læs velkomsten, og fortæl gerne lidt om dig selv.</p>'+
 '<div class="bar"><button type="button" class="btn btn-primary" data-thread="'+esc(welcome.id)+'">Læs velkomsten →</button></div>'+
 (others.length?'<div class="welcome-secondary">Andre fastgjorte: '+others.map(t=>'<button type="button" data-thread="'+esc(t.id)+'">'+esc(t.title)+'</button>').join('')+'</div>':'')+
 '</section>';
}
function cards(arr){return arr.length?arr.map(t=>`<button type="button" class="thread ${t.pinned?'pinned':''}" data-thread="${esc(t.id)}"><div class="thread-top"><span class="tag">${esc(t.category)}</span>${pinnedTag(t)}${status(t.status)}<span>${esc(date(t.createdAt))}</span></div><h3>${esc(t.title)}</h3><p>${esc(t.body.length>155?t.body.slice(0,154)+'…':t.body)}</p><div class="thread-bottom"><span>◯ ${esc(t.author)} ${categoryBadge(t.authorCategories||t.authorCategory)}</span><span>💬 ${t.replies} godkendte svar</span><span class="right">Læs tråd →</span></div></button>`).join(''):'<div class="empty">Ingen offentliggjorte indlæg endnu. Vi starter stille og roligt, så fællesskabet får en god begyndelse.</div>';}
function home(){const opts=topics.map(([name,icon,desc])=>`<button class="topic ${name===selectedTopic?'active':''}" type="button" data-topic="${esc(name)}"><span class="symbol">${icon}</span><strong>${esc(name)}</strong><small>${esc(desc)}</small></button>`).join('');return hero()+featuredWelcome()+`<div class="notice"><b>Velkommen til STOMAS Fællesskab.</b> ${registrationOpen?"Du kan oprette en konto uden invitationskode, når du bekræfter din e-mail.":"I betafasen inviteres medlemmer af STOMAS."} Nye indlæg og svar skal godkendes, før andre kan læse dem. E-mailadresser vises aldrig offentligt.</div><div class="sectiontop"><h2>Find dit emne</h2>${btn(me?'new':'profile',me?'＋ Skriv et indlæg':'Log ind for at skrive',true)}</div><div class="topics"><button class="topic all ${selectedTopic==='Alle'?'active':''}" type="button" data-topic="Alle"><span class="symbol">◎</span><strong>Alle emner</strong><small>Se alle diskussioner</small></button>${opts}</div><div class="sectiontop"><h2>Diskussioner</h2></div><div class="toolbar"><input class="search" id="forum-search" type="search" placeholder="Søg i diskussioner …" value="${esc(q)}" aria-label="Søg i diskussioner"><button class="btn" type="button" data-clear-search="1">Ryd søgning</button></div><div class="thread-list" id="thread-list">${cards(threads)}</div>${more?`<div class="bar"><button class="btn" type="button" data-load-more="1">Vis flere diskussioner</button></div>`:''}`;}
function thread(){const t=currentThread?.thread,r=currentThread?.replies||[];if(!t)return '<div class="empty">Tråden kunne ikke findes.</div>';return `<div class="mininav">${btn('home','← Til diskussioner')}</div><article class="panel"><span class="tag">${esc(t.category)}</span> ${pinnedTag(t)} ${status(t.status)}<h2 style="margin:13px 0">${esc(t.title)}</h2><div class="meta">Af ${esc(t.author)} ${categoryBadge(t.authorCategories||t.authorCategory)} · ${esc(date(t.createdAt))}</div><p class="postbody">${esc(t.body)}</p>${me?.role==='admin'&&t.status==='approved'?'<div class="pin-admin"><button type="button" class="btn" data-pin="'+esc(t.id)+'" data-set-pinned="'+(t.pinned?'0':'1')+'">'+(t.pinned?'📌 Frigør indlæg':'📌 Fastgør indlæg')+'</button><span class="muted">Kun administratorer kan ændre fastgørelsen.</span></div>':''}${me&&t.status==='approved'?`<button class="btn" data-report="thread:${esc(t.id)}">Anmeld indlæg</button>`:''}</article><div class="sectiontop"><h2>Svar (${r.length})</h2></div>${r.map(x=>`<div class="reply"><small>◯ ${esc(x.author)} ${categoryBadge(x.authorCategories||x.authorCategory)} · ${esc(date(x.createdAt))} ${status(x.status)}</small><p>${esc(x.body)}</p>${me&&x.status==='approved'?`<button class="smallbtn" data-report="reply:${esc(x.id)}">Anmeld svar</button>`:''}</div>`).join('')||'<div class="empty">Der er endnu ingen godkendte svar.</div>'}<div class="panel" style="margin-top:18px"><h3>Skriv et svar</h3>${me&&t.status==='approved'?`<form id="reply-form" class="fields"><div class="field"><label for="reply-body">Dit svar</label><textarea id="reply-body" name="body" required minlength="2" maxlength="1500" placeholder="Del din erfaring med respekt og omtanke …"></textarea><small>Dit svar læses af en moderator inden offentliggørelse.</small></div><div class="bar"><button type="submit" class="btn btn-primary">Send til godkendelse</button></div></form>`:me?'<p class="muted">Tråden afventer godkendelse. Du kan svare, når den er offentliggjort.</p>':`${btn('profile','Log ind for at svare',true)}`}</div>`;}
function newPost(){if(!me)return profile();return `<div class="mininav">${btn('home','← Til diskussioner')}</div><div class="panel"><div class="eyebrow">NY DISKUSSION</div><h2>Hvad vil du gerne dele?</h2><p class="muted">Indlægget bliver først synligt for andre efter STOMAS' godkendelse.</p><form id="post-form" class="fields"><div class="field"><label for="post-category">Emne</label><select id="post-category" name="category">${topics.map(([n])=>`<option>${esc(n)}</option>`).join('')}</select></div><div class="field"><label for="post-title">Overskrift</label><input id="post-title" name="title" minlength="5" maxlength="110" required placeholder="Dit spørgsmål eller din erfaring …"></div><div class="field"><label for="post-body">Dit indlæg</label><textarea id="post-body" name="body" required minlength="15" maxlength="2500" placeholder="Fortæl lidt mere …"></textarea><small>Del ikke CPR-numre, adresser, journaler eller andre personers private oplysninger. Medicinske råd bør afklares med fagpersoner.</small></div><div class="bar"><button type="submit" class="btn btn-primary">Send til godkendelse</button></div></form></div>`;}
function field(id,label,type='text',extra=''){return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" name="${id}" type="${type}" ${extra} required></div>`;}
function profile(){if(!me)return `<div class="panel"><div class="eyebrow">DIN BRUGER</div><h2>${setupRequired?'Opret ejerkonto':'Log ind til STOMAS'}</h2><p class="muted">${setupRequired?'Udfyld alle fire felter og tryk på Opret ejerkonto. Adgangskoden skal være mindst 12 tegn. Hvis noget ikke går igennem, vises fejlen tydeligt over formularen.':'Forumkontoen er særskilt fra din ChatGPT-konto. ${registrationOpen?"Du kan oprette en konto gratis og bekræfte din e-mail for at aktivere den.":"I betafasen kræver nye medlemmer en invitation fra STOMAS."}'}</p>${setupRequired?`<form id="setup-form" class="fields">${field('setupCode','Ejerens oprettelseskode','password','autocomplete="off"')}${field('nickname','Visningsnavn','text','minlength="2" maxlength="32"')}${field('email','E-mail','email','autocomplete="email"')}${field('password','Vælg adgangskode (mindst 12 tegn)','password','minlength="12" autocomplete="new-password"')}<p class="muted" style="font-size:13px;margin:0">Alle felter er obligatoriske. Den private oprettelseskode er ikke den samme som din nye adgangskode.</p><button type="submit" class="btn btn-primary">Opret ejerkonto</button></form>`:`<form id="login-form" class="fields">${field('email','E-mail','email','autocomplete="username"')}${field('password','Adgangskode','password','autocomplete="current-password"')}<div class="bar"><button type="submit" class="btn btn-primary">Log ind</button><button type="button" class="btn" data-page="register">${registrationOpen?'Opret gratis konto':'Jeg har en invitation'}</button></div></form>`}</div>`;return `<div class="panel"><div class="eyebrow">MIN PROFIL</div><h2>Hej, ${esc(me.nickname)} 👋</h2><p class="muted">${me.role==='admin'?'Administrator':'Medlem'} ${categoryBadge(me.memberCategories||me.memberCategory)} · Dit visningsnavn vises på dine godkendte indlæg. Din e-mail vises aldrig offentligt.</p><div class="bar">${btn('new','＋ Skriv indlæg',true)}${me.role==='admin'?btn('admin','Moderation'):''}<button class="btn" data-logout="1">Log ud</button></div></div><div class="panel member-type-panel" style="margin-top:15px"><h3>Mine brugerkategorier</h3><p class="muted ${me.memberCategory?'':'member-type-needed'}">${me.memberCategory?'Du kan ændre dine kategorier her.':'Vælg en eller flere kategorier, der beskriver dig i STOMAS Fællesskab.'} Dine valg vises ved dine godkendte indlæg. Vi verificerer endnu ikke faglige titler.</p><form id="category-form" class="fields">${categoryField('profile-member-category',me.memberCategories||me.memberCategory||[])}<button type="submit" class="btn btn-primary">Gem kategorier</button></form></div><div class="panel" style="margin-top:15px"><h3>Skift adgangskode</h3><form id="password-form" class="fields">${field('oldPassword','Nuværende adgangskode','password','autocomplete="current-password"')}${field('newPassword','Ny adgangskode (mindst 12 tegn)','password','minlength="12" autocomplete="new-password"')}<button type="submit" class="btn">Opdater adgangskode</button></form></div><div class="panel" style="margin-top:15px"><h3>Dine oplysninger</h3><p class="muted">Du kan eksportere dine indlæg og oplysninger som JSON. Medlemmer kan også slette deres konto; deres egne indlæg og svar bliver slettet.</p><div class="bar"><button type="button" class="btn" data-export="1">Eksportér mine data</button>${me.role!=='admin'?'<button type="button" class="btn danger-btn" data-page="delete-account">Slet min konto</button>':''}</div></div>`;}

function register(){
 if(me)return profile();
 const intro=registrationOpen?
   'Opret en gratis konto uden invitationskode. Vi sender et link til din e-mail, og du kan først skrive indlæg, når den er bekræftet.':
   'I den første fase kan voksne med en personlig invitationskode oprette sig. Fri tilmelding med e-mailbekræftelse er under klargøring.';
 const inviteField=registrationOpen?
   '<div class="field-honeypot" aria-hidden="true"><label>Hjemmeside<input name="website" tabindex="-1" autocomplete="off"></label></div>':
   field('invite','Din invitationskode','text','autocomplete="off"');
 return '<div class="mininav">'+btn('profile','← Til login')+'</div><div class="panel">'+
   '<div class="eyebrow">'+(registrationOpen?'FRI TILMELDING · VOKSNE':'INVITATION · BETA')+'</div>'+
   '<h2>Bliv medlem af STOMAS Fællesskab</h2><p class="muted">'+intro+'</p>'+
   '<form id="register-form" class="fields">'+inviteField+
   field('nickname','Visningsnavn','text','minlength="2" maxlength="32"')+
   categoryField('registration-member-category')+
   field('email','E-mail (vises ikke offentligt)','email','autocomplete="email"')+
   field('password','Vælg adgangskode (mindst 12 tegn)','password','minlength="12" autocomplete="new-password"')+
   '<label class="checkline"><input type="checkbox" id="adultConsent" required> Jeg er mindst 18 år.</label>'+
   '<label class="checkline"><input type="checkbox" id="privacyConsent" required> Jeg har læst <button type="button" class="inline-link" data-page="rules">forumregler og privatlivsinformation</button> og forstår, at indlæg og mine selvvalgte brugerkategorier kan blive offentlige efter moderation.</label>'+
   (registrationOpen?'<p class="email-note">Bekræftelseslinket gælder i 24 timer. Tjek også spam.</p>':'')+
   '<button type="submit" class="btn btn-primary">'+(registrationOpen?'Opret konto og send bekræftelse':'Opret konto')+'</button></form></div>';
}
function verificationPending(){
 return '<div class="mininav">'+btn('profile','← Til login')+'</div>'+
 '<section class="email-confirm-box"><div class="eyebrow">BEKRÆFT DIN E-MAIL</div>'+
 '<h2>Se efter en mail fra STOMAS 💙</h2>'+
 '<p>Hvis din konto kan oprettes, sender vi et engangslink til '+(verificationEmail?'<strong>'+esc(verificationEmail)+'</strong>':'din e-mail')+'. Åbn linket for at aktivere din konto. Det gælder i 24 timer.</p>'+
 '<p>Tjek også spam. Har du ikke modtaget mailen, kan du bede om en ny her:</p></section>'+
 '<div class="panel"><h3>Få nyt bekræftelseslink</h3>'+
 '<form class="fields" id="resend-form"><div class="field"><label for="resend-email">Din e-mail</label>'+
 '<input id="resend-email" type="email" name="email" value="'+esc(verificationEmail)+'" autocomplete="email" required></div>'+
 '<button class="btn btn-primary" type="submit">Send nyt link</button></form></div>';
}
function moderationView(){if(me?.role!=='admin')return profile();if(!moderation)return '<div class="panel">Henter moderation …</div>';const queue=(items,type)=>items.map(x=>`<div class="reply"><small>${esc(x.nickname)} ${categoryBadge(x.memberCategories||x.member_categories||x.member_category)} · ${esc(date(x.created_at))}</small><h3>${esc(x.title||x.thread_title||'Svar')}</h3><p class="postbody">${esc(x.body)}</p><div class="bar"><button class="btn btn-primary" data-moderate="${type}:approve:${esc(x.id)}">Godkend</button><button class="btn" data-moderate="${type}:reject:${esc(x.id)}">Afvis</button></div></div>`).join('')||'<p class="muted">Intet afventer.</p>';
return `<div class="eyebrow">STOMAS · ADMINISTRATION</div><h1>Moderation og invitationer</h1><div class="notice"><b>Husk:</b> Gennemgå personoplysninger og helbredsdetaljer i alle indlæg før godkendelse. Forummet er ikke overvåget døgnet rundt.</div><div class="panel"><h2>Fastgjorte indlæg</h2><p class="muted">Fastgjorte indlæg vises øverst i forummet. Åbn et godkendt indlæg for at fastgøre eller frigøre det. Kun administratorer kan ændre dette.</p>${pinnedThreads.length?pinnedThreads.map(t=>'<div class="reply"><strong>📌 '+esc(t.title)+'</strong><div class="bar"><button type="button" class="btn" data-thread="'+esc(t.id)+'">Åbn indlæg</button><button type="button" class="btn" data-pin="'+esc(t.id)+'" data-set-pinned="0">Frigør</button></div></div>').join(''):'<p class="muted">Ingen fastgjorte indlæg endnu.</p>'}</div><div class="panel" style="margin-top:15px"><h2>Mail ved nye brugere</h2><p class="muted">Nye brugeroprettelser sender en automatisk besked til <strong>info@stomas.dk</strong>. Mailen indeholder ingen personoplysninger. Hvis afsendelsen fejler, gemmes beskeden til genforsøg.</p>${notificationStatus?'<p><strong>Sendt: '+Number(notificationStatus.sent||0)+' · Afventer: '+Number(notificationStatus.pending||0)+'</strong></p>':'<p class="muted">Henter status …</p>'}${notificationStatus?.lastError?'<p class="muted">Sidste fejl: '+esc(notificationStatus.lastError)+'</p>':''}<button type="button" class="btn btn-primary" data-notify-test="1">Send testmail via Resend</button> <button type="button" class="btn" data-notify-retry="1">Send ventende notifikationer igen</button><small class="member-type-note">Testmailen sendes til info@stomas.dk via notify.stomas.dk. Mailbekræftelse er testet og aktiv.</small></div><div class="panel" style="margin-top:15px"><h2>Invitér et medlem</h2><p class="muted">Invitationen kan bruges én gang inden for 14 dage. Del den kun direkte med en person, du ønsker at invitere. Ingen e-mail sendes automatisk.</p><button type="button" class="btn btn-primary" data-invite="1">Opret invitationskode</button>${inviteCode?`<div class="invite-code"><code>${esc(inviteCode)}</code><button class="btn" data-copy-invite="1">Kopiér</button></div>`:''}</div><div class="panel" style="margin-top:15px"><h2>Indlæg til godkendelse (${moderation.threads.length})</h2>${queue(moderation.threads,'thread')}</div><div class="panel" style="margin-top:15px"><h2>Svar til godkendelse (${moderation.replies.length})</h2>${queue(moderation.replies,'reply')}</div><div class="panel" style="margin-top:15px"><h2>Anmeldelser (${moderation.reports.length})</h2>${moderation.reports.map(x=>`<div class="reply"><small>Af ${esc(x.nickname)} · ${esc(date(x.created_at))}</small><p>${esc(x.reason)}</p><small>${esc(x.target_type)}: ${esc(x.target_id)}</small><p class="muted">${esc(x.target_preview||'')}</p><div class="bar"><button type="button" class="btn danger-btn" data-moderate="${esc(x.target_type)}:reject:${esc(x.target_id)}">Skjul indhold</button><button type="button" class="btn" data-moderate="report:close:${esc(x.id)}">Markér som behandlet</button></div></div>`).join('')||'<p class="muted">Ingen åbne anmeldelser.</p>'}</div><div class="panel" style="margin-top:15px"><h2>Medlemmer (${(members||[]).length})</h2>${(members||[]).map(x=>`<div class="reply"><strong>${esc(x.nickname)}</strong> <small>${esc(x.role==='admin'?'Ejer':'Medlem')} ${categoryBadge(x.memberCategories||x.member_categories||x.member_category)} · ${esc(date(x.created_at))}</small><p class="muted">${esc(x.email)} ${x.banned?'· Blokeret':''}</p>${x.role!=='admin'?`<button type="button" class="btn ${x.banned?'':'danger-btn'}" data-ban="${esc(x.id)}:${x.banned?0:1}">${x.banned?'Fjern blokering':'Blokér konto'}</button>`:''}</div>`).join('')}</div>`;}
function rules(){return `<div class="eyebrow">TRYGHED OG FÆLLESSKAB</div><h1>Regler og privatliv</h1><p class="muted">Dette er et forum for voksne i betatest. ${registrationOpen?"Du kan oprette dig med e-mailbekræftelse.":"I den nuværende fase kræver oprettelse en invitation."} Alt indhold er brugerskabt, og STOMAS godkender indlæg og svar inden offentliggørelse.</p><div class="rules">${[
['Vis respekt','Tal ordentligt til andre. Ingen mobning, had, diskrimination, markedsføring eller personangreb.'],
['Beskyt private oplysninger','Skriv ikke CPR-numre, adresser, journaluddrag eller detaljer om andre uden deres samtykke. Et visningsnavn kan være et pseudonym.'],
['Erfaringer er ikke behandling','Del egne erfaringer uden at give andre personlige behandlingsanvisninger eller diagnoser. STOMAS er ikke en sundhedstjeneste.'],
['Brugerkategorier','Du kan vælge en eller flere af kategorierne Opereret, Medrørende og Fagprofessionel. De er selvoplyste og vises offentligt ved indlæg og svar. Vi har endnu ikke faglig verifikation; betegnelsen Fagprofessionel er derfor ikke et kvalitetsstempel.'],
['Ved akut fare','Ring 112 ved akut vejrtrækningsbesvær. Forumindlæg er ikke en akut hjælpetjeneste og overvåges ikke døgnet rundt.'],
['Hvad gemmer vi?','STOMAS opbevarer e-mail, visningsnavn, en beskyttet adgangskodeafledning, indlæg, svar, sessioner og eventuelle anmeldelser hos Cloudflare. Ved åben oprettelse lagres engangstokens som hash, og de udløber efter 24 timer. Andre medlemmer ser ikke din e-mail.'],
['Dine rettigheder','Du kan ændre adgangskode, eksportere dine egne data og som medlem slette din konto og dine indlæg. Kontakt STOMAS via stomas.dk for spørgsmål eller privatlivsanmodninger.'],
['Moderation og synlighed','Moderator kan godkende og afvise indhold. Godkendte indlæg er offentligt tilgængelige og kan også læses uden login.'],
['Børn og unge','Betaforummet er kun for personer på 18 år eller derover. Børns identitet og helbredsoplysninger må ikke deles.']
].map(([a,b])=>`<div class="rule"><strong>${esc(a)}</strong><p>${esc(b)}</p></div>`).join('')}</div><div class="notice"><b>Vigtigt før du deler:</b> Helbredsoplysninger er følsomme. Del kun, hvad du ønsker offentliggjort efter moderation. STOMAS kan ikke garantere, at andre ikke kopierer offentlige indlæg.</div><div class="bar">${btn('home','← Til fællesskabet')} <a class="btn" href="https://stomas.dk/kontakt/" target="_blank" rel="noopener">Kontakt STOMAS</a></div>`;}
function deleteAccount(){if(!me||me.role==='admin')return profile();return `<div class="panel"><h2>Slet min konto</h2><p>Dine tråde og svar bliver slettet. Dette kan ikke fortrydes. Hvis andre har svaret på en tråd, vil svarene også blive slettet sammen med den.</p><form id="delete-form" class="fields">${field('password','Bekræft med din adgangskode','password','autocomplete="current-password"')}<label class="checkline"><input type="checkbox" id="confirmDelete" required> Jeg forstår, at denne handling sletter indhold permanent.</label><div class="bar"><button class="btn danger-btn" type="submit">Slet konto og indlæg</button>${btn('profile','Annuller')}</div></form></div>`;}
function pageHtml(){switch(page){case 'home':return home();case 'thread':return thread();case 'new':return newPost();case 'profile':return profile();case 'register':return register();case 'verification-pending':return verificationPending();case 'rules':return rules();case 'admin':return moderationView();case 'delete-account':return deleteAccount();default:return home();}}
function render(){nav();$('content').innerHTML=pageHtml()+`<div class="footer">© STOMAS · Fællesskabets betaversion · Kun for voksne på 18+ · <a href="/">Til STOMAS-appen</a> · <button class="inline-link" data-page="rules">Regler og privatliv</button> · Ved akut åndenød: ring 112.</div>`;}
async function loadPinned(){const x=await api('/pinned');pinnedThreads=x.threads||[];}
async function loadThreads(){const params=new URLSearchParams();if(selectedTopic!=='Alle')params.set('category',selectedTopic);if(q)params.set('q',q);const x=await api('/threads?'+params);threads=x.threads;more=x.hasMore;}
async function loadModeration(){const [m,u,n]=await Promise.all([api('/moderation'),api('/members'),api('/notifications')]);moderation=m;members=u.members;notificationStatus=n;}
async function go(p){hideToast();page=p;window.scrollTo(0,0);try{if(p==='home')await Promise.all([loadThreads(),loadPinned()]);if(p==='admin'&&me?.role==='admin')await Promise.all([loadModeration(),loadPinned()]);if(p==='thread'){currentThread=await api('/threads/'+encodeURIComponent(selectedId));}}catch(e){toast(e.message,true);}render();}
async function boot(){
 let token='';
 if(location.hash.startsWith('#verify=')){
   try{token=decodeURIComponent(location.hash.slice(8))}catch(_){}
   history.replaceState(null,'',location.pathname+location.search);
 }
 try{
   const x=await api('');
   setupRequired=x.setupRequired;registrationOpen=!!x.registrationOpen;me=x.viewer;
   if(setupRequired)page='profile';
   await Promise.all([loadThreads(),loadPinned()]);
 }catch(e){bootError=e.message}
 render();
 if(bootError){toast('Forummet kunne ikke forbindes til serveren: '+bootError,true);return}
 if(token){
   try{
     await writeAction('verify-email',{token});
     await go('home');
     toast('Din e-mail er bekræftet. Velkommen til STOMAS Fællesskab! 💙');
   }catch(e){
     page='verification-pending';render();
     toast(e.message||'Linket er ugyldigt eller udløbet. Bed om et nyt link.',true);
   }
 }
}
async function writeAction(name,payload){const x=await api('/'+name,'POST',payload);if(x.viewer)me=x.viewer;return x;}
async function safeAction(fn,form=null){
 if(busy)return;
 busy=true;
 const button=form?.querySelector('button[type="submit"]');
 const original=button?.textContent;
 if(button){button.disabled=true;button.textContent='Arbejder …';form.setAttribute('aria-busy','true');}
 try{await fn();}catch(e){toast(e.message||'Der opstod en fejl. Prøv igen.',true)}finally{
   busy=false;
   if(form?.isConnected){form.removeAttribute('aria-busy');}
   if(button?.isConnected){button.disabled=false;button.textContent=original;}
 }
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-pin],[data-page],[data-topic],[data-thread],[data-logout],[data-invite],[data-moderate],[data-copy-invite],[data-report],[data-export],[data-clear-search],[data-load-more],[data-ban],[data-notify-retry],[data-notify-test]');if(!el)return;
 if(el.dataset.pin){
    safeAction(async()=>{
      const shouldPin=el.dataset.setPinned==='1';
      const x=await writeAction('pin',{id:el.dataset.pin,pinned:shouldPin});
      await Promise.all([loadPinned(),loadThreads()]);
      if(page==='thread'&&currentThread?.thread?.id===el.dataset.pin)currentThread=await api('/threads/'+encodeURIComponent(selectedId));
      render();toast(shouldPin?'Indlægget er nu fastgjort øverst.':'Indlægget er frigjort.');
    });return;
 }
 if(el.dataset.page){go(el.dataset.page);return}
 if(el.dataset.topic){selectedTopic=el.dataset.topic;q='';go('home');return}
 if(el.dataset.thread){selectedId=el.dataset.thread;go('thread');return}
 if(el.dataset.clearSearch){q='';go('home');return}
 if(el.dataset.logout){safeAction(async()=>{await writeAction('logout',{});me=null;moderation=null;inviteCode='';await go('home');toast('Du er logget ud.')});return}
 if(el.dataset.notifyTest){safeAction(async()=>{const x=await writeAction('notifications/test',{});toast(x.message||'Testmail afsendt.');});return}
 if(el.dataset.notifyRetry){safeAction(async()=>{const x=await writeAction('notifications/retry',{});await loadModeration();render();toast(x.attempted?('Forsøgt sendt: '+x.attempted+' · Lykkedes: '+x.succeeded):'Ingen ventende notifikationer.');});return}
 if(el.dataset.invite){safeAction(async()=>{const x=await writeAction('invites',{});inviteCode=x.invite;render();toast('Invitationskoden er oprettet. Gem og del den sikkert – den vises kun nu.')});return}
 if(el.dataset.copyInvite){navigator.clipboard?.writeText(inviteCode).then(()=>toast('Koden er kopieret.')).catch(()=>toast('Markér koden og kopiér den.'));return}
 if(el.dataset.loadMore){safeAction(async()=>{const params=new URLSearchParams({offset:String(threads.length)});if(selectedTopic!=='Alle')params.set('category',selectedTopic);if(q)params.set('q',q);const x=await api('/threads?'+params);threads.push(...x.threads);more=x.hasMore;render()});return}
 if(el.dataset.ban){safeAction(async()=>{const [id,v]=el.dataset.ban.split(':');if(v==='1'&&!confirm('Blokér denne konto? Brugerens indhold skjules for andre.'))return;await writeAction('members',{id,banned:v==='1'});await loadModeration();render();toast('Medlemsstatus er opdateret.')});return}
 if(el.dataset.moderate){safeAction(async()=>{const [type,action,id]=el.dataset.moderate.split(':');await writeAction('moderation',{type,action,id});await loadModeration();render();toast('Moderationshandlingen er gemt.')});return}
 if(el.dataset.report){const [type,id]=el.dataset.report.split(':');const reason=prompt('Hvorfor vil du anmelde dette indhold? (8–600 tegn)');if(!reason)return;safeAction(async()=>{await writeAction('reports',{type,id,reason});toast('Tak. Anmeldelsen er sendt til moderation.')});return}
 if(el.dataset.export){safeAction(async()=>{const x=await api('/export');const blob=new Blob([JSON.stringify(x,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='stomas-mine-oplysninger.json';a.click();URL.revokeObjectURL(url);toast('Dine oplysninger er klar som fil.')});return}
});
document.addEventListener('input',e=>{if(e.target.id==='forum-search')q=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='forum-search')go('home')});
document.addEventListener('keydown',e=>{if(e.target.id==='forum-search'&&e.key==='Enter'){e.preventDefault();go('home')}});
document.addEventListener('invalid',e=>{
 const input=e.target,form=input.closest('form');
 if(!form||!['setup-form','register-form','login-form','password-form'].includes(form.id)||form.querySelector(':invalid')!==input)return;
 const label=form.querySelector('label[for="'+input.id+'"]')?.textContent||'feltet';
 let message='Kontrollér '+label.toLowerCase()+'.';
 if(input.validity.valueMissing)message='Du mangler at udfylde '+label.toLowerCase()+'.';
 else if(input.validity.tooShort)message='Adgangskoden skal være mindst 12 tegn, og visningsnavnet mindst 2 tegn.';
 else if(input.validity.typeMismatch)message='Skriv en gyldig e-mailadresse.';
 toast(message,true);
},true);
document.addEventListener('submit',e=>{const form=e.target;if(!['setup-form','register-form','resend-form','login-form','password-form','category-form','post-form','reply-form','delete-form'].includes(form.id))return;e.preventDefault();const get=n=>form.querySelector(`[name="${n}"]`)?.value||'';const getCategories=()=>[...form.querySelectorAll('input[name="memberCategories"]:checked')].map(x=>x.value);
 safeAction(async()=>{
  if(form.id==='setup-form'){await writeAction('setup',{setupCode:get('setupCode'),nickname:get('nickname'),email:get('email'),password:get('password')});setupRequired=false;await go('profile');toast('Ejerkontoen er oprettet. Du kan nu invitere medlemmer via Moderation.');return}
  if(form.id==='register-form'){
   const memberCategories=getCategories();
   if(!memberCategories.length){toast('Vælg mindst én brugerkategori.',true);return}
   const email=get('email');
   const result=await writeAction('register',{invite:registrationOpen?'':get('invite'),website:get('website'),nickname:get('nickname'),memberCategories,email,password:get('password'),adultConsent:$('adultConsent').checked,privacyConsent:$('privacyConsent').checked});
   if(result.verificationRequired){
     verificationEmail=email;
     await go('verification-pending');
     toast(result.message||'Tjek din indbakke for et bekræftelseslink.');
     return;
   }
   await go('profile');toast('Velkommen til STOMAS Fællesskab!');return;
 }
 if(form.id==='resend-form'){
   const result=await writeAction('resend-verification',{email:get('email')});
   verificationEmail=get('email');render();
   toast(result.message||'Hvis din konto afventer bekræftelse, sender vi et nyt link.');
   return;
 }
  if(form.id==='login-form'){await writeAction('login',{email:get('email'),password:get('password')});await go('home');toast('Du er logget ind.');return}
  if(form.id==='category-form'){const memberCategories=getCategories();if(!memberCategories.length){toast('Vælg mindst én brugerkategori.',true);return}await writeAction('profile',{memberCategories});render();toast('Dine brugerkategorier er gemt.');return}
  if(form.id==='password-form'){await writeAction('password',{oldPassword:get('oldPassword'),newPassword:get('newPassword')});me=null;await go('profile');toast('Adgangskoden er ændret. Log ind igen.');return}
  if(form.id==='post-form'){const x=await writeAction('threads',{category:get('category'),title:get('title'),body:get('body')});selectedId=x.id;await go('thread');toast('Dit indlæg er modtaget og afventer godkendelse.');return}
  if(form.id==='reply-form'){await writeAction(`threads/${selectedId}/replies`,{body:get('body')});await go('thread');toast('Dit svar er modtaget og afventer godkendelse.');return}
  if(form.id==='delete-form'){if(!$('confirmDelete')?.checked)return;await writeAction('delete-account',{password:get('password')});me=null;await go('home');toast('Din konto er slettet.');return}
 },form);
});
boot();
})();
</script><script defer src="/pwa-install.js"></script></body></html>
