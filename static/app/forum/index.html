<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091725">
<meta name="robots" content="noindex,nofollow">
<title>STOMAS Fællesskab · Demo</title>
<meta name="description" content="Prøv STOMAS Fællesskab – en interaktiv, lokal forumdemo for strubeløse og medrørende.">
<style>
:root{color-scheme:dark;--bg:#081521;--ink:#f2f8fd;--muted:#a9bdcb;--cyan:#54d5db;--line:#2b4c60;--surface:#112a3d;--surface2:#163549}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#07121d,#0b1d2d 65%,#102b3a)}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#8feaf0}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #7df3eb;outline-offset:3px}h1,h2,h3,p{margin-top:0}h1,h2,h3{line-height:1.2}small{font-size:.79rem}.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#0b2030;border-right:1px solid #274458;padding:25px 17px;display:flex;flex-direction:column;gap:21px}.brand{padding:3px 14px}.brand b{font-size:28px;letter-spacing:.035em}.brand b span{color:var(--cyan)}.brand small{display:block;font-size:10px;letter-spacing:.18em;color:#a6cad5}.side-nav{display:grid;gap:7px}.side-nav button,.side-nav a{display:flex;align-items:center;gap:11px;min-height:47px;text-align:left;border:0;border-radius:12px;padding:11px 13px;background:none;color:#bad2de;text-decoration:none;font-weight:750}.side-nav button:hover,.side-nav a:hover,.side-nav .active{background:#174455;color:#a2f5f3}.side-foot{margin-top:auto;color:#adc3cf;font-size:12px;border-top:1px solid var(--line);padding:16px 9px 0}.main{min-width:0}.topbar{min-height:74px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(20px,4vw,56px);border-bottom:1px solid #2d4858;background:#0b1c2bc7}.topbar strong{font-size:13px;text-transform:uppercase;letter-spacing:.11em;color:#a6c5d1}.demo{display:inline-flex;align-items:center;font-size:12px;line-height:1.2;border:1px solid #7a704d;color:#f1db9d;background:#584b251f;padding:7px 11px;border-radius:99px}.content{max-width:1160px;margin:auto;padding:34px clamp(20px,4vw,56px) 120px}.hero{border:1px solid #286074;border-radius:24px;padding:clamp(24px,4vw,43px);background:radial-gradient(circle at 91% 10%,#39a9b13a,transparent 36%),linear-gradient(125deg,#163b53,#0f293d);margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:#7fe5e5;font-weight:850}.hero h1{margin:12px 0 13px;font-size:clamp(31px,4.5vw,48px);letter-spacing:-.035em}.hero p{color:#d1e0e9;max-width:770px;margin-bottom:18px}.pill{display:inline-block;border:1px solid #367180;border-radius:99px;padding:6px 10px;color:#9eebed;font-size:12px;margin-right:7px}.notice{border:1px solid #675b42;background:#2b2a28;border-radius:14px;padding:16px 18px;color:#f2dfb3;font-size:14px;margin:18px 0 23px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:12px;margin:22px 0}.search{min-height:46px;border:1px solid #416276;background:#112b3d;color:var(--ink);border-radius:12px;padding:11px 14px;min-width:220px;flex:1;max-width:530px}.btn{border:1px solid #467082;border-radius:12px;padding:10px 15px;background:#1b4056;color:#ebfdff;font-weight:750;min-height:44px}.btn:hover{background:#28566a}.btn-primary{background:#75d8d9;color:#062b36;border-color:#75d8d9}.btn-primary:hover{background:#9df2f0}.btn:disabled{opacity:.5;cursor:not-allowed}.sectiontop{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:25px 0 13px}.sectiontop h2{margin:0;font-size:22px}.muted{color:var(--muted)}.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.topic{background:linear-gradient(140deg,#173548,#102739);border:1px solid var(--line);text-align:left;border-radius:16px;padding:16px;color:var(--ink);min-height:132px}.topic:hover,.topic.active{border-color:#80d6dc;background:#1e4858}.topic .symbol{font-size:24px;color:#70e0e4}.topic strong{display:block;margin:10px 0 4px;font-size:15px}.topic small{color:#9ab8c6}.topic.all{border-style:dashed}.thread-list{display:grid;gap:11px}.thread{width:100%;color:var(--ink);text-align:left;background:linear-gradient(140deg,#152f43,#11283a);border:1px solid #304e61;padding:17px 19px;border-radius:17px}.thread:hover{border-color:#78c4d0}.thread-top,.thread-bottom{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.thread-top{font-size:12px;color:#a3bfcc}.tag{display:inline-block;padding:4px 9px;border-radius:99px;color:#95e9ec;background:#1c4854;font-size:11px;font-weight:800}.thread h3{font-size:18px;margin:12px 0 8px}.thread p{font-size:14px;color:#b6cad7;margin:0 0 11px}.thread-bottom{font-size:12px;color:#93b6c6}.panel{background:linear-gradient(150deg,#142e42,#102737);border:1px solid #31546a;border-radius:20px;padding:clamp(20px,3.5vw,29px)}.panel h2{font-size:27px}.meta{color:#9dbdc9;font-size:13px;margin:12px 0 20px}.postbody{white-space:pre-wrap;color:#d8e7f0;line-height:1.7}.reply{margin-top:11px;padding:14px 17px;border:1px solid #315465;border-radius:12px;background:#152f3e}.reply p{white-space:pre-wrap;margin:8px 0 0;color:#d4e7ed}.reply small{color:#9cc1c9}.fields{display:grid;gap:14px}.field{display:grid;gap:6px}.field label{font-weight:750}.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid #416679;border-radius:12px;background:#091f30;color:var(--ink);padding:11px 13px}.field textarea{min-height:145px;resize:vertical}.field small{color:#b1c3d2}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:17px}.empty{padding:25px;border:1px dashed #4c6573;border-radius:14px;color:#b3d0dc}.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.rule{border:1px solid #315367;background:#143246;border-radius:15px;padding:19px}.rule strong{color:#88e4e8}.rule p{color:#c7d9e1;margin:9px 0 0}.mininav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}.mobile-nav{display:none}.footer{border-top:1px solid #29485b;color:#98b5c2;font-size:12px;margin-top:36px;padding-top:18px}#announce{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}.error{color:#ffadaf;font-size:13px}.right{margin-left:auto}
@media(max-width:1000px){.app{grid-template-columns:200px minmax(0,1fr)}.topics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.app{display:block}.sidebar{display:none}.content{padding:22px 16px 112px}.topbar{min-height:65px;padding:12px 17px}.topbar strong{font-size:11px}.hero{padding:24px 18px}.topics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.topic{padding:14px;min-height:126px}.topic strong{font-size:14px}.rules{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;z-index:20;bottom:0;left:0;right:0;background:#0b1f2fee;border-top:1px solid #315368;backdrop-filter:blur(12px);justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.mobile-nav button,.mobile-nav a{border:0;background:transparent;color:#b1d2df;min-width:56px;padding:7px 4px;text-align:center;text-decoration:none;font-size:10px;display:grid;justify-items:center;gap:2px}.mobile-nav .active{color:#7ceae9}.mobile-nav span{font-size:20px}.thread h3{font-size:17px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><b><span>STO</span>MAS.</b><small>VIDEN · ERFARING · HÅB</small></div><nav class="side-nav" aria-label="Fællesskabets navigation" id="side-nav"></nav><div class="side-foot"><strong>Dit liv. Din stemme.</strong><p>Forumdemo til afprøvning. Ingen brugeroplysninger eller indlæg sendes til STOMAS.</p></div></aside>
<div class="main"><header class="topbar"><strong>STOMAS · Fællesskab</strong><span class="demo">● Demo · Ikke offentlige indlæg</span></header><main class="content" id="content"></main></div>
</div><nav class="mobile-nav" aria-label="Mobilnavigation" id="mobile-nav"></nav><div aria-live="polite" id="announce"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s||'').toLocaleLowerCase('da-DK');
const topics=[['Hverdagen','☀','Hverdag, træthed og gode rutiner'],['Tale og udstyr','◉','Taleventil, HME og hjælpemidler'],['Nyopereret','✚','Den første tid og nye spørgsmål'],['Motion og fritid','↗','Træning, ture og aktiviteter'],['Medrørende','♡','Samtaler, familie og relationer'],['Forslag til STOMAS','✦','Idéer til app og fællesskab']];
const samples=[
{id:'demo1',topic:'Hverdagen',author:'Eksempelbruger',title:'Hvordan får I energi nok til sociale aftaler?',body:'Jeg oplever, at det kan være svært at sige ja til alt. Hvilke små ændringer hjælper jer med at få en god dag uden at blive helt drænet?',replies:[{author:'STOMAS · eksempel',body:'Det er et godt emne at dele erfaringer om. Husk, at behov og overskud er forskellige.'}],fake:true},
{id:'demo2',topic:'Tale og udstyr',author:'Eksempelbruger',title:'Hvad har I altid med i tasken?',body:'Lad os samle idéer til en praktisk lille taske med de ting, vi har brug for i hverdagen. Hvad giver jer tryghed?',replies:[],fake:true},
{id:'demo3',topic:'Medrørende',author:'Eksempelbruger',title:'Hvordan lærer vi familien den nye stemme at kende?',body:'Har I gode erfaringer med at gøre samtaler nemmere i støj og med flere mennesker omkring bordet?',replies:[],fake:true},
{id:'demo4',topic:'Nyopereret',author:'Eksempelbruger',title:'Hvad ville I ønske, I vidste i begyndelsen?',body:'En tråd med erfaringer og håb til nye medlemmer. Skriv gerne et lille praktisk råd eller noget, der gjorde dig mere tryg.',replies:[],fake:true},
{id:'demo5',topic:'Motion og fritid',author:'Eksempelbruger',title:'Hvad giver jer lyst til at komme ud?',body:'Det kan være en kort tur, havearbejde eller et større mål. Hvad motiverer jer til at holde jer i gang?',replies:[],fake:true},
{id:'demo6',topic:'Forslag til STOMAS',author:'STOMAS · eksempel',title:'Hvad savner du i appen?',body:'Er der en guide, en funktion eller en anden slags støtte, du gerne vil se i STOMAS?',replies:[],fake:true}
];
let posts=[...samples],page='home',topic='Alle',term='',threadId='',nickname='Gæst',interest='Strubeløs',message='';let formDraft={title:'',body:'',topic:'Hverdagen'},replyDraft='';
const nav=[['home','⌂','Fællesskab'],['new','＋','Nyt indlæg'],['profile','◯','Min profil'],['rules','ⓘ','Retningslinjer']];
function navs(){const item=([id,icon,label])=>`<button type="button" data-page="${id}" class="${page===id?'active':''}"><span aria-hidden="true">${icon}</span>${label}</button>`;$('side-nav').innerHTML=nav.map(item).join('')+`<a href="/">← Til STOMAS-appen</a>`;$('mobile-nav').innerHTML=[['home','⌂','Forum'],['new','＋','Skriv'],['profile','◯','Profil'],['rules','ⓘ','Info']].map(item).join('')+`<a href="/"><span>⌂</span>App</a>`}
const btn=(p,label,primary=false)=>`<button class="btn ${primary?'btn-primary':''}" data-page="${p}">${label}</button>`;
const warning=`<div class="notice"><b>Dette er en test.</b> Indlæg, svar og din profil vises kun i denne åbne browserfane. De offentliggøres ikke og forsvinder, når du genindlæser siden. Ingen login eller rigtig database er koblet på endnu.</div>`;
function home(){const filtered=posts.filter(p=>(topic==='Alle'||p.topic===topic)&&(!term||norm([p.title,p.body,p.topic,p.author].join(' ')).includes(norm(term))));return `<section class="hero"><div class="eyebrow">STOMAS FÆLLESSKAB</div><h1>Ingen skal stå<br>alene med det hele.</h1><p>Et kommende forum for strubeløse og medrørende. Del erfaringer, stil spørgsmål og lær af andre — med respekt for, at vi alle har forskellige forløb.</p><span class="pill">Strubeløse</span><span class="pill">Medrørende</span><span class="pill">Erfaringer og støtte</span></section>${warning}<div class="sectiontop"><h2>Find dit emne</h2>${btn('new','＋ Prøv at skrive et indlæg',true)}</div><div class="topics"><button class="topic all ${topic==='Alle'?'active':''}" data-topic="Alle"><span class="symbol">◎</span><strong>Alle emner</strong><small>Se hele fællesskabet</small></button>${topics.map(([name,icon,desc])=>`<button class="topic ${topic===name?'active':''}" data-topic="${esc(name)}"><span class="symbol">${icon}</span><strong>${esc(name)}</strong><small>${esc(desc)}</small></button>`).join('')}</div><div class="sectiontop"><h2>Diskussioner <small class="muted">(${filtered.length})</small></h2></div><div class="toolbar"><input class="search" id="forum-search" type="search" placeholder="Søg i diskussioner …" value="${esc(term)}" aria-label="Søg i diskussioner"><button class="btn" data-topic="Alle">Ryd emnefilter</button></div><div id="thread-list" class="thread-list">${cards(filtered)}</div>`}
function cards(arr){return arr.length?arr.map(p=>`<button class="thread" data-thread="${esc(p.id)}"><div class="thread-top"><span class="tag">${esc(p.topic)}</span><span>${p.fake?'Eksempeltråd':'Kun i din browser'}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.body.length>160?p.body.slice(0,159)+'…':p.body)}</p><div class="thread-bottom"><span>◯ ${esc(p.author)}</span><span>💬 ${p.replies.length} svar</span><span class="right">Læs tråd →</span></div></button>`).join(''):`<div class="empty">Ingen indlæg matcher. Prøv en anden søgning eller et andet emne.</div>`}
function thread(){const p=posts.find(x=>x.id===threadId);if(!p)return home();return `<div class="mininav">${btn('home','← Tilbage til diskussioner')}</div><article class="panel"><div class="tag">${esc(p.topic)}</div><h2 style="margin:13px 0">${esc(p.title)}</h2><div class="meta">Skrevet af ${esc(p.author)} · ${p.fake?'Eksempeltråd':'Lokal prøvevisning'}</div><p class="postbody">${esc(p.body)}</p></article><div class="sectiontop"><h2>Svar i tråden (${p.replies.length})</h2></div>${p.replies.length?p.replies.map(r=>`<div class="reply"><small>◯ ${esc(r.author)} · ${p.fake?'Eksempel eller lokalt prøvesvar':'Lokalt prøvesvar'}</small><p>${esc(r.body)}</p></div>`).join(''):'<div class="empty">Ingen svar endnu. Du kan afprøve svarfunktionen nedenfor.</div>'}<div class="panel" style="margin-top:16px"><h3>Prøv at skrive et svar</h3><p class="muted">Dit svar er kun synligt her i browserfanen.</p><div class="field"><label for="reply">Dit svar</label><textarea id="reply" maxlength="1500" placeholder="Skriv et venligt svar …">${esc(replyDraft)}</textarea></div><div class="bar"><button class="btn btn-primary" data-action="reply">Vis mit prøvesvar</button><span id="reply-error" class="error" aria-live="polite"></span></div></div>${warning}`}
function newPost(){return `<div class="mininav">${btn('home','← Til diskussioner')}</div><div class="panel"><div class="eyebrow">NY DISKUSSION · DEMO</div><h2>Prøv at skrive et indlæg</h2><p class="muted">Det bliver ikke sendt til andre. Når det rigtige forum åbner, vil du kunne oprette en konto og vælge et offentligt brugernavn.</p><div class="fields"><div class="field"><label for="post-category">Vælg emne</label><select id="post-category">${topics.map(([name])=>`<option value="${esc(name)}" ${formDraft.topic===name?'selected':''}>${esc(name)}</option>`).join('')}</select></div><div class="field"><label for="post-title">Overskrift</label><input id="post-title" maxlength="110" value="${esc(formDraft.title)}" placeholder="Hvad vil du gerne spørge om eller dele?"><small>5–110 tegn</small></div><div class="field"><label for="post-body">Dit indlæg</label><textarea id="post-body" maxlength="2500" placeholder="Del dine egne erfaringer eller stil dit spørgsmål …">${esc(formDraft.body)}</textarea><small>Mindst 15 tegn · maks. 2500 tegn. Undlad navne, CPR-numre og fortrolige helbredsoplysninger.</small></div></div><div class="bar"><button class="btn btn-primary" data-action="post">Vis mit prøveindlæg</button>${btn('home','Annuller')}<span id="post-error" class="error" aria-live="polite"></span></div></div>${warning}`}
function profile(){return `<div class="panel"><div class="eyebrow">MIN BRUGER · DEMO</div><h2>Din kommende profil</h2><p class="muted">Vi vil gerne gøre det muligt at deltage med et valgfrit brugernavn, så du ikke behøver dele dit fulde navn. Her kan du prøve udseendet, men der oprettes ingen rigtig konto.</p><div class="fields"><div class="field"><label for="profile-name">Visningsnavn (kun i denne fane)</label><input id="profile-name" maxlength="30" value="${esc(nickname)}" autocomplete="off"></div><div class="field"><label for="profile-role">Jeg deltager som</label><select id="profile-role">${['Strubeløs','Medrørende','Fagperson','Interesseret'].map(x=>`<option ${interest===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="bar"><button class="btn btn-primary" data-action="profile">Prøv profilen</button><span id="profile-error" class="error" aria-live="polite"></span></div><div class="reply"><small>Forhåndsvisning</small><p>◯ ${esc(nickname)} · ${esc(interest)}<br>Ingen offentlig konto eller profil endnu.</p></div></div>${warning}`}
function rules(){return `<div class="eyebrow">KOMMENDE FÆLLESSKAB</div><h1>Rammer for et trygt forum</h1><p class="muted">Reglerne er et forslag, som skal være klar før en offentlig lancering.</p><div class="rules">${[
['Vis respekt','Ingen personangreb, diskrimination eller udskamning. Du må gerne være uenig, men tal ordentligt.'],
['Beskyt privatlivet','Del ikke CPR-numre, patientjournaler, adresser eller billeder af andre uden udtrykkeligt samtykke.'],
['Erfaringer er ikke behandling','Del gerne, hvad der virker for dig. Undlad at stille diagnoser eller give andre personlige behandlingsanvisninger.'],
['Akut hjælp er ikke et forum','Ved akut vejrtrækningsbesvær ring 112. Forummet bliver ikke overvåget døgnet rundt.'],
['Moderation og anmeldelse','Offentlige indlæg skal kunne anmeldes. STOMAS skal kunne skjule indhold og håndtere konflikter.'],
['Brugerkontrol','Før offentlig åbning skal der være verificeret login, mulighed for at slette konto og indlæg, samt tydelige privatlivsvilkår.']
].map(([h,t])=>`<div class="rule"><strong>${esc(h)}</strong><p>${esc(t)}</p></div>`).join('')}</div>${warning}<div class="bar">${btn('home','← Til fællesskab')}</div>`}
function render(){navs();$('content').innerHTML=(page==='home'?home():page==='thread'?thread():page==='new'?newPost():page==='profile'?profile():rules())+`<div class="footer">© STOMAS · Fællesskabsdemo · Ingen data sendes eller offentliggøres. Ved akut åndenød: ring 112. · <a href="/">Tilbage til STOMAS-appen</a></div>`;if(page==='home'){$('forum-search').addEventListener('input',e=>{term=e.target.value;const filtered=posts.filter(p=>(topic==='Alle'||p.topic===topic)&&(!term||norm([p.title,p.body,p.topic,p.author].join(' ')).includes(norm(term))));$('thread-list').innerHTML=cards(filtered)})}}
function go(p){page=p;window.scrollTo(0,0);render()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-page]');if(a){if(page==='new'){formDraft.title=$('post-title')?.value||'';formDraft.body=$('post-body')?.value||'';formDraft.topic=$('post-category')?.value||'Hverdagen'}go(a.dataset.page);return}const t=e.target.closest('[data-topic]');if(t){topic=t.dataset.topic;go('home');return}const th=e.target.closest('[data-thread]');if(th){threadId=th.dataset.thread;replyDraft='';go('thread');return}const act=e.target.closest('[data-action]');if(!act)return;
if(act.dataset.action==='profile'){const s=$('profile-name').value.trim(),x=$('profile-role').value;if(s.length<2||s.length>30){$('profile-error').textContent='Vælg et navn på 2–30 tegn.';return}nickname=s;interest=x;render();$('announce').textContent='Prøveprofilen er opdateret';return}
if(act.dataset.action==='post'){const title=$('post-title').value.trim(),body=$('post-body').value.trim(),cat=$('post-category').value;if(title.length<5||title.length>110||body.length<15||body.length>2500){$('post-error').textContent='Skriv en overskrift på mindst 5 tegn og en tekst på mindst 15 tegn.';return}const id='local'+Date.now();posts.unshift({id,title,body,topic:cat,author:nickname,replies:[],fake:false});topic='Alle';term='';formDraft={title:'',body:'',topic:'Hverdagen'};threadId=id;go('thread');$('announce').textContent='Prøveindlægget vises lokalt og er ikke offentliggjort';return}
if(act.dataset.action==='reply'){const body=$('reply').value.trim();if(body.length<2||body.length>1500){$('reply-error').textContent='Skriv 2–1500 tegn.';return}const p=posts.find(x=>x.id===threadId);if(!p)return;p.replies.push({author:nickname,body});replyDraft='';render();$('announce').textContent='Prøvesvaret vises lokalt og er ikke offentliggjort';return}});
render();
})();
</script>
</body></html>
