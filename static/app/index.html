      "question": "Kan jeg løfte tungt efter en laryngektomi?",
      "answer": "Efter operationen skal belastning bygges op efter kirurgens og fysioterapeutens plan. Hals, skuldre, sårheling, eventuel rekonstruktion og anden behandling gør tidsrammen individuel. Start let, øg gradvist og stop ved smerte, svimmelhed, blødning eller tydelig åndenød. Få en konkret vurdering, før du genoptager tunge løft, hårdt fysisk arbejde eller styrketræning.",
      "sources": [
        {
          "name": "Cancer Research UK: Life with a breathing stoma",
          "url": "https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/stoma/life"
        }
      ],
      "urgent": false,
      "status": "Udkast · afventer sundhedsfaglig kvalitetssikring"
    },
    {
      "id": "faq-56",
      "category": "Hverdag & pårørende",
      "question": "Hvordan håndterer jeg andres blikke og mit ændrede kropsbillede?",
      "answer": "Start i dit eget tempo. En kort standardsætning om stomaet og stemmen kan give dig kontrollen tilbage, men du skylder ingen en lang forklaring. Vælg først trygge steder og mennesker, og tal gerne med andre strubeløse. Hvis skam, angst, nedtrykthed eller isolation bliver ved, så søg støtte hos egen læge, behandlingssted eller en rådgiver.",
      "sources": [
        {
          "name": "Cancer Research UK: Coping with laryngeal cancer",
          "url": "https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/coping"
        }
      ],
      "urgent": false,
      "status": "Udkast · afventer sundhedsfaglig kvalitetssikring"
    },
    {
      "id": "faq-57",
      "category": "Hverdag & pårørende",
      "question": "Kan man have sex og intimitet som strubeløs?",
      "answer": "Ja, men lyst, kropsbillede, træthed og vejrtrækning kan have ændret sig. Tal sammen, begynd i det tempo der føles trygt, aftal et tegn for pause og sørg for, at stomaet altid er frit. Søg hjælp hos klinik, egen læge eller sexologisk rådgivning ved vedvarende smerter, manglende lyst, seksuelle funktionsproblemer eller bekymring for vejrtrækningen.",
      "sources": [
        {
          "name": "Cancer Research UK: Your sex life and laryngeal cancer",
          "url": "https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/your-sex-life"
        }
      ],
      "urgent": false,
      "status": "Udkast · afventer sundhedsfaglig kvalitetssikring"
    },
    {
      "id": "faq-58",
      "category": "Akut & hjælp",
      "question": "Skal jeg bære et nødkort eller medicinsk ID?",
      "answer": "Det er en god sikkerhedsvane at bære tydelig information om, at du er totalt laryngektomeret og kun trækker vejret gennem halsstomaet. Brug et kort, armbånd eller telefonens medicinske ID, og gem kontaktoplysninger til klinik og pårørende. Vis også nære personer, hvor informationen ligger. Et nødkort erstatter ikke din individuelle nødplan.",
      "sources": [
        {
          "name": "National Tracheostomy Safety Project: Emergency care",
          "url": "https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy"
        }
      ],
      "urgent": false,
      "status": "Udkast · afventer sundhedsfaglig kvalitetssikring"
    },
    {
      "id": "faq-59",
      "category": "Tale & kommunikation",
      "question": "Hvad hvis stemmen pludselig bliver svagere eller forsvinder?",
      "answer": "Kontroller kun de ting, du er oplært i: om HME eller taleknap sidder korrekt, om plasteret slutter tæt, og om der er synligt slim omkring udstyret. Ved taleprotese kan en pludselig ændring skyldes flere ting, som bør vurderes af klinikken. Udskift ikke selv en indopereret protese, medmindre du specifikt er oplært til det. Søg akut hjælp, hvis stemmeændringen ledsages af vejrtrækningsbesvær.",
      "sources": [
        {
          "name": "Cancer Research UK: Voice prosthesis",
          "url": "https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/speaking-after-laryngectomy/voice-prosthesis"
        }
      ],
      "urgent": false,
      "status": "Udkast · afventer sundhedsfaglig kvalitetssikring"
    },
    {
      "id": "faq-60",
      "category": "Hverdag & pårørende",
      "question": "Hvordan forbereder jeg et besøg hos læge, tandlæge eller hospital?",
      "answer": "Fortæl ved bestilling og ved ankomst, at du er totalt laryngektomeret og kun trækker vejret gennem halsstomaet. Medbring medicinliste, nødkort, nødvendigt reserveudstyr og eventuelt en kort skriftlig forklaring af din kommunikation. Ved bedøvelse, ilt, scanning eller anden procedure skal personalet kende din ændrede luftvej og inddrage relevante specialister.",
      "sources": [
        {
          "name": "National Tracheostomy Safety Project: Emergency care",
          "url": "https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy"
        }
      ],
      "urgent": false,
      "status": "Udkast · afventer sundhedsfaglig kvalitetssikring"
    }
  ]
}
</script>
<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('stomas-data').textContent),extra=JSON.parse(document.getElementById('stomas-extra-data').textContent);data.articles.push(...extra.articles);data.faq.push(...extra.faq);data.pack=`${data.faq.length} spørgsmål + ${data.articles.length} guides + nyopereret + pårørende`;data.version='5.1-indhold';const faq=data.faq,articles=data.articles,cats=data.categories,onboarding=data.newly_operated,stages=onboarding.stages,rel=data.relatives;
const $=(id)=>document.getElementById(id),esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=(s)=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const NAV=[['home','⌂','Forside'],['new','✚','Nyopereret'],['relative','♡','Pårørende'],['faq','?','Spørgsmål'],['articles','▤','Guides'],['saved','☆','Gemte']];
let current='home',cat='Alle',query='',articleId=null,large=false,prev='home',stageId='lige-efter',checkGroup='Alle',relAudience='partner',relGuideId='partner-kommunikation',relGroupFilter='Alle',scriptFilter='Alle';let saved=[];try{saved=JSON.parse(localStorage.getItem('stomas-v3-saved')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){saved=[]}
let doneChecks=[],doneStages=[];
try{doneChecks=JSON.parse(localStorage.getItem('stomas-v4-discharge-checks')||'[]');if(!Array.isArray(doneChecks))doneChecks=[]}catch(e){doneChecks=[]}
try{doneStages=JSON.parse(localStorage.getItem('stomas-v4-stages')||'[]');if(!Array.isArray(doneStages))doneStages=[]}catch(e){doneStages=[]}
function saveJourney(){try{localStorage.setItem('stomas-v4-discharge-checks',JSON.stringify(doneChecks));localStorage.setItem('stomas-v4-stages',JSON.stringify(doneStages))}catch(e){}}
let relChecks=[];try{relChecks=JSON.parse(localStorage.getItem('stomas-v5-relative-checks')||'[]');if(!Array.isArray(relChecks))relChecks=[]}catch(e){relChecks=[]}
function saveRelChecks(){try{localStorage.setItem('stomas-v5-relative-checks',JSON.stringify(relChecks))}catch(e){}}
function saveset(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem('stomas-v3-saved',JSON.stringify(saved))}catch(e){}render()}
function navs(){const nav=[...NAV,['about','ⓘ','Om STOMAS']];$('sidebar-nav').innerHTML=nav.map(([id,ico,label])=>`<button class="nav-item ${(current===id||(id==='new'&&(current==='new-stage'||current==='new-checklist'||current==='new-warning'))||(id==='relative'&&['relative-audience','relative-guide','relative-checklist','relative-scripts'].includes(current)))?'active':''}" data-go="${id}" type="button"><span class="nav-icon" aria-hidden="true">${ico}</span>${label}</button>`).join('');$('mobile-nav').innerHTML=NAV.map(([id,ico,label])=>`<button class="tab ${(current===id||(id==='new'&&(current==='new-stage'||current==='new-checklist'||current==='new-warning'))||(id==='relative'&&['relative-audience','relative-guide','relative-checklist','relative-scripts'].includes(current)))?'active':''}" data-go="${id}" type="button"><span aria-hidden="true">${ico}</span>${label}</button>`).join('')}
function jump(page,options={}){if(current!=='emergency')prev=current;current=page;if(options.category!==undefined)cat=options.category;if(options.query!==undefined)query=options.query;if(options.article!==undefined)articleId=options.article;window.scrollTo(0,0);render();}
function countCat(t){return faq.filter(f=>f.category===t).length}
function head(label,title,subtitle){return `<div class="page-head"><div class="eyeline">${esc(label)}</div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>`}
function home(){let tiles=cats.map(c=>`<button type="button" class="topic" data-topic="${esc(c.name)}" style="--item:${esc(c.color)}"><span class="qty">${countCat(c.name)} svar</span><span class="symbol">${esc(c.glyph)}</span><strong>${esc(c.name)}</strong><small>${esc(c.tagline)}</small></button>`).join('');return `<section class="hero"><div class="hero-inner"><div class="eyebrow">Velkommen til STOMAS</div><h1>Du har stadig<br><em>masser at sige.</em></h1><p>Et sted med viden, genkendelse og praktiske svar om livet efter en total laryngektomi – for dig og dem omkring dig.</p><div class="hero-actions"><button class="btn btn-primary" data-go="faq">Se ${faq.length} spørgsmål →</button><button class="btn btn-ghost" data-go="articles">Udforsk guider</button></div></div></section><div class="new-callout"><div><div class="label">NYT · TIL DIG DER ER NYOPERERET</div><h3>Den første tid efter operationen</h3><p>Fem overskuelige trin, en udskrivningstjekliste og viden til dig og dine pårørende. Du bestemmer tempoet.</p></div><button class="btn btn-primary" type="button" data-go="new">Start her →</button></div><div class="family-callout"><div><div class="label">NYT · TIL PÅRØRENDE</div><h3>Du står ikke alene ved siden af.</h3><p>Råd til partnere, børn, familie og venner. Med samtalehjælp og en tjekliste til den nye hverdag.</p></div><button class="btn btn-primary" data-go="relative" type="button">Gå til pårørende →</button></div><div class="section-top"><div><h2>Hvad vil du vide mere om?</h2><p class="subdued">Vælg et emne og find svar i dit eget tempo.</p></div><button class="section-link" data-go="faq">Alle spørgsmål →</button></div><div class="topics">${tiles}</div><div class="widegrid"><div class="highlight"><small>NYT I APPEN</small><h3>${faq.length} spørgsmål. Ærlige svar.</h3><p>Om alt fra HME og taleprotese til motion, familie og akutte situationer.</p><button class="btn btn-primary" data-go="faq">Gå til spørgsmål →</button></div><div class="highlight alt"><small>UDDYBENDE VIDEN</small><h3>${articles.length} guides i fuld længde.</h3><p>Når du gerne vil forstå mere end det korte svar – med links til faglige kilder.</p><button class="btn" data-go="articles">Læs guider →</button></div></div><div class="section-top"><div><h2>Vigtigt at vide</h2></div></div><div class="about-box"><p><b>Efter en total laryngektomi trækker du kun vejret gennem stomaet på halsen.</b> Det er også vigtigt, at dine pårørende ved det. <button class="linklike" data-go="emergency">Læs nødinformationen her.</button></p><p class="subdued">STOMAS er en indholdsprototype. Faglige råd gennemgås før offentliggørelse og erstatter ikke individuelle instruktioner fra din klinik.</p></div>`}
function searchbox(placeholder){return `<div class="toolbar"><label class="sr-only" for="searchbox">Søg</label><input class="search" id="searchbox" type="search" value="${esc(query)}" placeholder="${esc(placeholder)}" autocomplete="off"><div class="accessibility"><button type="button" data-act="clear-search">Ryd søgning</button></div></div>`}
function filters(){return `<div class="filters" role="group" aria-label="Vælg emne">${['Alle',...cats.map(x=>x.name)].map(t=>`<button class="filter ${cat===t?'active':''}" data-category="${esc(t)}">${esc(t)}</button>`).join('')}</div>`}
function sourced(arr){return arr.length?`<div class="source-row">Kilder og videre læsning:<div>${arr.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)} ↗</a>`).join('')}</div></div>`:''}

function onboardingProgress(){const n=doneStages.filter(id=>stages.some(s=>s.id===id)).length;return `<div class="progress-section"><div class="progress-main"><div class="progress-bubble">${n}/${stages.length}</div><div><strong>Mit overblik over de fem trin</strong><p>Du kan markere trin som læst. Det er ikke en medicinsk godkendelse.</p></div></div><div><div class="progress-track" aria-label="${n} af ${stages.length} trin læst"><div class="progress-fill" style="width:${n*100/stages.length}%"></div></div></div></div>`}
function newHub(){let tiles=stages.map(s=>`<button class="journey-card ${doneStages.includes(s.id)?'complete':''}" type="button" data-stage="${esc(s.id)}"><div class="journey-number">${doneStages.includes(s.id)?'✓':esc(s.glyph)}</div><div><span class="journey-period">${esc(s.period)}</span><h3>${esc(s.short)}</h3><p>${esc(s.summary)}</p>${doneStages.includes(s.id)?'<span class="done-text">Markeret som læst</span>':''}<div class="journey-link">Læs trinnet →</div></div></button>`).join('');return head('EN GUIDE TIL DEN FØRSTE TID','Nyopereret? Du er ikke alene.',onboarding.intro)+`<div class="onboarding-intro"><div class="eyeline">Start der, hvor du er</div><p>Det er ikke en fast tidsplan. Nogle bliver længere på hospitalet, nogle får taleprotese senere, og spise- og synkeplaner kan være forskellige.</p><small>Følg altid instruktionerne fra din egen kirurg, afdeling, sygeplejerske og talepædagog.</small></div>`+onboardingProgress()+`<div class="section-top"><div><h2>Din vej gennem den første tid</h2><p class="subdued">Tryk på det trin, der passer til din situation.</p></div></div><div class="journey-grid">${tiles}</div><div class="onboard-pair"><div class="onboard-quick"><div class="section-kicker">FØR DU SKAL HJEM</div><h3>Min udskrivningstjekliste</h3><p>16 konkrete ting, som du kan gennemgå med afdelingen. Sæt kryds undervejs og gem din fremgang lokalt.</p><button class="btn btn-primary" type="button" data-go="new-checklist">Åbn tjeklisten →</button></div><div class="onboard-quick"><div class="section-kicker">TRYGHED OG OVERBLIK</div><h3>Hvad skal jeg reagere på?</h3><p>Hvornår skal du ringe 112, og hvornår skal du hurtigt kontakte din afdeling? Læs også de mest almindelige fagord.</p><button class="btn" type="button" data-go="new-warning">Advarselstegn og ordbog →</button></div></div><p class="review-note">${esc(onboarding.review_status)}. Sektionen er ikke en behandlingsplan.</p>`}
function stageView(){const s=stages.find(s=>s.id===stageId)||stages[0],i=stages.indexOf(s),checked=doneStages.includes(s.id);return `<div class="stage-top"><button class="btn" data-go="new">← Alle fem trin</button><span class="stage-flag">Trin ${i+1} af 5 · ${esc(s.period)}</span></div>${head('NYOPERERET · '+s.short,s.title,s.summary)}<div class="stage-columns"><div>${s.sections.map(c=>`<div class="stage-chapter"><h2>${esc(c.title)}</h2><p>${esc(c.body)}</p></div>`).join('')}<div class="read-check"><input type="checkbox" id="stage-read" data-stage-done="${esc(s.id)}" ${checked?'checked':''}><label for="stage-read">Jeg har læst dette trin (kun til mit eget overblik)</label></div><div class="stage-source"><b>Kilder og videre læsning</b>${s.sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.name)} ↗</a>`).join('')}<p class="review-note">Fagligt udkast: instruktionerne fra dit behandlingsteam gælder altid først.</p></div><div class="stage-pager">${i>0?`<button class="btn" data-stage="${esc(stages[i-1].id)}">← ${esc(stages[i-1].short)}</button>`:'<span></span>'}${i<stages.length-1?`<button class="btn btn-primary" data-stage="${esc(stages[i+1].id)}">${esc(stages[i+1].short)} →</button>`:`<button class="btn btn-primary" data-go="new-checklist">Se udskrivningstjeklisten →</button>`}</div></div><aside class="stage-right"><h2>Det er godt at have styr på</h2><ul>${s.checkpoints.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="line"></div><h2>Spørg dit team om …</h2><ul>${s.questions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn" data-go="new-checklist">Min udskrivningstjekliste →</button><button class="btn" data-go="new-warning">Advarselstegn →</button></aside></div>`}
function checklist(){let done=doneChecks.filter(id=>onboarding.checklist.some(x=>x.id===id)).length,groupnames={'Alle':'Alle','akut':'Akut & kontakt','udstyr':'Udstyr & pleje','kommunikation':'Kommunikation','ernaring':'Mad & synkning','hjemme':'Hjem & opfølgning'},shown=onboarding.checklist.filter(x=>checkGroup==='Alle'||x.group===checkGroup);return `<button class="btn back" data-go="new">← Tilbage til oversigten</button>`+head('KLAR TIL HJEMKOMST','Min udskrivningstjekliste','Brug listen sammen med dit behandlingsteam. Det er helt i orden at spørge flere gange og få ting vist igen.')+`<div class="progress-section"><div class="progress-main"><div class="progress-bubble">${done}/16</div><div><strong>${done} af 16 punkter markeret</strong><p>Dine krydser gemmes kun i browseren på denne enhed.</p></div></div><div class="progress-track"><div class="progress-fill" style="width:${done/16*100}%"></div></div></div><div class="checklist-legend" role="group" aria-label="Filtrér tjeklisten">${Object.entries(groupnames).map(([id,label])=>`<button type="button" class="check-filter ${checkGroup===id?'active':''}" data-check-filter="${esc(id)}">${esc(label)}</button>`).join('')}</div><div class="check-list">${shown.map(x=>`<label class="check-item"><input type="checkbox" data-check="${esc(x.id)}" ${doneChecks.includes(x.id)?'checked':''}><span><strong>${esc(x.label)}</strong><small>${esc(x.hint)}</small></span></label>`).join('')}</div><div class="warning-inline"><strong>Vigtigt: Et kryds betyder ikke, at du er udskrivningsklar.</strong><p>Det er personalet, der vurderer, hvornår det er sikkert at komme hjem. Brug listen som støtte til samtalen.</p></div><button class="btn" data-go="new">← Tilbage til de fem trin</button>`}
function warningPage(){return `<button class="btn back" data-go="new">← Tilbage til nyopereret</button>`+head('DIN SIKKERHED','Hvornår skal jeg reagere?','Tal disse situationer igennem med personalet, så du og dine nærmeste kender den individuelle nødplan.')+`<div class="watch-list">${onboarding.red_flags.map(x=>`<div class="watch-item"><strong>${esc(x.label)}</strong><p>${esc(x.details)}</p></div>`).join('')}</div><div class="hero-actions" style="margin:21px 0"><button class="danger" data-go="emergency">⚠ Se den akutte vejledning</button><button class="btn" data-go="new-checklist">Gå til udskrivningstjeklisten</button></div><div class="section-top"><div><h2>En lille ordbog</h2><p class="subdued">Ord du typisk møder på afdelingen.</p></div></div><div class="gloss-grid">${onboarding.glossary.map(x=>`<div class="gloss-item"><b>${esc(x.word)}</b><p>${esc(x.meaning)}</p></div>`).join('')}</div><div class="stage-source"><b>Kilder og videre læsning</b><a href="https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy" target="_blank" rel="noopener noreferrer">National Tracheostomy Safety Project · Emergency Care ↗</a><a href="https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy" target="_blank" rel="noopener noreferrer">Atos Medical · Coming Home ↗</a></div><p class="review-note">Teksterne afventer sundhedsfaglig godkendelse. Ved akut alvorlig åndenød: ring 112.</p>`}

function relHub(){let tiles=rel.audiences.map(a=>`<button type="button" class="rel-card" data-rel-audience="${esc(a.id)}"><div class="rel-card-icon" aria-hidden="true">${esc(a.icon)}</div><div><h3>${esc(a.name)}</h3><p>${esc(a.teaser)}</p><span class="more">Læs rådene →</span></div></button>`).join('');return head('TIL DIG, DER STÅR VED SIDEN AF','Pårørende',rel.intro)+`<div class="rel-intro"><strong>Du skal ikke kunne det hele.</strong><p>Det vigtigste er at lytte, være nysgerrig og aftale, hvad der hjælper. Støtte skal passe både til dig og til den strubeløse.</p></div><div class="section-top"><div><h2>Hvem er du pårørende som?</h2><p class="subdued">Vælg den indgang, der passer bedst til dig.</p></div></div><div class="rel-grid">${tiles}</div><div class="rel-tool-grid"><div class="rel-tool"><div class="rel-section-label">EN PRAKTISK HJÆLP</div><h3>Min pårørende-tjekliste</h3><p>14 små ting I kan tale om: kommunikation, tryghed, børn og støtte til dig selv. Gem krydser på din enhed.</p><button class="btn btn-primary" type="button" data-go="relative-checklist">Åbn tjeklisten →</button></div><div class="rel-tool"><div class="rel-section-label">NÅR ORD ER SVÆRE</div><h3>Hvad kan jeg sige?</h3><p>Otte konkrete samtalestartere til børn, partnere, familie og venner. Læs dem, tilpas dem og kopier en tekst.</p><button class="btn" type="button" data-go="relative-scripts">Se samtalekort →</button></div></div><div class="rel-safety"><strong>Vigtigt om luftvejen</strong><p>En person med total laryngektomi trækker kun vejret gennem halsstomaet. Ved akut alvorlig åndenød skal du ringe 112 og fortælle det til alarmcentralen.</p><button type="button" class="btn" style="margin-top:10px" data-go="emergency">Åbn akutsiden →</button></div><p class="review-note">${esc(rel.review_status)}. Brug altid klinikkens personlige instruktioner.</p>`}
function relAudienceView(){let a=rel.audiences.find(x=>x.id===relAudience)||rel.audiences[0],guides=rel.guides.filter(x=>x.group===a.id);return `<button type="button" class="btn back" data-go="relative">← Alle pårørende</button>`+head('PÅRØRENDE · '+a.name,a.name,a.lead)+`<div class="rel-intro"><strong>Du må gerne tage det i dit eget tempo.</strong><p>Ingen af jer skal mestre det hele fra dag ét. Her er fem korte guides, som kan læses hver for sig.</p></div><div class="rel-list">${guides.map(x=>`<button type="button" class="rel-guide" data-rel-guide="${esc(x.id)}"><div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p></div><span class="arr" aria-hidden="true">→</span></button>`).join('')}</div><div class="rel-tool-grid"><div class="rel-tool"><h3>Fælles tjekliste</h3><p>Små aftaler skaber mere tryghed end at én forsøger at huske det hele.</p><button class="btn" data-go="relative-checklist">Åbn tjeklisten →</button></div><div class="rel-tool"><h3>Ord til svære samtaler</h3><p>Læs forslag til sætninger, som du kan tilpasse til jeres måde at tale sammen på.</p><button class="btn btn-primary" data-go="relative-scripts">Åbn samtalekort →</button></div></div>`}
function relGuideView(){let g=rel.guides.find(x=>x.id===relGuideId)||rel.guides[0],a=rel.audiences.find(x=>x.id===g.group),same=rel.guides.filter(x=>x.group===g.group),index=same.indexOf(g);return `<button class="btn back" type="button" data-rel-audience="${esc(g.group)}">← ${esc(a.name)}</button>`+head('PÅRØRENDE · '+a.name,g.title,g.summary)+`<div class="rel-detail"><div>${g.sections.map(s=>`<article class="rel-paragraph"><h2>${esc(s.heading)}</h2><p>${esc(s.text)}</p></article>`).join('')}<div class="stage-source"><b>Kilder og videre læsning</b>${g.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)} ↗</a>`).join('')}</div><div class="stage-pager">${index>0?`<button class="btn" data-rel-guide="${esc(same[index-1].id)}">← Forrige</button>`:'<span></span>'}${index<same.length-1?`<button class="btn btn-primary" data-rel-guide="${esc(same[index+1].id)}">Næste guide →</button>`:`<button class="btn btn-primary" data-rel-audience="${esc(g.group)}">Alle guides →</button>`}</div></div><aside class="rel-aside"><h2>Fra viden til hverdag</h2><div class="rel-tip"><b>Et lille skridt</b><p>${esc(g.try)}</p></div><div class="rel-tip"><b>En samtalestarter</b><p>${esc(g.talk)}</p></div><button class="btn rel-tool-link" data-go="relative-scripts">Se samtalekort →</button><button class="btn rel-tool-link" data-go="relative-checklist">Se pårørende-tjeklisten →</button><p class="review-note">Generel støtte · ikke behandlingsvejledning.</p></aside></div>`}
function relChecklistView(){const n=relChecks.filter(id=>rel.checklist.some(x=>x.id===id)).length,shown=rel.checklist.filter(x=>relGroupFilter==='Alle'||x.group===relGroupFilter);return `<button class="btn back" data-go="relative">← Til pårørende</button>`+head('PÅRØRENDE · VÆRKTØJ','Vores fælles tjekliste','Et værktøj til samtalen – ikke en test og ikke en medicinsk godkendelse.')+`<div class="rel-progress"><div><b>${n} af ${rel.checklist.length} punkter markeret</b><small>Krydserne gemmes lokalt på denne enhed.</small></div><div class="progress-bubble">${n}/${rel.checklist.length}</div></div><div class="rel-group-tabs" role="group" aria-label="Filtrér pårørendetjekliste">${['Alle',...rel.check_groups].map(g=>`<button type="button" class="${g===relGroupFilter?'active':''}" data-rel-check-filter="${esc(g)}">${esc(g)}</button>`).join('')}</div><div class="check-list">${shown.map(x=>`<label class="check-item"><input type="checkbox" data-rel-check="${esc(x.id)}" ${relChecks.includes(x.id)?'checked':''}><span><strong>${esc(x.title)}</strong><small>${esc(x.detail)}</small></span></label>`).join('')}</div><div class="rel-safety"><strong>En tjekliste erstatter aldrig oplæring.</strong><p>Indgreb, stomapleje, sugning og brug af udstyr kræver konkret instruktion fra personens sundhedsteam. Ved akut alvorlig åndenød: ring 112.</p></div><button class="btn" data-go="relative">← Tilbage til pårørende</button>`}
function relScriptsView(){let ar=rel.conversation_cards.filter(x=>scriptFilter==='Alle'||x.group===scriptFilter);return `<button class="btn back" data-go="relative">← Til pårørende</button>`+head('PÅRØRENDE · VÆRKTØJ','Når ord kan være svære','Eksempler på, hvad man kan sige. Du kan tilpasse formuleringerne, så de lyder som dig – og være ærlig om det, du ikke ved.')+`<div class="rel-group-tabs" role="group" aria-label="Vælg samtalekort">${[['Alle','Alle'],...rel.audiences.map(x=>[x.id,x.name])].map(([id,name])=>`<button type="button" class="${id===scriptFilter?'active':''}" data-rel-script-filter="${esc(id)}">${esc(name)}</button>`).join('')}</div><div class="rel-script-grid">${ar.map(x=>`<div class="rel-script"><div class="rel-script-top"><span class="rel-tag">${esc(x.name)}</span><button class="btn" type="button" data-rel-copy="${esc(x.id)}">Kopiér teksten</button></div><h3>${esc(x.title)}</h3><blockquote>${esc(x.text)}</blockquote></div>`).join('')}</div><div class="rel-intro"><strong>Vigtigt om samtaler med børn:</strong><p>Fortæl sandheden i en form, barnet forstår. Undgå løfter om fremtiden, som ingen kan give. Ved spørgsmål om sygdommens forløb: brug den viden, I har fået fra behandlingsteamet.</p><a href="https://www.cancer.dk/boern-unge/paaroerende/" target="_blank" rel="noopener noreferrer" style="color:#9beaf3">Kræftens Bekæmpelse · Børn og unge som pårørende ↗</a></div>`}
function faqCard(f){return `<details class="faq" id="${f.id}"><summary><span class="n">${f.id.slice(-2)}</span><strong>${esc(f.question)}</strong><span class="chev" aria-hidden="true">⌄</span></summary><div class="faq-answer"><p>${esc(f.answer)}</p>${sourced(f.sources)}<div class="faq-actions"><button type="button" class="smallbtn ${saved.includes(f.id)?'saved':''}" data-save="${f.id}" aria-label="${saved.includes(f.id)?'Fjern fra gemte':'Gem spørgsmål'}">${saved.includes(f.id)?'★ Gemt':'☆ Gem svar'}</button><button type="button" class="smallbtn" data-copy="${f.id}">Kopiér svar</button></div><div class="review-note">Udkast · afventer sundhedsfaglig gennemgang.</div></div></details>`}
function faqView(onlySaved=false){let arr=faq.filter(f=>(!onlySaved||saved.includes(f.id))&&(cat==='Alle'||f.category===cat)&&(!query||norm(f.question+' '+f.answer+' '+f.category).includes(norm(query))));return head('STOMAS · FAQ',onlySaved?'Dine gemte spørgsmål':'Spørgsmål & svar',onlySaved?'Spørgsmål, du har gemt på denne enhed.':`${faq.length} svar om livet efter total laryngektomi. Tryk på et spørgsmål for at læse svaret.`)+searchbox(`Søg blandt ${faq.length} spørgsmål …`)+filters()+`<p class="count">${arr.length} af ${faq.length} spørgsmål vist</p><div class="faq-list">${arr.length?arr.map(faqCard).join(''):'<div class="empty">Ingen spørgsmål her. Prøv at vælge et andet emne eller en anden søgning.</div>'}</div>`}
function articlesView(onlySaved=false){let arr=articles.filter(a=>(!onlySaved||saved.includes(a.id))&&(!query||norm(a.title+' '+a.summary+' '+a.category+' '+a.sections.map(s=>s.heading).join(' ')).includes(norm(query))));return head('STOMAS · Vidensunivers',onlySaved?'Dine gemte guides':'Guides & viden',`${articles.length} længere artikler med baggrundsviden, råd og faglige kilder.`)+searchbox('Søg efter en guide …')+`<p class="count">${arr.length} guider</p><div class="articles">${arr.length?arr.map(a=>`<button type="button" class="article-card" data-article="${esc(a.id)}"><span class="category">${esc(a.category)}</span><strong>${saved.includes(a.id)?'★ ':''}${esc(a.title)}</strong><p>${esc(a.summary)}</p><span class="read">${esc(a.reading_minutes)} min. læsning →</span></button>`).join(''):'<div class="empty">Ingen guider matcher.</div>'}</div>`}
function detail(){const a=articles.find(a=>a.id===articleId);if(!a)return articlesView();return `<div class="detail"><button class="btn back" data-go="articles">← Tilbage til guider</button><div class="eyeline">${esc(a.category)} · ${a.reading_minutes} min. læsning</div><h1>${esc(a.title)}</h1><p class="lede">${esc(a.summary)}</p>${a.sections.map(s=>`<h2>${esc(s.heading)}</h2>${s.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}`).join('')}<div class="remember"><b>Det vigtigste at huske</b><ul>${a.remember.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="faq-actions" style="margin-top:22px"><button class="smallbtn ${saved.includes(a.id)?'saved':''}" data-save="${esc(a.id)}">${saved.includes(a.id)?'★ Gemt':'☆ Gem guide'}</button></div><div class="article-source"><b>Kilder og videre læsning</b>${a.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)} ↗</a>`).join('')}</div><div class="review-note">Udkast · afventer sundhedsfaglig gennemgang.</div></div>`}
function savedPage(){const n=saved.filter(id=>faq.some(f=>f.id===id)).length,m=saved.filter(id=>articles.some(a=>a.id===id)).length;return head('DIT EGET OVERBLIK','Gemte favoritter',`Du har gemt ${n} spørgsmål og ${m} guides på denne enhed.`)+`<div class="hero-actions" style="margin-bottom:20px"><button type="button" class="btn btn-primary" data-go="saved-faq">Spørgsmål (${n})</button><button type="button" class="btn" data-go="saved-articles">Guides (${m})</button></div><div class="about-box"><p>Gemte favoritter lagres kun i browseren på denne enhed. De synkroniseres ikke til andre telefoner eller computere.</p></div>`}
function about(){return `<div class="about">${head('ET FÆLLESSKAB AF VIDEN','Om STOMAS','Viden, erfaring, fællesskab og håb – set fra hverdagen med et stoma.')}<div class="about-box"><h2>Hvorfor denne app?</h2><p>STOMAS er skabt med ambitionen om at gøre det lettere at finde forståelig information om livet efter total laryngektomi. Ikke kun teknik, men også alt det, man møder i hverdagen: børn, arbejde, relationer, træning og de spørgsmål, man ikke altid får stillet til en konsultation.</p></div><div class="about-box"><h2>Sådan bruger du indholdet</h2><p>De korte spørgsmål er et første svar. Guiderne går mere i dybden. Hver tekst har links til kilder, og du kan gemme emner, du vil vende tilbage til.</p><p><b>Vigtig begrænsning:</b> Dette er en prototype. Teksterne er ikke fagligt godkendt endnu og er ikke en erstatning for individuel sundhedsfaglig vejledning eller akut behandling.</p></div><div class="about-box"><h2>Kontakt og hjemmeside</h2><p>Læs mere på <a href="https://stomas.dk" target="_blank" rel="noopener noreferrer">stomas.dk ↗</a>. Appudkastet er tænkt som et supplement til STOMAS-platformen.</p></div></div>`}
function emergency(){return `<div class="emergency-page"><div class="eyeline" style="color:#ffb7b7">AKUT · INFORMATION OM LUFTVEJ</div><h1>Hvis vejrtrækningen er akut påvirket</h1><div class="emergency-big">Ring <span class="nr">112</span> med det samme.</div><p>Fortæl alarmcentralen:</p><div class="emergency-big">“Personen er totalt laryngektomeret og trækker kun vejret gennem stomaet på halsen.”</div><div class="line"></div><p><b>Vigtigt:</b> Efter total laryngektomi er der ingen luftforbindelse mellem mund/næse og lunger. Redningspersonale skal derfor håndtere luftvejen via halsstomaet.</p><p>Følg din individuelle nødplan og de anvisninger, du får fra alarmcentralen. Lad ikke forsøg på egenbehandling forsinke opkaldet.</p><div class="line"></div><p><b>Til den ikke-akutte hverdag:</b> Gem klinikkens telefonnummer, din udstyrstype og oplysninger om eventuel taleprotese et sted, hvor du og dine pårørende kan finde dem.</p><div class="source-row"><a href="${esc(data.sources.emergency.url)}" target="_blank" rel="noopener noreferrer">National Tracheostomy Safety Project · Akut vejledning ↗</a></div><button class="btn" data-go="${esc(prev==='emergency'?'home':prev)}">← Tilbage</button></div>`}
function render(){navs();let output='';if(current==='home')output=home();else if(current==='new')output=newHub();else if(current==='new-stage')output=stageView();else if(current==='new-checklist')output=checklist();else if(current==='new-warning')output=warningPage();else if(current==='relative')output=relHub();else if(current==='relative-audience')output=relAudienceView();else if(current==='relative-guide')output=relGuideView();else if(current==='relative-checklist')output=relChecklistView();else if(current==='relative-scripts')output=relScriptsView();else if(current==='faq')output=faqView();else if(current==='articles')output=articlesView();else if(current==='article')output=detail();else if(current==='saved')output=savedPage();else if(current==='saved-faq')output=faqView(true);else if(current==='saved-articles')output=articlesView(true);else if(current==='about')output=about();else if(current==='emergency')output=emergency();else output=home();$('main-content').innerHTML=output+`<div class="footer">© STOMAS · Demo 20.10.2026 · Nyopereret · Pårørende · ${faq.length} spørgsmål · ${articles.length} guides. Indholdet afventer sundhedsfaglig gennemgang. Ved akut åndenød: ring 112.</div>`;const inp=$('searchbox');if(inp){inp.addEventListener('input',(e)=>{const pos=inp.selectionStart;query=e.target.value;updateResultsWithoutFullRender(pos)});}}
function updateResultsWithoutFullRender(cursor){const inp=$('searchbox');if(!inp)return;const isFAQ=current==='faq'||current==='saved-faq';const onlySaved=current.startsWith('saved-');let html;if(isFAQ){const arr=faq.filter(f=>(!onlySaved||saved.includes(f.id))&&(cat==='Alle'||f.category===cat)&&(!query||norm(f.question+' '+f.answer+' '+f.category).includes(norm(query))));html=`<p class="count">${arr.length} af ${faq.length} spørgsmål vist</p><div class="faq-list">${arr.length?arr.map(faqCard).join(''):'<div class="empty">Ingen spørgsmål her. Prøv en anden søgning.</div>'}</div>`}else{const arr=articles.filter(a=>(!onlySaved||saved.includes(a.id))&&(!query||norm(a.title+' '+a.summary+' '+a.category).includes(norm(query))));html=`<p class="count">${arr.length} guider</p><div class="articles">${arr.length?arr.map(a=>`<button type="button" class="article-card" data-article="${esc(a.id)}"><span class="category">${esc(a.category)}</span><strong>${esc(a.title)}</strong><p>${esc(a.summary)}</p><span class="read">${a.reading_minutes} min. læsning →</span></button>`).join(''):'<div class="empty">Ingen guider matcher.</div>'}</div>`}let container=inp.closest('.content'), oldCount=container.querySelector('.count');if(oldCount){const holder=document.createElement('div');holder.innerHTML=html;const oldList=oldCount.nextElementSibling;oldCount.replaceWith(holder.firstElementChild);if(oldList)oldList.replaceWith(holder.firstElementChild)} }
function showSaved(id){const q=faq.find(f=>f.id===id);if(q){cat='Alle';query='';jump('faq');requestAnimationFrame(()=>{const d=$(id);if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'center'})}})}else if(articles.some(a=>a.id===id)){jump('article',{article:id})}}
document.addEventListener('click',async e=>{const go=e.target.closest('[data-go]');if(go){const dest=go.dataset.go;if(dest==='saved-faq'){cat='Alle';query='';}if(dest==='saved-articles'){query='';}if(dest==='faq'||dest==='articles'){if(current==='home'||current==='saved'){cat='Alle';query=''}}jump(dest);return}
const aud=e.target.closest('[data-rel-audience]');if(aud){relAudience=aud.dataset.relAudience;jump('relative-audience');return}
const rg=e.target.closest('[data-rel-guide]');if(rg){relGuideId=rg.dataset.relGuide;relAudience=(rel.guides.find(g=>g.id===relGuideId)||rel.guides[0]).group;jump('relative-guide');return}
const rcf=e.target.closest('[data-rel-check-filter]');if(rcf){relGroupFilter=rcf.dataset.relCheckFilter;render();return}
const rsc=e.target.closest('[data-rel-script-filter]');if(rsc){scriptFilter=rsc.dataset.relScriptFilter;render();return}
const cp=e.target.closest('[data-rel-copy]');if(cp){const msg=rel.conversation_cards.find(x=>x.id===cp.dataset.relCopy);if(!msg)return;try{await navigator.clipboard.writeText(msg.text);cp.textContent='Kopieret ✓'}catch(e){const area=document.createElement('textarea');area.value=msg.text;document.body.appendChild(area);area.select();try{document.execCommand('copy');cp.textContent='Kopieret ✓'}catch(err){cp.textContent='Markér teksten og kopiér'}area.remove()}return}
const openStage=e.target.closest('[data-stage]');if(openStage){stageId=openStage.dataset.stage;jump('new-stage');return}
const cf=e.target.closest('[data-check-filter]');if(cf){checkGroup=cf.dataset.checkFilter;render();return}
const topic=e.target.closest('[data-topic]');if(topic){jump('faq',{category:topic.dataset.topic,query:''});return}
const cc=e.target.closest('[data-category]');if(cc){cat=cc.dataset.category;render();return}
const act=e.target.closest('[data-act]');if(act&&act.dataset.act==='clear-search'){query='';render();return}
const art=e.target.closest('[data-article]');if(art){jump('article',{article:art.dataset.article});return}
const saver=e.target.closest('[data-save]');if(saver){const id=saver.dataset.save;const faqItem=saver.closest('details');const isOpen=faqItem?.open;const scroll=window.scrollY;saveset(id);if(faqItem&&isOpen){const d=$(id);if(d)d.open=true;window.scrollTo(0,scroll)}return}
const c=e.target.closest('[data-copy]');if(c){const f=faq.find(x=>x.id===c.dataset.copy);if(!f)return;const text=f.question+'\n\n'+f.answer;try{await navigator.clipboard.writeText(text);c.textContent='Kopieret ✓'}catch(e){const x=document.createElement('textarea');x.value=text;document.body.appendChild(x);x.select();try{document.execCommand('copy');c.textContent='Kopieret ✓'}catch(e){c.textContent='Kopiér manuelt'}x.remove()}return}
});
document.addEventListener('change',e=>{const relItem=e.target.closest('[data-rel-check]');if(relItem){const id=relItem.dataset.relCheck;relChecks=relItem.checked?[...new Set([...relChecks,id])]:relChecks.filter(x=>x!==id);saveRelChecks();const scroll=window.scrollY;render();window.scrollTo(0,scroll);return}const item=e.target.closest('[data-check]');if(item){const id=item.dataset.check;doneChecks=item.checked?[...new Set([...doneChecks,id])]:doneChecks.filter(x=>x!==id);saveJourney();const scroll=window.scrollY;render();window.scrollTo(0,scroll);return}const read=e.target.closest('[data-stage-done]');if(read){const id=read.dataset.stageDone;doneStages=read.checked?[...new Set([...doneStages,id])]:doneStages.filter(x=>x!==id);saveJourney();const scroll=window.scrollY;render();window.scrollTo(0,scroll)}});
$('emergency-button').onclick=()=>jump('emergency');$('font-button').onclick=()=>{large=!large;document.body.classList.toggle('large-text',large);$('font-button').textContent=large?'A− Tekst':'A+ Tekst'};
render();})();
</script>
</body></html>
