<script id="stomas-data" type="application/json">{"app":"STOMAS","pack":"50 spørgsmål + 18 guides + nyopereret + pårørende","version":"5.0-paaroerende","created":"2026-10-20","language":"da-DK","audience":["strubeløse efter total laryngektomi","pårørende","interesserede"],"medical_notice":"Oplysningerne er generelle, og indholdet kræver sundhedsfaglig gennemgang før offentliggørelse. Følg altid din egen kliniks instrukser. Ring 112 ved akutte vejrtrækningsproblemer.","faq_updated":"2026-10-20","categories":[{"name":"Forstå operationen","tagline":"Forstå hvad der ændrer sig","glyph":"◉","color":"#2c89df"},{"name":"Vejrtrækning \u0026 stoma","tagline":"Luft, hoste, slim og stoma","glyph":"✦","color":"#14b8a6"},{"name":"Tale \u0026 kommunikation","tagline":"Stemmen, protesen og samtaler","glyph":"◌","color":"#ae8cff"},{"name":"Udstyr \u0026 pleje","tagline":"HME, plastre og rengøring","glyph":"✳","color":"#e5a94e"},{"name":"Mad \u0026 sanser","tagline":"Synkning, smag og lugt","glyph":"◈","color":"#ee8494"},{"name":"Motion \u0026 vand","tagline":"Træning, bad og sikkerhed","glyph":"≈","color":"#5da5f5"},{"name":"Hverdag \u0026 pårørende","tagline":"Arbejde, børn og familie","glyph":"♡","color":"#a1bc79"},{"name":"Akut \u0026 hjælp","tagline":"Hvad du skal reagere på","glyph":"!","color":"#f27873"}],"articles":[{"id":"hvad-er-strubelos","category":"Kom godt i gang","title":"Hvad betyder det at være strubeløs?","summary":"Et enkelt overblik over, hvad der ændrer sig, når struben er fjernet.","reading_minutes":3,"sections":[{"heading":"Hvad er en total laryngektomi?","paragraphs":["Ved en total laryngektomi fjerner kirurgen strubehovedet. Luftrøret føres frem til en permanent åbning på forsiden af halsen. Åbningen kaldes et stoma.","Efter operationen foregår al vejrtrækning gennem stomaet – ikke gennem næse eller mund. Det er den vigtigste forskel, både for dig selv og for alle omkring dig."]},{"heading":"Hvad betyder det i hverdagen?","paragraphs":["Stemmen lyder anderledes, fordi stemmebåndene er fjernet. Mange lærer at tale ved hjælp af en taleprotese, en elektronisk strubevibrator eller spiserørsstemme.","Luften går ikke længere gennem næsen, som normalt filtrerer, fugter og opvarmer den. Derfor er beskyttelse af stomaet og gode vaner omkring fugt og slim vigtige."]},{"heading":"Der er ikke kun én måde at være strubeløs på","paragraphs":["Nogle har få daglige gener, mens andre oplever hoste, slim, synkebesvær eller mindre overskud. Din operation, din heling og dit udstyr påvirker, hvad der fungerer for dig."]}],"remember":["Du trækker vejret gennem stomaet på halsen.","Du kan stadig kommunikere, spise, have familie- og arbejdsliv – ofte på nye måder."],"sources":[{"name":"Kræftens Bekæmpelse: Operation af strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"},{"name":"Kræftens Bekæmpelse: At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"},{"name":"Kræftens Bekæmpelse: Gener efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/gener-efter-operation/"}],"tags":["laryngektomi","stoma","nyopereret"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"forskel-laryngektomi-trakeostomi","category":"Kom godt i gang","title":"Laryngektomi er ikke det samme som trakeostomi","summary":"To åbninger på halsen kan ligne hinanden, men være helt forskellige.","reading_minutes":2,"sections":[{"heading":"Total laryngektomi","paragraphs":["Ved total laryngektomi er struben fjernet. Luftrøret er permanent ført ud på halsen, og der er ingen luftforbindelse fra mund eller næse til lungerne. Personen kaldes nogle gange en ”neck breather”."]},{"heading":"Trakeostomi","paragraphs":["Ved en trakeostomi har man lavet en åbning til luftrøret, men struben er ikke nødvendigvis fjernet. Forbindelsen til mund og næse kan være bevaret. Behandlingen i en nødsituation kan derfor være anderledes."]},{"heading":"Derfor er forskellen vigtig","paragraphs":["Hvis en person har fået fjernet struben helt, skal luft og eventuel ilt gives via stomaet på halsen. Hjælpere skal vide, at maske over mund og næse ikke kan ventilere lungerne hos en total laryngektomeret."]}],"remember":["Fortæl sundhedspersonale tydeligt: ”Jeg er totalt laryngektomeret. Jeg trækker kun vejret gennem halsen.”"],"sources":[{"name":"Kræftens Bekæmpelse: Operation af strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"},{"name":"National Tracheostomy Safety Project: Laryngectomy emergency algorithm (PDF)","url":"https://tracheostomy.org.uk/e-learning-files/NTSP_01_002-Emergency_Care_lo_pack/pdf/Laryngectomy_Algorithm.pdf"}],"tags":["trakeostomi","laryngektomi","sikkerhed"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"talemuligheder","category":"Tale og kommunikation","title":"Hvordan taler man uden stemmebånd?","summary":"Taleprotese, strubevibrator og spiserørsstemme forklaret uden fagsprog.","reading_minutes":3,"sections":[{"heading":"Taleprotese","paragraphs":["En taleprotese er en lille envejsventil mellem luftrøret og spiserøret. Under tale ledes udåndingsluft gennem protesen, så vævet i svælget vibrerer og danner lyd. Mund og tunge former derefter lyden til ord.","Nogle trykker på et HME-filter eller en særlig talefunktion, når de taler. Andre kan bruge håndfri løsninger. Det er individuelt, hvad der passer."]},{"heading":"Strubevibrator","paragraphs":["En elektronisk strubevibrator skaber vibrationer, som man former til ord med mund og tunge. Den kan være en hovedløsning eller en reserve, hvis taleprotesen ikke kan bruges."]},{"heading":"Spiserørsstemme","paragraphs":["Ved spiserørsstemme bruger man små mængder luft i spiserøret til at skabe lyd. Det kræver øvelse, men det er en mulighed uden elektronisk udstyr eller taleprotese."]},{"heading":"Giv kommunikationen tid","paragraphs":["Nye stemmer kan være sværere at høre i støj eller telefon. Tal én ad gangen, se på personen, og giv plads til at gentage eller skrive, når det er nødvendigt."]}],"remember":["En anderledes stemme er stadig en stemme.","Talepædagog eller relevant klinik kan hjælpe med træning og valg af løsning."],"sources":[{"name":"Kræftens Bekæmpelse: At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"}],"tags":["Provox","taleprotese","stemme"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"hjem-fra-hospital","category":"Kom godt i gang","title":"Hjem fra hospitalet: den første tid","summary":"Små rutiner kan gøre overgangen til hverdagen mere overskuelig.","reading_minutes":3,"sections":[{"heading":"Få en konkret plan med hjem","paragraphs":["Inden udskrivelse bør du vide, hvem du kontakter ved problemer, hvordan dit udstyr bruges, og hvilken pleje du selv skal udføre. Bed gerne om skriftlige instruktioner, så du og dine pårørende kan finde dem igen."]},{"heading":"Lav faste, enkle rutiner","paragraphs":["Aftal et tidspunkt til at se på stomaet, kontrollere huden, ordne udstyr og sørge for rent reserveudstyr. Følg altid de individuelle råd fra din klinik om eventuel larytube, rengøring og fugtning."]},{"heading":"Forvent ikke alt på én gang","paragraphs":["Det tager tid at finde ud af, hvad der virker med søvn, hoste, socialt liv og den nye stemme. Det er helt rimeligt at starte med få ting og bygge langsomt videre."]},{"heading":"Søg hjælp ved ændringer","paragraphs":["Nyt eller tiltagende åndedrætsbesvær, ændring i stomaets størrelse, smerter eller usædvanlige symptomer bør vurderes af sundhedspersonale. Ved akut vejrtrækningsbesvær ringes 112."]}],"remember":["Skriv kontaktoplysninger til afdelingen ind i telefonen.","Aftal, hvem der hjælper med udstyr og praktiske spørgsmål."],"sources":[{"name":"Atos Medical: Coming home after laryngectomy","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"University Hospitals Plymouth: Laryngectomy discharge","url":"https://www.plymouthhospitals.nhs.uk/display-pil/pil-laryngectomy-discharge-4137"},{"name":"Cambridge University Hospitals: Caring for a laryngeal stoma","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"tags":["hjemkomst","pleje"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"hme-filter","category":"Udstyr og pleje","title":"HME: det lille filter med stor betydning","summary":"Sådan hjælper et varme- og fugtudvekslingsfilter luftvejene.","reading_minutes":3,"sections":[{"heading":"Hvad betyder HME?","paragraphs":["HME står for Heat and Moisture Exchanger – på dansk varme- og fugtudveksler. Når du ånder ud gennem filteret, opsamler materialet varme og fugt. Ved næste indånding føres noget af det tilbage til luften."]},{"heading":"Hvorfor bruge det?","paragraphs":["Efter en laryngektomi springer indåndingsluften næsens naturlige filtrering, opvarmning og fugtning over. Det kan give mere eller sejere slim og hoste. Et korrekt anvendt HME-filter kan hjælpe med at mindske generne."]},{"heading":"Hvornår skal det skiftes?","paragraphs":["HME-filtre er normalt engangsprodukter. Skift efter producentens anvisning og tidligere, hvis det bliver fyldt med slim eller svært at trække vejret igennem. Et HME-filter må ikke skylles eller vaskes, da funktionen kan blive ødelagt."]},{"heading":"Forskellige behov","paragraphs":["Der findes forskellige filtre til hverdagsbrug, søvn og aktivitet. En specialiseret behandler kan hjælpe med at finde en kombination, der passer til dig."]}],"remember":["Skyl aldrig et engangs-HME.","Hvis filteret virker tilstoppet, fjern eller skift det og vurder vejrtrækningen."],"sources":[{"name":"Atos Medical: Heat and Moisture Exchanger","url":"https://www.atosmedical.com/laryngectomy/breathing/heat-and-moisture-exchanger"},{"name":"Kræftens Bekæmpelse: Gener efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/gener-efter-operation/"}],"tags":["HME","filter","fugt"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"slim-og-hoste","category":"Udstyr og pleje","title":"Slim og hoste: hvad er normalt?","summary":"Derfor kan luftvejene reagere efter operationen – og hvad der kan hjælpe.","reading_minutes":3,"sections":[{"heading":"Hvorfor dannes der slim?","paragraphs":["Næsen opvarmer og fugter normalt den luft, vi indånder. Når luften i stedet passerer direkte gennem stomaet, kan slimhinden i luftrøret blive mere tør og danne mere slim."]},{"heading":"Hverdagsråd","paragraphs":["Brug dit HME-udstyr som anbefalet. Drik tilstrækkeligt, medmindre du har fået anden besked, og følg din kliniks plan for eventuel ekstra fugtning eller saltvandsbehandling. Undgå at eksperimentere med væsker i stomaet."]},{"heading":"Når du hoster","paragraphs":["Du hoster gennem stomaet, ikke gennem munden. Det kan være praktisk at have servietter og et ekstra HME-filter i nærheden, hvis slim sætter sig i filteret."]},{"heading":"Hvornår bør du reagere?","paragraphs":["Hvis du får pludselig åndenød, tegn på tilstopning, blødning eller hurtigt forværrede symptomer, skal du søge akut hjælp. Ved vedvarende ændringer i slim, hoste eller vejrtrækning bør din klinik eller læge kontaktes."]}],"remember":["Bliver vejrtrækningen pludseligt besværet, skal du ikke nøjes med at prøve hjemmeråd."],"sources":[{"name":"Kræftens Bekæmpelse: Gener efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/gener-efter-operation/"},{"name":"Cambridge University Hospitals: Caring for a laryngeal stoma","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"},{"name":"Atos Medical: Heat and Moisture Exchanger","url":"https://www.atosmedical.com/laryngectomy/breathing/heat-and-moisture-exchanger"}],"tags":["slim","hoste","fugt"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"taleprotese","category":"Udstyr og pleje","title":"Hvad er en Provox-taleprotese?","summary":"Forstå forskellen på taleprotesen og filteret udenpå halsen.","reading_minutes":3,"sections":[{"heading":"To ting med hver sin opgave","paragraphs":["En taleprotese som Provox er en lille ventil mellem luftrøret og spiserøret. Den hjælper med at skabe lyd, når du taler. HME-filteret sidder foran stomaet og hjælper med at opvarme og fugte indåndingsluften."]},{"heading":"Hvorfor skal den passes?","paragraphs":["Taleprotesen udsættes for sekret, bakterier og belægninger. Over tid kan den ændre funktion eller begynde at lække. Derfor er regelmæssig kontrol og den rengøring, du er blevet oplært i, vigtig."]},{"heading":"Hvem skifter den?","paragraphs":["Mange indlagte taleproteser skiftes af fagpersoner. Forsøg ikke selv at trække en indlagt taleprotese ud, medmindre du er specifikt oplært og har fået besked om det for netop din model."]},{"heading":"Kend dit udstyr","paragraphs":["Det er smart at gemme navnet og størrelsen på din taleprotese samt telefonnummeret til den klinik, der hjælper dig."]}],"remember":["Taleprotese og HME-filter er ikke det samme.","Følg vejledningen for den præcise model, du bruger."],"sources":[{"name":"Kræftens Bekæmpelse: At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"},{"name":"Atos Medical: Tips for voice prosthesis users","url":"https://www.atosmedical.co.uk/laryngectomy/care/tips-for-voice-prosthesis-users"}],"tags":["Provox","taleprotese","udstyr"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"taleprotese-laekage","category":"Udstyr og pleje","title":"Når taleprotesen lækker","summary":"Tegn, du kan holde øje med, og hvornår du bør kontakte klinikken.","reading_minutes":4,"sections":[{"heading":"Hvordan opdager man lækage?","paragraphs":["Tegn kan være hoste, når du drikker, eller væske i slimen efter et måltid. Nogle opdager det ved at se væske passere gennem eller rundt om taleprotesen. Det skal tages alvorligt, fordi væske kan ende i luftvejene."]},{"heading":"Lækage gennem eller udenom","paragraphs":["Lækage gennem selve ventilen kan nogle gange skyldes belægninger eller sekret. Lækage rundt om protesen kan kræve en anden vurdering og løsning. En fagperson skal hjælpe med at skelne og vælge behandling."]},{"heading":"Hvad kan du gøre?","paragraphs":["Følg din oplæring i skånsom rengøring med det rigtige udstyr. Hvis du fortsat oplever lækage, kontakt den klinik, der passer din taleprotese, så hurtigt som muligt.","Hvis du har fået udleveret en særlig prop til netop din taleprotese og er oplært i brugen, kan den være en midlertidig hjælp efter afdelingens instruktion."]},{"heading":"Hvornår er det akut?","paragraphs":["Ved vejrtrækningsbesvær, betydelig aspiration eller pludselig forværring skal du søge akut hjælp. En taleprotese, der er faldet ud, kræver hurtig kontakt til klinik eller akut vurdering efter din beredskabsplan."]}],"remember":["Forsøg ikke at ignorere gentagne lækager.","Brug kun en prop, hvis den passer til din protese og du er oplært."],"sources":[{"name":"Atos Medical: What to do if your voice prosthesis is leaking","url":"https://www.atosmedical.co.uk/laryngectomy/care/what-to-do-if-your-voice-prosthesis-is-leaking"},{"name":"Atos Medical: Tips for voice prosthesis users","url":"https://www.atosmedical.co.uk/laryngectomy/care/tips-for-voice-prosthesis-users"}],"tags":["lækage","Provox","taleprotese"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"rengoering-og-hud","category":"Udstyr og pleje","title":"Rengøring, hud og daglige vaner","summary":"Enkle principper for en tryg plejerutine omkring stomaet.","reading_minutes":3,"sections":[{"heading":"Start med god håndhygiejne","paragraphs":["Vask hænder, før du håndterer stomaudstyr og taleprotese. Brug de rensemidler og redskaber, som passer til dine produkter og din individuelle plejeplan."]},{"heading":"Hold øje med huden","paragraphs":["Plastre og klæbere kan irritere huden. Se efter rødme, sår, smerter eller vedvarende ubehag. Det kan være nødvendigt at skifte produkt eller få en faglig vurdering."]},{"heading":"Rens taleprotesen korrekt","paragraphs":["Hvis du bruger en taleprotese, så brug kun den anbefalede børste eller skylleanordning og følg instruktionen for modellen. Mange får råd om rengøring flere gange i døgnet og efter måltider, men din egen kliniks vejledning gælder først."]},{"heading":"Gør det nemt at huske","paragraphs":["Opbevar dine ting samlet, og hav små reserver. En rutine, der faktisk bliver fulgt, er mere værd end en perfekt plan, som er uoverskuelig."]}],"remember":["Brug ikke tilfældige vatpinde eller skarpe genstande i luftvejene.","Kontakt klinikken ved nye sår eller ændringer omkring stomaet."],"sources":[{"name":"Cambridge University Hospitals: Caring for a laryngeal stoma","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"},{"name":"Atos Medical: Tips for voice prosthesis users","url":"https://www.atosmedical.co.uk/laryngectomy/care/tips-for-voice-prosthesis-users"}],"tags":["hud","rengøring","pleje"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"bad-vand","category":"Hverdagsliv","title":"Bad, regn og vand: pas på stomaet","summary":"Det vigtigste om vand, når din luftvej går gennem halsen.","reading_minutes":3,"sections":[{"heading":"Hvorfor er vand en særlig risiko?","paragraphs":["Efter total laryngektomi kan vand, der løber ind i stomaet, komme direkte ned i luftrøret og lungerne. Næse og mund giver ikke en alternativ luftvej, hvis stomaet dækkes af vand."]},{"heading":"Når du går i bad","paragraphs":["Brug kun et godkendt badetilbehør, hvis du er oplært i det. Ret bruserens stråle væk fra stomaet, og følg producentens anvisning for eventuel badebeskyttelse. Et almindeligt HME-filter er ikke nødvendigvis egnet som vandbeskyttelse."]},{"heading":"Svømning kræver særlig vurdering","paragraphs":["Svømning og aktiviteter med risiko for at komme under vand er farlige uden specialudstyr, individuel oplæring og faglig vurdering. Gå ikke ud fra, at almindelig stomaafdækning gør det sikkert."]},{"heading":"Hvis vand kommer i luftvejene","paragraphs":["Søg hjælp med det samme ved hoste, åndenød eller andre symptomer efter vand i stomaet. Ved alvorlige vejrtrækningsproblemer: ring 112."]}],"remember":["Stomaet er din eneste luftvej.","Almindeligt badeudstyr og svømmeudstyr må ikke forveksles."],"sources":[{"name":"Cambridge University Hospitals: Caring for a laryngeal stoma","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"},{"name":"Imperial NHS: Looking after your neck stoma (PDF)","url":"https://www.imperial.nhs.uk/-/media/website/patient-information-leaflets/speech-and-language-therapy/looking-after-your-neck-stoma-after-laryngectomy-surgery.pdf"},{"name":"University Hospitals Plymouth: Laryngectomy discharge","url":"https://www.plymouthhospitals.nhs.uk/display-pil/pil-laryngectomy-discharge-4137"}],"tags":["bad","svømning","vand"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"mad-synkebesvaer","category":"Hverdagsliv","title":"Mad og synkebesvær","summary":"Hvorfor det at spise kan føles anderledes efter operationen.","reading_minutes":3,"sections":[{"heading":"Luftvej og spisevej er adskilt","paragraphs":["Efter total laryngektomi er den normale forbindelse mellem luftveje og spiserør adskilt. Det betyder dog ikke, at alle automatisk kan spise uden problemer. Operation og eventuel behandling kan påvirke synkningen."]},{"heading":"Når maden er svær at få ned","paragraphs":["Nogle oplever, at bestemte konsistenser sætter sig fast, eller at synkning kræver ekstra arbejde. Det er vigtigt at fortælle om nytilkommet eller tiltagende synkebesvær, vægttab eller smerter til dit behandlingsteam."]},{"heading":"Praktiske vaner","paragraphs":["Spis i et tempo, der passer dig, og følg de konkrete råd om konsistens og synketeknik, du har fået af fagpersoner. Forsøg ikke at presse fastsiddende mad ned med store mængder væske."]},{"heading":"Hvis du har taleprotese","paragraphs":["En utæt taleprotese kan give en vej for mad eller drikke til luftvejene. Hoste eller væske fra stomaet under spisning bør derfor vurderes."]}],"remember":["Fortsat synkebesvær er noget, du bør få undersøgt.","Der er forskel på synkebesvær og lækage fra taleprotesen."],"sources":[{"name":"Kræftens Bekæmpelse: Livet med og efter strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"},{"name":"Kræftens Bekæmpelse: Operation af strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"},{"name":"Atos Medical: What to do if your voice prosthesis is leaking","url":"https://www.atosmedical.co.uk/laryngectomy/care/what-to-do-if-your-voice-prosthesis-is-leaking"}],"tags":["mad","synkning","dysfagi"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"motion","category":"Hverdagsliv","title":"Motion, gåture og træning","summary":"Du kan være aktiv som strubeløs, men det kræver omtanke.","reading_minutes":3,"sections":[{"heading":"Bevægelse er stadig mulig","paragraphs":["Gåture, cykling og mange former for træning kan fortsat være en del af livet. Tempo, form og eventuelle senfølger er individuelle, og det giver mening at bygge aktiviteten gradvist op."]},{"heading":"Luft, varme og udstyr","paragraphs":["Fordi luften passerer gennem stomaet, kan vejrtrækningen opleves anderledes ved anstrengelse. Tal med din klinik om egnede HME-løsninger til aktivitet og om de symptomer, du får."]},{"heading":"Vær opmærksom på symptomer","paragraphs":["Ny, tiltagende eller udtalt åndenød, støjende vejrtrækning eller fornemmelse af en snævrere stoma skal vurderes af sundhedspersonale. Pludselige alvorlige vejrtrækningsproblemer er en akut situation."]},{"heading":"Find din egen version af aktiv","paragraphs":["At være aktiv er ikke nødvendigvis at løbe langt. Den gode træning er den, du kan gennemføre sikkert og har lyst til at vende tilbage til."]}],"remember":["Træn ikke gennem alvorlig åndenød.","Få stoma og luftveje vurderet, hvis du oplever en ny begrænsning."],"sources":[{"name":"University Hospitals Plymouth: Laryngectomy discharge","url":"https://www.plymouthhospitals.nhs.uk/display-pil/pil-laryngectomy-discharge-4137"},{"name":"Kræftens Bekæmpelse: Gener efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/gener-efter-operation/"}],"tags":["løb","træning","motion"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"paaroerende","category":"Pårørende","title":"Til pårørende: sådan hjælper du bedst","summary":"Hjælp uden at overtage – i hverdagen og i svære situationer.","reading_minutes":3,"sections":[{"heading":"Lær det vigtigste først","paragraphs":["En person med total laryngektomi trækker vejret gennem stomaet på halsen. Det er vigtig viden ved sygdom og nødsituationer. Lær også, hvilket udstyr personen bruger, og hvem der skal kontaktes ved problemer."]},{"heading":"Giv tid til at tale","paragraphs":["En ny stemme kan kræve ro og mere energi. Skru ned for baggrundsstøj, se på personen, og vær tålmodig, når en sætning skal gentages. Undgå at tale på personens vegne uden at spørge først."]},{"heading":"Spørg, hvad der faktisk hjælper","paragraphs":["Nogle ønsker hjælp til udstyr, indkøb og aftaler. Andre har mest brug for normalitet, humor og plads. Et simpelt ”Hvad ville være en hjælp i dag?” kan være bedre end mange velmente gæt."]},{"heading":"Pårørende må også være påvirkede","paragraphs":["Store operationer forandrer ofte hverdagen for hele familien. Det er normalt at have spørgsmål, bekymringer og brug for egne pauser eller støtte."]}],"remember":["Lær luftvejen at kende.","Respektér personens måde at kommunikere og klare hverdagen på."],"sources":[{"name":"Kræftens Bekæmpelse: Livet med og efter strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"},{"name":"Kræftens Bekæmpelse: At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"},{"name":"National Tracheostomy Safety Project: Laryngectomy emergency algorithm (PDF)","url":"https://tracheostomy.org.uk/e-learning-files/NTSP_01_002-Emergency_Care_lo_pack/pdf/Laryngectomy_Algorithm.pdf"}],"tags":["familie","pårørende","relationer"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"boern-spoerg","category":"Pårørende","title":"Når børn spørger til stomaet","summary":"En måde at forklare en stor forandring med få, ærlige ord.","reading_minutes":2,"sections":[{"heading":"Brug konkrete forklaringer","paragraphs":["Man kan for eksempel sige: ”Min strube er blevet fjernet ved en operation. Derfor trækker jeg vejret gennem det lille hul på halsen, og min stemme lyder anderledes.”"]},{"heading":"Det er okay at spørge","paragraphs":["Børn kan være nysgerrige på lyde, plaster, hoste og tale. Lad spørgsmålene komme i deres eget tempo, og svar så konkret som muligt uden at give flere detaljer, end barnet ønsker."]},{"heading":"Hvad skal barnet vide?","paragraphs":["Barnet skal ikke have ansvaret for din sundhed. Men større børn kan lære at hente en voksen og ringe 112 ved alvorlig vejrtrækningsbesvær, hvis situationen opstår."]},{"heading":"Giv plads til følelser","paragraphs":["Børn kan både blive bekymrede, stolte, irriterede og nysgerrige. De behøver ikke reagere på en bestemt måde."]}],"remember":["Brug ord, barnet forstår.","Gør nødviden enkel uden at gøre barnet ansvarligt."],"sources":[{"name":"Kræftens Bekæmpelse: Livet med og efter strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"},{"name":"Kræftens Bekæmpelse: Operation af strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"}],"tags":["børn","familie","forklaring"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"rejser-og-udstyr","category":"Hverdagsliv","title":"På tur: hvad skal du have med?","summary":"En huskeliste til hverdagsudflugter, weekendture og rejser.","reading_minutes":3,"sections":[{"heading":"Pak ud fra din egen rutine","paragraphs":["Tænk på det udstyr, du bruger på en almindelig dag: ekstra HME, passende plastre eller fæste, renseudstyr, servietter og eventuelle hjælpemidler. Mængden afhænger af turens længde og dine vaner."]},{"heading":"Gør det nemt at få hjælp","paragraphs":["Hav gerne oplysninger om, at du er totalt laryngektomeret, navn på taleprotese/udstyr og relevante telefonnumre. Ved rejser kan en kort tekst på engelsk være nyttig: ”Total laryngectomy. I breathe through my neck stoma only.”"]},{"heading":"Tænk på miljøet","paragraphs":["Tør luft, temperatur, støv og aktivitet kan påvirke behovet for fugt og filtre. En reserveplan kan mindske stress på turen."]},{"heading":"Fly og særlige aktiviteter","paragraphs":["Undersøg praktiske forhold med behandlingsstedet og eventuelt transportselskabet, især hvis du bruger apparater, har aktuelt helbredsproblem eller skal dyrke vandsport."]}],"remember":["Et ekstra filter fylder lidt – men kan være vigtigt.","Opbevar oplysninger om din luftvej let tilgængeligt."],"sources":[{"name":"Atos Medical: Coming home after laryngectomy","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"Cambridge University Hospitals: Caring for a laryngeal stoma","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"tags":["rejse","pakning","udstyr"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"lugte-og-smag","category":"Hverdagsliv","title":"Lugt og smag kan ændre sig","summary":"Lugtesansen virker anderledes, når luft ikke passerer næsen.","reading_minutes":2,"sections":[{"heading":"Hvorfor er lugt anderledes?","paragraphs":["Normalt fører indånding luft og duftstoffer gennem næsen. Efter total laryngektomi foregår vejrtrækningen via halsen, så dufte når ikke næsen på samme måde."]},{"heading":"Smag hænger sammen med lugt","paragraphs":["Meget af madens oplevede smag påvirkes af lugtesansen. Derfor kan maden føles anderledes, selv om selve smagssansen på tungen ikke nødvendigvis er forsvundet."]},{"heading":"Hvad kan hjælpe?","paragraphs":["Spørg en talepædagog eller dit behandlingsteam om lugttræning og egnede teknikker. Nogle kan lære at trække duftstoffer op mod næsen med en særlig mund- og kæbebevægelse."]}],"remember":["En ændret lugtesans er en almindelig følge af, at luftvejen er flyttet."],"sources":[{"name":"Kræftens Bekæmpelse: Operation af strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"},{"name":"University Hospitals Plymouth: Laryngectomy discharge","url":"https://www.plymouthhospitals.nhs.uk/display-pil/pil-laryngectomy-discharge-4137"}],"tags":["lugt","smag","sanser"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"arbejde-og-socialt","category":"Hverdagsliv","title":"Arbejde og sociale situationer","summary":"Små aftaler kan gøre møder, telefonopkald og hverdagsliv lettere.","reading_minutes":3,"sections":[{"heading":"Fortæl det vigtigste – på din måde","paragraphs":["Du bestemmer, hvor meget du vil dele om operationen. En kort forklaring på den nye stemme og luftvejen kan mindske misforståelser hos kolleger og andre."]},{"heading":"Aftal hjælp til kommunikationen","paragraphs":["I støjende rum kan mikrofon, skriftlige beskeder eller en ekstra pause gøre en forskel. Ved møder kan det hjælpe, at én taler ad gangen, og at der er tid til spørgsmål."]},{"heading":"Et tempo, der holder","paragraphs":["En ny hverdag kan have flere rutiner og mere træthed. Tal med relevante fagpersoner om dine muligheder, hvis du har behov for ændrede opgaver eller hensyn på jobbet."]},{"heading":"Du er mere end operationen","paragraphs":["Nogle vil helst forklare alt én gang. Andre bruger humor. Begge dele kan fungere – og du må skifte mening."]}],"remember":["Du bestemmer selv din fortælling.","Praktiske tilpasninger er ikke det samme som at give afkald på ambitioner."],"sources":[{"name":"Kræftens Bekæmpelse: Livet med og efter strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"},{"name":"Kræftens Bekæmpelse: At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"}],"tags":["arbejde","socialt","kommunikation"],"emergency":false,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"},{"id":"akut-vejrtraekning","category":"Sikkerhed","title":"AKUT: svært ved at trække vejret","summary":"Nødviden for personer med total laryngektomi og deres pårørende.","reading_minutes":2,"sections":[{"heading":"Ring 112 ved alvorligt vejrtrækningsbesvær","paragraphs":["Hvis personen ikke kan få luft, bliver bevidsthedspåvirket eller holder op med at trække vejret, skal der ringes 112 med det samme. Fortæl: ”Personen er totalt laryngektomeret og trækker kun vejret gennem stomaet på halsen.”"]},{"heading":"Luftvejen er på halsen","paragraphs":["Ved total laryngektomi er der ingen forbindelse fra mund eller næse til lungerne. Ambulancepersonale skal derfor sikre luft og eventuel ventilation gennem stomaet på halsen – ikke via mund og næse."]},{"heading":"Hvis et filter blokerer","paragraphs":["Hvis et HME-filter eller en ydre stomadækning tydeligt er blokeret og kan fjernes let, kan den fjernes, så stomaet er frit. Forsøg ikke at fjerne en indlagt taleprotese. Brug kun sugning eller andet luftvejsudstyr, hvis du er oplært i det."]},{"heading":"Følg alarmcentralens instruktioner","paragraphs":["Alarmcentralen guider førstehjælp og eventuel genoplivning. Denne side er kun en huskeregel og erstatter ikke individuel beredskabsplan eller praktisk oplæring."]}],"remember":["112 ved akut svær åndenød.","Sig tydeligt: ”TOTAL LARYNGEKTOMI – KUN VEJRTRÆKNING GENNEM HALSEN.”","Fjern ikke taleprotesen."],"sources":[{"name":"National Tracheostomy Safety Project: Laryngectomy emergency algorithm (PDF)","url":"https://tracheostomy.org.uk/e-learning-files/NTSP_01_002-Emergency_Care_lo_pack/pdf/Laryngectomy_Algorithm.pdf"},{"name":"Kræftens Bekæmpelse: Operation af strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"}],"tags":["akut","112","luftvej"],"emergency":true,"review_status":"Udkast – afventer sundhedsfaglig gennemgang","updated_at":"2026-10-20"}],"faq":[{"id":"faq-01","category":"Forstå operationen","question":"Hvad vil det sige at være strubeløs?","answer":"Når hele strubehovedet er fjernet ved en total laryngektomi, trækker man vejret gennem en permanent åbning på halsen – et stoma. Stemmen, vejrtrækningen og nogle daglige rutiner bliver anderledes. Men det er stadig muligt at leve et aktivt og meningsfuldt liv.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"Kræftens Bekæmpelse · Operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-02","category":"Forstå operationen","question":"Hvad er forskellen på laryngektomi og trakeostomi?","answer":"Ved total laryngektomi er strubehovedet fjernet, og luftvejen til lungerne går kun gennem stomaet. Ved en trakeostomi er der lavet en åbning til luftrøret, men struben kan være bevaret. Den forskel er helt afgørende i en nødsituation.","sources":[{"name":"Kræftens Bekæmpelse · Operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"},{"name":"National Tracheostomy Safety Project · Akut-algoritme (PDF)","url":"https://tracheostomy.org.uk/e-learning-files/NTSP_01_002-Emergency_Care_lo_pack/pdf/Laryngectomy_Algorithm.pdf"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-03","category":"Forstå operationen","question":"Kan jeg trække vejret gennem næsen eller munden?","answer":"Nej, ikke efter en total laryngektomi. Mund og næse er ikke længere forbundet med lungerne. Du trækker vejret gennem stomaet på halsen – også når du sover.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"National Tracheostomy Safety Project · Akut-algoritme (PDF)","url":"https://tracheostomy.org.uk/e-learning-files/NTSP_01_002-Emergency_Care_lo_pack/pdf/Laryngectomy_Algorithm.pdf"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-04","category":"Forstå operationen","question":"Er stomaet permanent?","answer":"Ja, efter en total laryngektomi er stomaet den permanente åbning, du trækker vejret igennem. Dets form og størrelse kan ændre sig under helingen; kontakt din klinik, hvis åbningen bliver snævrere, eller vejrtrækningen ændrer sig.","sources":[{"name":"Kræftens Bekæmpelse · Operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"},{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-05","category":"Forstå operationen","question":"Hvor lang tid tager det at vænne sig til den nye hverdag?","answer":"Det er meget forskelligt. Nogle finder hurtigt rutiner med tale, HME og pleje, mens andre bruger længere tid – især hvis de også har synkebesvær eller andre senfølger. Det er en god idé at tage ét problem ad gangen og få hjælp fra det behandlende team.","sources":[{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"Kræftens Bekæmpelse · Livet efter behandling","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-06","category":"Forstå operationen","question":"Kan man leve et almindeligt liv som strubeløs?","answer":"Mange vender tilbage til arbejde, familieaktiviteter, rejser og fritidsinteresser. Der kan være praktiske begrænsninger og behov for tilpasninger, især omkring vand, vejrtrækning, stemme og udstyr. Et godt liv behøver ikke at se ud præcis som før.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-07","category":"Forstå operationen","question":"Hvorfor får nogen fjernet struben?","answer":"Total laryngektomi bruges især ved visse kræftsygdomme i eller omkring struben, men kan også i særlige tilfælde være nødvendig af andre grunde. Begrundelsen er individuel, og behandlingsforløbene kan derfor være meget forskellige.","sources":[{"name":"Kræftens Bekæmpelse · Operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-08","category":"Vejrtrækning \u0026 stoma","question":"Hvorfor producerer jeg mere slim?","answer":"Normalt opvarmer, filtrerer og fugter næsen luften. Efter en laryngektomi passerer luften direkte ind gennem stomaet. Det kan udtørre luftvejene og give ekstra eller sejere slim. HME og anbefalet fugtning kan hjælpe.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"Kræftens Bekæmpelse · Gener efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/gener-efter-operation/"},{"name":"Atos Medical · HME og pleje","url":"https://www.atosmedical.ca/laryngectomy/breathing-after-laryngectomy/the-dos-and-donts-of-hmes"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-09","category":"Vejrtrækning \u0026 stoma","question":"Hvordan hoster man som strubeløs?","answer":"Du hoster luften og slimen ud gennem stomaet i stedet for munden. Hav gerne servietter og et ekstra HME-filter ved hånden. Ved slim, som du ikke kan få op, eller tiltagende åndenød, skal du følge din kliniks plan og søge hjælp.","sources":[{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-10","category":"Vejrtrækning \u0026 stoma","question":"Hvorfor føles kold luft ubehagelig?","answer":"Kold, tør luft når direkte ned i luftvejene uden næsens opvarmning. Det kan udløse hoste og mere slim. HME og passende beskyttelse af stomaet kan gøre det mere behageligt.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"Atos Medical · HME og pleje","url":"https://www.atosmedical.ca/laryngectomy/breathing-after-laryngectomy/the-dos-and-donts-of-hmes"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-11","category":"Vejrtrækning \u0026 stoma","question":"Må der komme støv eller parfume ind gennem stomaet?","answer":"Stomaet fører luft direkte til lungerne. Derfor er det fornuftigt at begrænse støv, røg, aerosoler og andre ting, som kan irritere luftvejene. Brug passende åndedrætsbeskyttelse efter faglig vejledning, hvis dit arbejde eller din hobby udsætter dig for partikler.","sources":[{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"},{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-12","category":"Vejrtrækning \u0026 stoma","question":"Kan stomaet blive for lille?","answer":"Ja, hos nogle bliver stomaet snævrere over tid. Tiltagende modstand ved vejrtrækning, især under aktivitet, skal vurderes af en specialiseret klinik. Undlad selv at udvide åbningen eller ændre eventuelle rør uden instruktion.","sources":[{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-13","category":"Vejrtrækning \u0026 stoma","question":"Kan jeg blive forkølet, når jeg er strubeløs?","answer":"Ja. Du kan stadig få luftvejsinfektioner, selvom luften ikke passerer gennem næse og mund. Ved feber, ændret slim, smerter eller forværret vejrtrækning bør du kontakte læge eller klinik; ved akut åndenød ring 112.","sources":[{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"},{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-14","category":"Vejrtrækning \u0026 stoma","question":"Hvorfor bliver jeg forpustet under aktivitet?","answer":"Der kan være flere forklaringer, blandt andet kondition, slim, filtermodstand eller forsnævring af stomaet. Ved ny eller tiltagende åndenød bør årsagen vurderes af en kliniker – særligt hvis det også sker uden HME.","sources":[{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-15","category":"Vejrtrækning \u0026 stoma","question":"Kan jeg bruge HME, når jeg sover?","answer":"Ja, HME anbefales som regel både dag og nat, fordi luftvejene hele tiden har behov for fugt og varme. Der findes løsninger beregnet til natten. Få hjælp til at vælge udstyr, der passer til dig.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"Atos Medical · HME og pleje","url":"https://www.atosmedical.ca/laryngectomy/breathing-after-laryngectomy/the-dos-and-donts-of-hmes"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-16","category":"Tale \u0026 kommunikation","question":"Hvordan kan jeg tale uden stemmebånd?","answer":"Der findes tre almindelige muligheder: taleprotese, elektronisk strubevibrator og spiserørsstemme. Hvilken løsning der fungerer bedst, afhænger blandt andet af operation, anatomi og træning. Du kan få støtte til genoptræning af stemmen.","sources":[{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-17","category":"Tale \u0026 kommunikation","question":"Hvad er en Provox-taleprotese?","answer":"Det er en lille envejsventil mellem luftrøret og spiserøret. Når udåndingsluft ledes gennem den, kan væv i svælget danne lyd, som du former til ord. Protesen er ikke det samme som det HME-filter, der sidder foran stomaet.","sources":[{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"},{"name":"Atos Medical · Tips til taleproteser","url":"https://www.atosmedical.co.uk/laryngectomy/care/tips-for-voice-prosthesis-users"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-18","category":"Tale \u0026 kommunikation","question":"Hvorfor skal jeg trykke på mit HME for at tale?","answer":"Hvis du bruger taleprotese, skal udåndingsluften ledes gennem protesen i stedet for ud af stomaet. Mange lukker midlertidigt luftvejen foran stomaet med en finger på et egnet HME-hus. Andre bruger håndfri taleudstyr.","sources":[{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-19","category":"Tale \u0026 kommunikation","question":"Kan man få en håndfri stemme?","answer":"Nogle kan bruge en håndfri taleventil, der hjælper med at lukke stomaet ved tale. Det kræver blandt andet en passende tætsluttende løsning og tilpasning af en fagperson. Den passer ikke nødvendigvis til alle.","sources":[{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-20","category":"Tale \u0026 kommunikation","question":"Kan jeg tale i telefon?","answer":"Ja, mange kan tale i telefon, men taleprotesestemmen kan være sværere at forstå i støj. Brug eventuelt høretelefoner, rolige omgivelser, videoopkald eller tekstbeskeder. En telefon med tekst-til-tale kan være en nyttig reserve.","sources":[{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-21","category":"Tale \u0026 kommunikation","question":"Kan man grine eller græde som strubeløs?","answer":"Ja, følelserne og ansigtsudtrykkene er der stadig, men lydene kan blive anderledes uden de normale stemmebånd. Nogle laver lyd via taleprotesen eller andre stemmemetoder, mens andre griner næsten lydløst. Det er individuelt.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-22","category":"Tale \u0026 kommunikation","question":"Hvorfor er min stemme svær at høre i støj?","answer":"Styrke og klang kan ændre sig efter operationen. I støj kan det hjælpe at vende sig mod hinanden, tale én ad gangen og bede andre om at dæmpe baggrundslyde. Hvis stemmen pludselig ændrer sig, bør taleprotesen eller forhold i svælget vurderes.","sources":[{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"},{"name":"Atos Medical · Tips til taleproteser","url":"https://www.atosmedical.co.uk/laryngectomy/care/tips-for-voice-prosthesis-users"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-23","category":"Tale \u0026 kommunikation","question":"Hvad gør jeg, hvis jeg midlertidigt ikke kan tale?","answer":"Aftal på forhånd et alternativ: skriv på telefonen, brug en tekst-til-tale-app, papir eller en elektronisk strubevibrator, hvis du har en. Gem gerne en kort besked om, at du trækker vejret gennem stomaet.","sources":[{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-24","category":"Udstyr \u0026 pleje","question":"Hvad står HME for?","answer":"HME betyder Heat and Moisture Exchanger – en varme- og fugtudveksler. Den hjælper med at holde på varme og fugt fra udåndingsluften og giver noget af det tilbage ved næste indånding.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"Atos Medical · HME og pleje","url":"https://www.atosmedical.ca/laryngectomy/breathing-after-laryngectomy/the-dos-and-donts-of-hmes"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-25","category":"Udstyr \u0026 pleje","question":"Hvor tit skal et HME-filter skiftes?","answer":"Det afhænger af produkt og forholdene, men almindelige engangs-HME-filtre bruges typisk højst omkring et døgn og skal skiftes tidligere, hvis de bliver fyldt med slim eller snavs. Følg altid anvisningen til din specifikke model.","sources":[{"name":"Atos Medical · HME og pleje","url":"https://www.atosmedical.ca/laryngectomy/breathing-after-laryngectomy/the-dos-and-donts-of-hmes"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-26","category":"Udstyr \u0026 pleje","question":"Må jeg vaske mit HME-filter?","answer":"Nej, engangs-HME-filtre må ikke vaskes og genbruges. Vand kan ødelægge filterets varme- og fugtbevarende virkning. Brug i stedet et nyt filter.","sources":[{"name":"Atos Medical · HME og pleje","url":"https://www.atosmedical.ca/laryngectomy/breathing-after-laryngectomy/the-dos-and-donts-of-hmes"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-27","category":"Udstyr \u0026 pleje","question":"Hvad er forskellen på stomaplaster og LaryTube?","answer":"Et stomaplaster holder typisk HME eller taleudstyr fast udenpå huden omkring stomaet. En LaryTube er et blødt rør, som efter klinikkens anvisning kan sidde inde i stomaet og blandt andet hjælpe med at holde åbningen fri. Løsningerne vælges individuelt.","sources":[{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"},{"name":"Kræftens Bekæmpelse · Gener efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/gener-efter-operation/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-28","category":"Udstyr \u0026 pleje","question":"Hvordan passer jeg på huden omkring stomaet?","answer":"Huden skal holdes ren og tør, og plastre skal fjernes forsigtigt. Brug kun de plejeprodukter, din klinik anbefaler til dit udstyr. Ved vedvarende rødme, væskende hud eller smerter bør du få området vurderet.","sources":[{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"},{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-29","category":"Udstyr \u0026 pleje","question":"Hvorfor begynder en taleprotese at lække?","answer":"Med tiden kan slim, madrester og belægninger påvirke ventilen. Der kan komme lækage gennem ventilen eller rundt om den, og de to problemer håndteres forskelligt. Hoste under eller efter drikke er et muligt tegn.","sources":[{"name":"Atos Medical · Taleproteselækage","url":"https://www.atosmedical.us/news/voice-prosthesis-leakage-tips-for-effective-management-care"},{"name":"Atos Medical · Tips til taleproteser","url":"https://www.atosmedical.co.uk/laryngectomy/care/tips-for-voice-prosthesis-users"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-30","category":"Udstyr \u0026 pleje","question":"Hvad gør jeg, hvis min taleprotese lækker?","answer":"Følg den rengøring og lækageplan, du har fået fra din klinik. En korrekt tilpasset prop kan være en midlertidig løsning for nogle ved lækage gennem protesen, men ikke ved alle typer lækage. Kontakt klinikken for vurdering og eventuelt skift; søg akut hjælp ved alvorlige symptomer.","sources":[{"name":"Atos Medical · Taleproteselækage","url":"https://www.atosmedical.us/news/voice-prosthesis-leakage-tips-for-effective-management-care"},{"name":"Atos Medical · Tips til taleproteser","url":"https://www.atosmedical.co.uk/laryngectomy/care/tips-for-voice-prosthesis-users"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-31","category":"Udstyr \u0026 pleje","question":"Må jeg selv skifte taleprotesen?","answer":"Nogle særlige systemer kan være beregnet til patientskift, men mange taleproteser skiftes af uddannet personale. Forsøg ikke at fjerne eller sætte en protese i uden specifik oplæring og godkendelse til netop din model.","sources":[{"name":"Atos Medical · Tips til taleproteser","url":"https://www.atosmedical.co.uk/laryngectomy/care/tips-for-voice-prosthesis-users"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-32","category":"Mad \u0026 sanser","question":"Kan man spise og drikke som strubeløs?","answer":"Ja, mange kan spise og drikke gennem munden efter helingen. Mad går normalt gennem spiserøret og ikke via stomaet. Synkningen kan dog være vanskeligere for nogle på grund af operation, arvæv eller anden behandling.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"Kræftens Bekæmpelse · Livet efter behandling","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-33","category":"Mad \u0026 sanser","question":"Hvorfor har jeg svært ved at synke?","answer":"Synkebesvær kan skyldes forandringer i svælg eller spiserør, arvæv og andre senfølger. Ved vedvarende besvær, smerter, vægttab eller mad, der sætter sig fast, bør du få en faglig vurdering – der kan være hjælp at hente.","sources":[{"name":"Kræftens Bekæmpelse · Livet efter behandling","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"},{"name":"Kræftens Bekæmpelse · Opfølgning","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/opfoelgning/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-34","category":"Mad \u0026 sanser","question":"Kan mad komme ned i lungerne?","answer":"Efter en total laryngektomi er spiserør og luftrør adskilt, så mad går normalt ikke fra munden direkte i lungerne. Hvis man har taleprotese, kan væske eller mad dog i nogle tilfælde lække gennem eller omkring den. Kontakt klinikken ved tegn på lækage.","sources":[{"name":"Kræftens Bekæmpelse · Operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"},{"name":"Atos Medical · Taleproteselækage","url":"https://www.atosmedical.us/news/voice-prosthesis-leakage-tips-for-effective-management-care"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-35","category":"Mad \u0026 sanser","question":"Hvorfor smager maden anderledes?","answer":"Smag og lugt hænger tæt sammen. Når luft ikke længere passerer naturligt gennem næsen, kan du opleve, at maden smager mindre intenst. Eventuel strålebehandling og andre senfølger kan også påvirke smagen.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"Kræftens Bekæmpelse · Livet efter behandling","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-36","category":"Mad \u0026 sanser","question":"Kan man lære at lugte igen?","answer":"Nogle kan forbedre lugtesansen gennem særlige teknikker, hvor man skaber luftbevægelse gennem næsen med mund og tunge. Teknikken kaldes blandt andet ”polite yawning”. En talepædagog kan vejlede og vise den korrekt.","sources":[{"name":"Royal Devon NHS · Træning af lugtesans (PDF)","url":"https://www.royaldevon.nhs.uk/media/q2wbeqes/patient-information-leaflet-learning-how-to-smell-after-a-laryngectomy-rde-21-077-001.pdf"},{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-37","category":"Mad \u0026 sanser","question":"Hvorfor er røgalarmer ekstra vigtige?","answer":"Når lugtesansen er nedsat, kan det være sværere at opdage røg eller andre faresignaler ved hjælp af lugt. Sørg for fungerende røgalarmer og relevante sikkerhedsløsninger i hjemmet.","sources":[{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-38","category":"Motion \u0026 vand","question":"Kan man dyrke motion efter en laryngektomi?","answer":"Ja, mange går, cykler eller træner, når de er klar og har fået grønt lys af deres behandlere. Begynd gradvist, og få ny eller markant åndenød vurderet. Særlige HME-løsninger kan være relevante under aktivitet.","sources":[{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-39","category":"Motion \u0026 vand","question":"Kan jeg løbe med HME-filter?","answer":"Nogle bruger særlige filtre til aktivitet, men oplevelsen af luftmodstand varierer. Hvis du bliver meget forpustet eller føler, at luften ikke kommer ordentligt igennem, bør klinikken vurdere både stoma, udstyr og vejrtrækning.","sources":[{"name":"Atos Medical · HME og pleje","url":"https://www.atosmedical.ca/laryngectomy/breathing-after-laryngectomy/the-dos-and-donts-of-hmes"},{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-40","category":"Motion \u0026 vand","question":"Må jeg gå i brusebad?","answer":"Ja, men vand må ikke løbe ind i stomaet. Mange bruger et brusebadsskjold og holder vandstrålen væk fra halsåbningen. Få demonstreret en løsning, som passer til dit stoma og udstyr.","sources":[{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-41","category":"Motion \u0026 vand","question":"Kan jeg svømme?","answer":"Almindelig svømning uden specialudstyr er farlig, fordi vand kan komme direkte i lungerne gennem stomaet. Svømning kan for enkelte være mulig med godkendt udstyr, særlig oplæring og vurdering fra et specialiseret team. Gå aldrig i vandet med almindeligt HME som eneste beskyttelse.","sources":[{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-42","category":"Motion \u0026 vand","question":"Hvad med regn, sne og blæst?","answer":"Beskyt stomaet mod direkte vand, kulde og partikler. HME og hensigtsmæssig stomasikring hjælper i mange situationer, men må ikke antages at være vandtæt. Hav gerne ekstra udstyr med på længere ture.","sources":[{"name":"Atos Medical · HME og pleje","url":"https://www.atosmedical.ca/laryngectomy/breathing-after-laryngectomy/the-dos-and-donts-of-hmes"},{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-43","category":"Motion \u0026 vand","question":"Kan jeg flyve og rejse?","answer":"Som udgangspunkt kan mange rejse efter heling og lægelig afklaring. Medbring ekstra filtre, plastre, eventuelle hjælpemidler og en kort information om din vejrtrækning. Planlæg hvor du kan få hjælp, hvis din taleprotese eller dit stoma giver problemer.","sources":[{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"},{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-44","category":"Hverdag \u0026 pårørende","question":"Hvordan forklarer jeg mit stoma til børn?","answer":"Brug få, konkrete ord: ”Jeg trækker vejret gennem et hul på halsen, fordi min strube er blevet fjernet. Jeg kan stadig være mig.” Giv plads til spørgsmål og vis udstyret i et roligt tempo, hvis barnet er trygt ved det.","sources":[{"name":"Kræftens Bekæmpelse · Livet efter behandling","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"},{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-45","category":"Hverdag \u0026 pårørende","question":"Hvordan kan pårørende hjælpe bedst?","answer":"Spørg, hvad personen faktisk har brug for, i stedet for at overtage alle opgaver. Lær forskellen på stoma og mund/næse som luftvej, og kend den individuelle nødplan. Giv tid til samtaler – også når stemmen lyder anderledes.","sources":[{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"},{"name":"National Tracheostomy Safety Project · Akut-algoritme (PDF)","url":"https://tracheostomy.org.uk/e-learning-files/NTSP_01_002-Emergency_Care_lo_pack/pdf/Laryngectomy_Algorithm.pdf"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-46","category":"Hverdag \u0026 pårørende","question":"Kan jeg vende tilbage på arbejde?","answer":"Mange kan arbejde efter en total laryngektomi, men nogle har brug for ændrede arbejdsopgaver, pauser eller ekstra sikkerhedsforanstaltninger ved støv, vand og fysisk belastning. Tal med behandlere og arbejdsplads om konkrete behov.","sources":[{"name":"Kræftens Bekæmpelse · Livet efter behandling","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-47","category":"Hverdag \u0026 pårørende","question":"Er det normalt at være ked af det eller træt?","answer":"En stor operation og ændringer i stemmen og hverdagen kan påvirke både humør og energi. Det betyder ikke, at alle reagerer ens. Hvis tristhed eller udmattelse fylder meget eller bliver ved, er det vigtigt at tale med egen læge eller dit behandlingsteam.","sources":[{"name":"Kræftens Bekæmpelse · Livet efter behandling","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-48","category":"Hverdag \u0026 pårørende","question":"Hvad skal jeg have med hjemmefra?","answer":"Mange har glæde af ekstra HME, passende stomaplastre, rengøringsudstyr, servietter, et alternativ til tale og en nød-/informationskort om total laryngektomi. Hvad du konkret skal medbringe, afhænger af dit udstyr og klinikkens anbefalinger.","sources":[{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"}],"urgent":false,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-49","category":"Akut \u0026 hjælp","question":"Hvad gør man ved pludseligt svært ved at trække vejret?","answer":"Ring 112 ved akut vejrtrækningsbesvær. Fortæl tydeligt: ”Personen er totalt laryngektomeret og trækker kun vejret gennem stomaet på halsen.” Luft og ilt skal gives via stomaet – ikke via næse eller mund. Følg den personlige nødplan, mens hjælpen er på vej.","sources":[{"name":"National Tracheostomy Safety Project · Akut-algoritme (PDF)","url":"https://tracheostomy.org.uk/e-learning-files/NTSP_01_002-Emergency_Care_lo_pack/pdf/Laryngectomy_Algorithm.pdf"}],"urgent":true,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"},{"id":"faq-50","category":"Akut \u0026 hjælp","question":"Hvad hvis taleprotesen falder ud?","answer":"Kontakt straks den afdeling, der passer din taleprotese, eller akut sundhedsfaglig hjælp efter din nødplan. Kanalen mellem luftrør og spiserør kan ændre sig hurtigt, og der kan være risiko for at indånde væske. Forsøg ikke at sætte en fremmed genstand i åbningen. Ved vejrtrækningsbesvær ring 112.","sources":[{"name":"Atos Medical · Tips til taleproteser","url":"https://www.atosmedical.co.uk/laryngectomy/care/tips-for-voice-prosthesis-users"},{"name":"Atos Medical · Taleproteselækage","url":"https://www.atosmedical.us/news/voice-prosthesis-leakage-tips-for-effective-management-care"}],"urgent":true,"status":"Udkast · afventer sundhedsfaglig kvalitetssikring"}],"sources":{"basis":{"name":"Atos Medical Danmark · Total laryngektomi","url":"https://www.atosmedical.dk/laryngektomi/hvad-er-en-total-laryngektomy"},"operation":{"name":"Kræftens Bekæmpelse · Operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"},"voice":{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"},"after":{"name":"Kræftens Bekæmpelse · Gener efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/gener-efter-operation/"},"life":{"name":"Kræftens Bekæmpelse · Livet efter behandling","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/livet-med-og-efter-strubekraeft/"},"hme":{"name":"Atos Medical · HME og pleje","url":"https://www.atosmedical.ca/laryngectomy/breathing-after-laryngectomy/the-dos-and-donts-of-hmes"},"care":{"name":"Cambridge University Hospitals · Stoma og taleprotese","url":"https://www.cuh.nhs.uk/patient-information/caring-for-a-laryngeal-stoma-and-voice-prosthesis-after-a-laryngectomy/"},"leak":{"name":"Atos Medical · Taleproteselækage","url":"https://www.atosmedical.us/news/voice-prosthesis-leakage-tips-for-effective-management-care"},"prosthesis":{"name":"Atos Medical · Tips til taleproteser","url":"https://www.atosmedical.co.uk/laryngectomy/care/tips-for-voice-prosthesis-users"},"home":{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},"emergency":{"name":"National Tracheostomy Safety Project · Akut vejledning","url":"https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy"},"smell":{"name":"Royal Devon NHS · Træning af lugtesans (PDF)","url":"https://www.royaldevon.nhs.uk/media/q2wbeqes/patient-information-leaflet-learning-how-to-smell-after-a-laryngectomy-rde-21-077-001.pdf"},"followup":{"name":"Kræftens Bekæmpelse · Opfølgning","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/opfoelgning/"}},"newly_operated":{"heading":"Nyopereret? Du er ikke alene.","intro":"Fem overskuelige trin om tiden efter total laryngektomi. Brug dem i den rækkefølge, der passer dig. Heling, udstyr og forløb varierer – din afdelings instruktioner gælder altid først.","disclaimer":"Dette er et generelt informationsudkast, ikke en behandlingsplan. Få alle anvisninger om stoma, rør, HME, taleprotese, medicin og ernæring af dit eget behandlingsteam.","stages":[{"id":"lige-efter","glyph":"01","short":"Lige efter operationen","title":"De første timer og døgn","period":"Typisk på hospitalet","summary":"Det hele kan føles nyt. Du skal ikke kunne det hele allerede nu. Personalet hjælper med din vejrtrækning, din pleje og din kommunikation.","sections":[{"title":"Du trækker vejret gennem halsen","body":"Efter en total laryngektomi er luftrøret ført ud til et permanent stoma på halsen. Mund og næse har ikke længere luftforbindelse til lungerne. Det er den vigtigste information, både for dig og alle, der hjælper dig."},{"title":"Slanger, dræn og sonde kan være en del af forløbet","body":"Du kan vågne med dræn, drop, sonde til ernæring og udstyr omkring stomaet. Hvilket udstyr og hvor længe du har det, afhænger af operationen og din heling. Du skal ikke selv fjerne eller justere udstyret."},{"title":"Du kan kommunikere uden at tale","body":"Personalet kan hjælpe med pen og papir, mobil, billeder eller en kommunikationstavle. Tale med en eventuel taleprotese begynder først, når dit team siger god for det."},{"title":"Smerter og følelser er også en del af samtalen","body":"Fortæl personalet, hvis smerter, ubehag, uro eller bekymringer fylder. Det kan være en stor omvæltning at vågne op med en helt ny luftvej, selv når operationen har været planlagt."}],"checkpoints":["Jeg ved, at min luftvej er stomaet på halsen.","Jeg ved, hvordan jeg tilkalder personalet uden stemme.","Jeg har en enkel måde at kommunikere mine behov på.","Jeg ved, hvem jeg skal sige til ved smerter eller åndenød."],"questions":["Hvilket udstyr sidder i mit stoma lige nu?","Hvordan får jeg hurtigt fat i hjælp, hvis jeg ikke kan tale?","Hvornår får jeg første oplæring i pleje af stomaet?"],"sources":[{"name":"Kræftens Bekæmpelse · Operation for strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"},{"name":"Cancer Research UK · Tiden efter operationen","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/treatment/surgery/after-surgery"},{"name":"Macmillan Cancer Support · Efter laryngektomi","url":"https://www.macmillan.org.uk/cancer-information-and-support/impacts-of-cancer/after-a-laryngectomy"}]},{"id":"indlagt","glyph":"02","short":"Mens du er indlagt","title":"Lær din nye hverdag at kende","period":"De følgende dage – i dit tempo","summary":"Det er ikke et kapløb. Du lærer gradvist udstyret at kende, mens teamet vurderer sårheling, ernæring, vejrtrækning og behov for hjælp.","sections":[{"title":"Slim og hoste er anderledes","body":"Du hoster nu gennem stomaet. I begyndelsen kan der være mere slim, og du kan have brug for hjælp til at holde luftvejen fri. Personalet viser dig din egen plan for rengøring, fugtning og eventuel sugning."},{"title":"HME fungerer som en ny næse","body":"Når din klinik har valgt en passende løsning, kan et HME-filter hjælpe med at varme og fugte indåndingsluften. Hvilket filter og hvilken fastgørelse du skal bruge, afhænger af helingen og dit udstyr. HME må ikke vaskes og genbruges."},{"title":"Mad og drikke starter efter klinikkens vurdering","body":"Det er almindeligt at få ernæring via sonde i den første tid for at beskytte operationsområdet. Du må først genoptage mad og drikke, når behandlingsteamet har undersøgt dig og givet besked om det."},{"title":"Stomastørrelse og hud bliver fulgt","body":"Åbningen og huden kan ændre sig under helingen. Du bliver oplært i det, der passer til netop dit stoma. Kontakt personalet ved ny tiltagende åndenød, blødning, problemer med udstyret eller pludselige forandringer."},{"title":"Bevægelse og restitution","body":"Sygeplejersker og fysioterapeuter hjælper dig med at komme i gang med bevægelse i et passende tempo. Aktivitet og hvile tilpasses din operation og dit helbred."}],"checkpoints":["Jeg har set, hvordan mit stoma plejes på en sikker måde.","Jeg ved, hvilket HME eller andet udstyr jeg skal bruge.","Jeg ved, hvorfor jeg eventuelt får mad gennem sonde.","Jeg kender aftalerne om tale og synkning.","Jeg har fået information om eventuel sugning – kun hvis det er relevant for mig."],"questions":["Hvem beslutter, hvornår jeg må spise og drikke?","Hvilken HME og fastgørelse anbefaler I til mig?","Hvordan ser vi, om mit stoma bliver for snævert?","Hvilke tegn skal få mig til at tilkalde personalet med det samme?"],"sources":[{"name":"Cancer Research UK · Tiden efter operationen","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/treatment/surgery/after-surgery"},{"name":"Cancer Research UK · Pleje af stoma","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/stoma/looking-after-your-stoma"},{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"Atos Medical · HME og vejrtrækning","url":"https://www.atosmedical.com/laryngectomy/breathing/heat-and-moisture-exchanger"}]},{"id":"hjemkomst","glyph":"03","short":"Før hjemkomst","title":"Bliv klar til at komme hjem","period":"Gennemgå listen med personalet","summary":"Du behøver ikke være ekspert. Du og dine nærmeste skal vide, hvordan hverdagen håndteres, hvilket udstyr I har, og præcis hvor I får hjælp.","sections":[{"title":"Få vist rutinerne med dit eget udstyr","body":"Bed om at få vist stomapleje, hudpleje, HME, eventuelt rør og taleprotese præcis som din afdeling anbefaler. Prøv selv med supervision, indtil du føler dig klar."},{"title":"Få en skriftlig nødplan","body":"Alle omkring dig skal vide, at du kun trækker vejret gennem halsstomaet. Aftal, hvilke problemer der kræver 112, og hvilke der kræver akut kontakt til afdelingen."},{"title":"Hav udstyr og telefonnumre på plads","body":"Kontrollér, at du har de aftalte filtre, plastre, plejeartikler, eventuelle hjælpemidler og kontaktoplysninger. Få at vide, hvor du bestiller mere, og hvem du kontakter uden for åbningstid."},{"title":"Lav en plan for mad, medicin og opfølgning","body":"Du skal kende din aktuelle ernæringsplan og eventuelle restriktioner. Få dato eller kontaktvej til næste kontrol og aftaler om rehabilitering, tale og synkning."},{"title":"Inddrag en pårørende, hvis du ønsker det","body":"Det kan være en hjælp, at én tæt på dig også kender stomaplejen og nødplanen. Vedkommende skal ikke overtage dit liv, men kunne støtte, når du ønsker det."}],"checkpoints":["Jeg kan forklare, at jeg er totalt laryngektomeret og kun trækker vejret gennem halsen.","Jeg og eventuelt en pårørende har fået demonstreret sikker stomapleje.","Jeg har en personlig nødplan og relevante telefonnumre.","Jeg har det udstyr, der er ordineret til hjemmet.","Jeg har en klar plan for mad/drikke og medicin.","Jeg ved, hvornår og hvor min næste kontrol er."],"questions":["Hvem ringer jeg til i aften eller weekenden?","Hvor bestiller jeg flere filtre, plastre og andet udstyr?","Hvornår må jeg skifte eller håndtere de enkelte dele selv?","Hvad gør jeg, hvis jeg ikke kan få luft, eller hvis protesen falder ud?"],"sources":[{"name":"Cancer Research UK · Efter operationen med stoma","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/stoma/after-your-surgery"},{"name":"Cancer Research UK · Pleje af stoma","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/stoma/looking-after-your-stoma"},{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"National Tracheostomy Safety Project · Nødhjælp ved laryngektomi","url":"https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy"}]},{"id":"forste-uger","glyph":"04","short":"De første uger hjemme","title":"Find en rytme derhjemme","period":"Efter udskrivelse","summary":"Hjemme føles tingene ofte anderledes end på hospitalet. Start med rutiner, der er aftalt med dit team, og bed hellere om hjælp én gang for meget.","sections":[{"title":"Lav en rolig morgen- og aftenrutine","body":"Følg din oplæring i at holde huden og stomaet rent og bruge den ordinerede HME-løsning. Ved tegn på irritation eller problemer med at få
