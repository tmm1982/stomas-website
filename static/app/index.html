udstyret til at sidde, så spørg din klinik."},{"title":"Reagér på problemer med vejrtrækningen","body":"Ny eller tiltagende åndenød, besvær med at få luft gennem stomaet eller mærkbar forsnævring skal vurderes hurtigt. Ved akut alvorlig vejrtrækningsbesvær ring 112. En følelse af ikke at få luft må ikke bare forklares med tilvænning."},{"title":"Mad og synkning kan kræve tålmodighed","body":"Følg din individuelle ernærings- og synkeplan. Fortæl teamet om smerter, mad der sætter sig fast, hoste ved drikke eller uventet vægttab."},{"title":"Søvn, energi og følelser","body":"Træthed og uro kan fylde, mens kroppen kommer sig, og en ny hverdag falder på plads. Tal med en sundhedsperson, hvis du er meget påvirket, eller hvis generne fortsætter."},{"title":"Vand skal holdes væk fra stomaet","body":"Bad skal planlægges med den beskyttelse, din klinik har anbefalet. Almindelige HME-filtre er ikke vandtætte, og vand direkte i stomaet kan være farligt."}],"checkpoints":["Jeg ved, hvilken rutine jeg skal følge morgen og aften.","Jeg ved, hvornår jeg skal kontakte klinikken, og hvornår jeg skal ringe 112.","Jeg har en plan for ernæring og synkning.","Jeg har nok udstyr og ved, hvor jeg bestiller mere.","Jeg ved, hvordan jeg beskytter stomaet ved bad."],"questions":["Er det forventeligt med netop den mængde slim, jeg har?","Hvad gør jeg, hvis stomaplastret giver hudproblemer?","Hvilke ændringer i mit stoma skal undersøges?","Hvem hjælper mig med tale, mad og ernæring?"],"sources":[{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"Cancer Research UK · Pleje af stoma","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/stoma/looking-after-your-stoma"},{"name":"Cancer Research UK · Mad og synkning","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/diet"},{"name":"Cancer Research UK · Livet med stoma","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/stoma/life"},{"name":"National Tracheostomy Safety Project · Nødhjælp ved laryngektomi","url":"https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy"}]},{"id":"videre","glyph":"05","short":"Når hverdagen begynder","title":"Byg livet op på din måde","period":"Uger og måneder frem","summary":"Det nye bliver ofte mere velkendt med erfaring. Der er ikke en bestemt dag, hvor du skal være “tilbage”. Fokus er at finde løsninger, der passer til dit liv.","sections":[{"title":"Din nye stemme","body":"Nogle taler gennem en taleprotese, andre med elektronisk strubevibrator eller spiserørsstemme. Træningen planlægges sammen med en talefaglig behandler. Der er forskellige måder at kommunikere godt på."},{"title":"Motion og aktiviteter","body":"Bevægelse er muligt for mange, men genoptag træning efter aftale med dit behandlingsteam. Særligt vand, støv, kulde og fysisk belastning kræver omtanke. Tag åndenød alvorligt."},{"title":"Smag, lugt og livskvalitet","body":"Din lugtesans kan ændres, fordi luften ikke længere går gennem næsen. Nogle kan lære en teknik til at føre luft ind gennem næsen med hjælp fra en talepædagog."},{"title":"Familie, arbejde og sociale situationer","body":"Du bestemmer selv, hvor meget du vil forklare andre. Det kan hjælpe at have én enkel sætning klar: “Jeg trækker vejret gennem halsen, og min stemme virker på en ny måde.”"},{"title":"Fortsat kontrol og hjælp","body":"Behold kontakten til dine behandlere, også hvis du føler dig godt tilpas. Kontroller, talehjælp, ernæring og ændringer i udstyret kan være vigtige i lang tid efter operationen."}],"checkpoints":["Jeg kender mine muligheder for tale og kommunikation.","Jeg har talt med mit team om aktiviteter, jeg gerne vil tilbage til.","Mine nærmeste ved, hvad de skal gøre i en nødsituation.","Jeg ved, hvor jeg får hjælp ved problemer med udstyret.","Jeg har et overblik over kommende kontroller."],"questions":["Hvordan fortsætter min taletræning?","Hvornår må jeg gå i gang med den aktivitet, jeg savner?","Hvem kan hjælpe med lugtetræning og synkebesvær?","Hvordan kontakter jeg ambulatoriet mellem kontrollerne?"],"sources":[{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"},{"name":"Cancer Research UK · Livet med stoma","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/stoma/life"},{"name":"Cancer Research UK · Mad og synkning","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/diet"},{"name":"Macmillan Cancer Support · Efter laryngektomi","url":"https://www.macmillan.org.uk/cancer-information-and-support/impacts-of-cancer/after-a-laryngectomy"}]}],"checklist":[{"id":"ud-01","group":"akut","label":"Jeg har fået en personlig nødplan.","hint":"Den skal forklare, hvad jeg gør ved vejrtrækningsproblemer."},{"id":"ud-02","group":"akut","label":"Jeg har vist min nødplan til en pårørende.","hint":"Hvis jeg ønsker det, er der en anden, som også ved, hvordan min luftvej fungerer."},{"id":"ud-03","group":"akut","label":"Jeg kender telefonnumre og åbningstider.","hint":"Også aftener, nætter, weekender og helligdage."},{"id":"ud-04","group":"udstyr","label":"Jeg ved, hvordan stomaet plejes.","hint":"Præcis som min afdeling har lært mig."},{"id":"ud-05","group":"udstyr","label":"Jeg ved, hvilket rør/knap eller udstyr jeg har.","hint":"Og hvem der må fjerne, rengøre og sætte det i."},{"id":"ud-06","group":"udstyr","label":"Jeg kan bruge min aftalte HME-løsning.","hint":"Og ved, hvornår filteret skal skiftes."},{"id":"ud-07","group":"udstyr","label":"Jeg har nok udstyr med hjem.","hint":"Inklusive ekstra dele efter klinikkens liste."},{"id":"ud-08","group":"udstyr","label":"Jeg ved, hvor jeg får mere udstyr.","hint":"Leverandør, bestillingsvej og kontakt ved mangel."},{"id":"ud-09","group":"kommunikation","label":"Jeg kan få hjælp uden at skulle tale.","hint":"Telefon, tekst eller anden aftalt kommunikation."},{"id":"ud-10","group":"kommunikation","label":"Jeg kender planen for taletræning.","hint":"Inklusive hjælp til eventuel taleprotese."},{"id":"ud-11","group":"ernaring","label":"Jeg har en konkret plan for ernæring.","hint":"Hvad jeg må spise og drikke, og om jeg fortsat har sonde."},{"id":"ud-12","group":"ernaring","label":"Jeg kender tegn på problemer med synkning.","hint":"Og hvem jeg skal kontakte, hvis de opstår."},{"id":"ud-13","group":"hjemme","label":"Jeg ved, hvordan jeg tager bad sikkert.","hint":"Vand må ikke komme i stomaet."},{"id":"ud-14","group":"hjemme","label":"Jeg har en plan for medicin og smertebehandling.","hint":"Doser og hvem der hjælper, hvis noget ikke virker."},{"id":"ud-15","group":"hjemme","label":"Jeg kender datoen for min næste kontrol.","hint":"Og hvordan jeg får fat i afdelingen inden da."},{"id":"ud-16","group":"hjemme","label":"Jeg ved, hvem der kan hjælpe mig derhjemme.","hint":"Det kan være pårørende eller professionel støtte, alt efter behov."}],"red_flags":[{"level":"alarm","label":"Ring 112","details":"Akut alvorlig åndenød, kvælningsfornemmelse, pludseligt manglende luft gennem stomaet, bevidstløshed eller kraftig blødning. Sig: “Totalt laryngektomeret – trækker kun vejret gennem halsstomaet.”"},{"level":"soon","label":"Kontakt afdeling eller akut sundhedshjælp hurtigt","details":"Tiltagende vejrtrækningsbesvær, forsnævring af stomaet, taleprotese der er faldet ud, feber med mistanke om sårinfektion eller nye alvorlige problemer med udstyr eller synkning. Følg altid din personlige nødplan."}],"glossary":[{"word":"Total laryngektomi","meaning":"Operation hvor hele strubehovedet fjernes, og luftrøret føres ud til et permanent stoma."},{"word":"Stoma","meaning":"Den permanente åbning på halsen, som du trækker vejret og hoster igennem."},{"word":"HME","meaning":"Varme- og fugtveksler, der hjælper med at fugte og opvarme indåndingsluften."},{"word":"Taleprotese / Provox","meaning":"En lille ventil mellem luftrør og spiserør, som kan gøre tale mulig hos nogle."},{"word":"LaryTube","meaning":"Et særligt blødt rør, som i nogle tilfælde bruges i stomaet efter klinikkens anvisning."},{"word":"Sondeernæring","meaning":"Ernæring gennem et rør, ofte midlertidigt mens det opererede område heler."},{"word":"Talepædagog / logopæd","meaning":"Fagperson der blandt andet kan hjælpe med tale og kommunikation efter operationen."}],"sources":[{"name":"Kræftens Bekæmpelse · Operation for strubekræft","url":"https://www.cancer.dk/strubekraeft-larynxcancer/behandling/operation/"},{"name":"Kræftens Bekæmpelse · At tale efter operation","url":"https://www.cancer.dk/strubekraeft-larynxcancer/livet-med-strubekraeft/tale-efter-operation/"},{"name":"Cancer Research UK · Tiden efter operationen","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/treatment/surgery/after-surgery"},{"name":"Cancer Research UK · Efter operationen med stoma","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/stoma/after-your-surgery"},{"name":"Cancer Research UK · Pleje af stoma","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/stoma/looking-after-your-stoma"},{"name":"Atos Medical · Hjem efter laryngektomi","url":"https://www.atosmedical.com/laryngectomy/how-to-prepare-for-a-laryngectomy/coming-home-after-laryngectomy"},{"name":"Atos Medical · HME og vejrtrækning","url":"https://www.atosmedical.com/laryngectomy/breathing/heat-and-moisture-exchanger"},{"name":"Cancer Research UK · Mad og synkning","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/diet"},{"name":"Cancer Research UK · Livet med stoma","url":"https://www.cancerresearchuk.org/about-cancer/laryngeal-cancer/living-with/stoma/life"},{"name":"National Tracheostomy Safety Project · Nødhjælp ved laryngektomi","url":"https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy"},{"name":"Macmillan Cancer Support · Efter laryngektomi","url":"https://www.macmillan.org.uk/cancer-information-and-support/impacts-of-cancer/after-a-laryngectomy"}],"review_status":"Udkast · afventer sundhedsfaglig kvalitetssikring","updated_at":"2026-10-20"},"relatives":{"heading":"Til dig, der står ved siden af","intro":"Som pårørende er du også en del af forandringen. Find din indgang, læs konkrete råd, og brug værktøjerne til at tale sammen og skabe tryghed uden at overtage.","audiences":[{"id":"partner","icon":"♡","name":"Partner og ægtefælle","teaser":"Nærhed, ansvar, bekymringer og det nye fælles hverdagsliv","lead":"Det er også en stor forandring at stå ved siden af. Du kan støtte uden at skulle være sygeplejerske, og du må godt have dine egne behov."},{"id":"boern","icon":"✿","name":"Børn og unge","teaser":"Trygge forklaringer, svære spørgsmål og plads til alle følelser","lead":"Børn skal have sandhed i små, forståelige bidder, plads til spørgsmål og voksne, der tager ansvar. De skal ikke være dem, der passer på de voksne."},{"id":"familie","icon":"⌂","name":"Familie","teaser":"Sammenhold, praktisk hjælp og respekt for grænser","lead":"Som forælder, søskende eller andet familiemedlem kan du gøre meget ved at spørge, lytte og tilbyde konkret hjælp, uden at tage styringen."},{"id":"venner","icon":"✦","name":"Venner og kolleger","teaser":"Sådan holder du kontakten og gør det nemt at være med","lead":"Venskab og fællesskab gør en forskel. Du behøver ikke finde perfekte ord; det vigtigste er at blive ved med at være til stede."}],"guides":[{"id":"partner-kommunikation","group":"partner","title":"Når stemmen lyder anderledes","summary":"Giv plads til at blive hørt – også når det tager tid.","sections":[{"heading":"Tal med hinanden – ikke hen over hinanden","text":"Efter total laryngektomi kan stemme, tempo og lydstyrke være ændret. Sluk tv eller radio under vigtige samtaler, vær tålmodig, og lad personen tale færdig. Gentag hellere det, du tror, du hørte, end at gætte og fortsætte."},{"heading":"Aftal et alternativ til tale","text":"Mobilnoter, en tavle eller korte beskeder kan være gode på trætte dage. Spørg, om du skal hjælpe med at formidle noget – og til hvem. Det er stadig personens egne ord og beslutninger."}],"try":"Prøv dette: Aftal ét roligt sted i hjemmet til samtaler uden baggrundsstøj.","talk":"Spørg fx: Vil du helst have, at jeg beder dig gentage, eller at vi skriver sammen?","sources":[{"name":"Atos Medical Danmark · Laryngektomi","url":"https://www.atosmedical.dk/laryngektomi"},{"name":"Atos Medical · CareTips til pårørende (PDF)","url":"https://www.atosmedical.us/download/sites/22/2025/08/MC-0991-CT-CAREGIVER-Helping-a-Loved-One-post-lary-052225.pdf"}]},{"id":"partner-ansvar","group":"partner","title":"Når du både er partner og hjælper","summary":"Bevar balancen mellem omsorg og selvstændighed.","sections":[{"heading":"Støtte er ikke det samme som at overtage","text":"Der kan være behov for hjælp med indkøb, praktiske opgaver og kontakt til afdelingen. Aftal løbende, hvad den opererede ønsker at klare selv, og hvor hjælp er velkommen."},{"heading":"Skab plads til at være kærester","text":"Hvis hele samtalen handler om filtre, aftaler og medicin, kan forholdet komme til at føles som en plejeopgave. Lav også noget almindeligt sammen: spis, gå tur eller se en serie uden at evaluere helbredet."}],"try":"Prøv dette: Del opgaverne op i ”jeg gør”, ”du gør” og ”vi gør sammen”.","talk":"Spørg fx: Hvad vil du gerne gøre selv, selvom det tager længere tid?","sources":[{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"},{"name":"Atos Medical · Læring for patienter og pårørende","url":"https://www.atosmedical.com/online-learning-for-laryngectomy-patients-and-caregivers"}]},{"id":"partner-foelelser","group":"partner","title":"Dine egne følelser tæller også","summary":"Det er muligt at føle lettelse, vrede, sorg og kærlighed samtidig.","sections":[{"heading":"Reaktioner kan være blandede","text":"Det kan være hårdt at se et menneske, man elsker, gennemgå en stor operation. Du må være bange eller frustreret uden at skulle skjule alt. Søg gerne en fortrolig voksen uden for hjemmet til de tanker, der er svære at dele."},{"heading":"Bed om støtte, før du er helt presset","text":"Pårørenderådgivning, egen læge eller andre pårørende kan være støtte. Hvis søvn, appetit eller humør bliver ved med at være påvirket, er det fornuftigt at søge hjælp."}],"try":"Prøv dette: Vælg én person, du selv kan ringe til uden at skulle tage hensyn.","talk":"Spørg fx: Hvordan kan vi give hinanden pauser uden dårlig samvittighed?","sources":[{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"},{"name":"Atos Medical · Læring for patienter og pårørende","url":"https://www.atosmedical.com/online-learning-for-laryngectomy-patients-and-caregivers"}]},{"id":"partner-naerhed","group":"partner","title":"Nærhed, berøring og intimitet","summary":"Et nyt udseende og en ny stemme ændrer ikke behovet for nærhed.","sections":[{"heading":"Tag ændringerne i jeres eget tempo","text":"Ar, stoma og udstyr kan gøre begge usikre. Spørg, hvad der føles rart og trygt. Nærhed behøver ikke begynde med sex; den kan også være en hånd i hånden eller et kram."},{"heading":"Tal om bekymringer uden pres","text":"Hvis smerter, træthed eller usikkerhed står i vejen, kan I drøfte det med behandlingsteamet. En samtale med en fagperson kan hjælpe med både kropsbillede og samliv."}],"try":"Prøv dette: Aftal et hyggeligt øjeblik, hvor helbred ikke er dagens hovedtema.","talk":"Spørg fx: Er der noget ved berøring eller nærhed, som føles anderledes for dig?","sources":[{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"}]},{"id":"partner-sikkerhed","group":"partner","title":"Tryghed uden konstant alarmberedskab","summary":"Kend forskellen på en personlig nødplan og almindelig omsorg.","sections":[{"heading":"Lær det vigtige sammen","text":"Ved total laryngektomi er stomaet på halsen eneste vej for luft til lungerne. Spørg afdelingen, hvilke tegn der kræver akut hjælp, og gennemgå den personlige nødplan og det konkrete udstyr."},{"heading":"Du behøver ikke være på vagt hele døgnet","text":"En skriftlig plan, let tilgængelige numre og aftaler om hvem der hjælper, er mere holdbart end at én partner skal holde øje med alt. Ved akut alvorlig vejrtrækningsbesvær: ring 112 og sig, at personen kun trækker vejret gennem halsstomaet."}],"try":"Prøv dette: Læg nødplan og kontaktoplysninger et sted, I begge kan finde.","talk":"Spørg fx: Kan vi gennemgå din nødplan sammen med sygeplejersken?","sources":[{"name":"National Tracheostomy Safety Project · Akut luftvej","url":"https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy"},{"name":"Atos Medical · CareTips til pårørende (PDF)","url":"https://www.atosmedical.us/download/sites/22/2025/08/MC-0991-CT-CAREGIVER-Helping-a-Loved-One-post-lary-052225.pdf"}]},{"id":"boern-forklaring","group":"boern","title":"Hvordan forklarer vi operationen?","summary":"Enkelt, sandt og i barnets tempo.","sections":[{"heading":"Begynd med det, barnet kan se","text":"Du kan sige: ”Far har fået fjernet den del af halsen, der lavede hans gamle stemme. Nu trækker han vejret gennem et lille hul på halsen og bruger en anden måde at tale på.” Brug de ord og det navn på stomaet, der passer i familien."},{"heading":"Svar på det, barnet spørger om","text":"Små børn behøver sjældent operationsdetaljer. Større børn kan spørge mere direkte. Ved spørgsmål om kræft og fremtiden skal I være ærlige om det, I ved – og tydelige om det, I endnu ikke ved."}],"try":"Prøv dette: Prøv forklaringen højt med en anden voksen, før I taler med barnet.","talk":"Spørg fx: Hvad har du lagt mærke til, der er anderledes hos mor eller far?","sources":[{"name":"Kræftens Bekæmpelse · Fortæl børnene om sygdommen","url":"https://www.cancer.dk/boern-unge/paaroerende/fortael-om-sygdommen/"},{"name":"Kræftens Bekæmpelse · Hvad skal børn vide?","url":"https://www.cancer.dk/boern-unge/paaroerende/behov-under-sygdommen/Information-om-sygdom-og-behandling/"}]},{"id":"boern-reaktioner","group":"boern","title":"Når barnet bliver vredt, stille eller bange","summary":"Reaktioner kan komme i glimt – også længe efter.","sections":[{"heading":"Det er ikke altid samtalen, der fylder","text":"Nogle børn spørger meget; andre vil lege, skifte emne eller blive mere klyngende. En kort samtale under en køretur eller leg kan være lettere end et ”nu skal vi snakke”-øjeblik."},{"heading":"Giv følelserne lov til at være der","text":"Sig fx ”Jeg kan godt forstå, det føles mærkeligt” i stedet for at love, at alt bliver som før. Fortæl tydeligt, at operationen og sygdommen aldrig er barnets skyld."}],"try":"Prøv dette: Stil ét enkelt spørgsmål ad gangen og accepter et ”ved ikke”.","talk":"Spørg fx: Hvad er det mærkeligste eller sværeste ved alt det nye?","sources":[{"name":"Kræftens Bekæmpelse · Tal med barnet om reaktioner","url":"https://www.cancer.dk/boern-unge/paaroerende/reaktioner-og-foelelser/tal-om-reaktioner/"},{"name":"Kræftens Bekæmpelse · Børn og unge som pårørende","url":"https://www.cancer.dk/boern-unge/paaroerende/"}]},{"id":"boern-skole","group":"boern","title":"Skole, fritid og venner","summary":"Lad de voksne bære informationen – ikke barnet alene.","sections":[{"heading":"Aftal hvem der skal vide hvad","text":"Tal med barnet om, hvad lærer, pædagog, træner eller venner må få at vide. Nogle børn vil have en kort forklaring til klassen, andre vil helst have ro. Respekter barnets ønske, når det kan lade sig gøre."},{"heading":"Lav en nem sætning til spørgsmål","text":"Barnet kan selv vælge: ”Min mor trækker vejret gennem halsen og taler anderledes. Hun er stadig min mor.” Barnet skylder ikke hele skolen en forklaring eller helbredsopdatering."}],"try":"Prøv dette: Aftal én tryg voksen i skolen, barnet kan gå til.","talk":"Spørg fx: Skal vi fortælle det til din lærer sammen, eller vil du helst have, at jeg gør det?","sources":[{"name":"Kræftens Bekæmpelse · Forbered børn på andres reaktioner","url":"https://www.cancer.dk/boern-unge/paaroerende/behov-under-sygdommen/andres-reaktioner/"},{"name":"Kræftens Bekæmpelse · Børn og unge som pårørende","url":"https://www.cancer.dk/boern-unge/paaroerende/"}]},{"id":"boern-sikkerhed","group":"boern","title":"Skal børn kunne hjælpe i en nødsituation?","summary":"En enkel plan giver tryghed – børn skal ikke være behandlere.","sections":[{"heading":"Fortæl kun det nødvendige","text":"Et barn kan lære at hente en voksen og ringe 112, hvis en voksen ikke kan få luft. Forklar, at de voksne og sundhedspersonalet har ansvaret. Barnet skal ikke lære at håndtere stoma eller udstyr, medmindre det er en særligt aftalt og alderssvarende opgave under voksenansvar."},{"heading":"Gør planen konkret og rolig","text":"Skriv adresse og nødnummer et synligt sted. Øv gerne hvem barnet kan hente, uden at skabe utryghed eller gøre barnet ansvarligt for at overvåge vejrtrækningen."}],"try":"Prøv dette: Lad barnet kende én nabo eller voksen, som kan tilkaldes.","talk":"Spørg fx: Ved du, hvem du kan hente, hvis mor eller far pludselig har brug for hjælp?","sources":[{"name":"National Tracheostomy Safety Project · Akut luftvej","url":"https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy"},{"name":"Kræftens Bekæmpelse · Børn og unge som pårørende","url":"https://www.cancer.dk/boern-unge/paaroerende/"}]},{"id":"boern-rutiner","group":"boern","title":"Tryghed i den nye hverdag","summary":"Forudsigelighed betyder ofte mere end lange forklaringer.","sections":[{"heading":"Behold noget velkendt","text":"En sengehistorie, et spil eller en fast hilsen kan være et anker. Den nyopererede kan måske ikke gøre alt som før, men kan stadig være til stede på nye måder."},{"heading":"Giv barnet fri fra sygdommen","text":"Sørg for, at barnet også kan være optaget af venner, sport og sjove ting. Bedsteforældre og andre kan hjælpe med at bevare normale aktiviteter. Børn skal ikke føle ansvar for den voksnes humør."}],"try":"Prøv dette: Vælg én gammel tradition, som skal fortsætte i en ny udgave.","talk":"Spørg fx: Hvad savner du, at vi gør sammen – og hvordan kan vi gøre det nu?","sources":[{"name":"Kræftens Bekæmpelse · Børn og unge som pårørende","url":"https://www.cancer.dk/boern-unge/paaroerende/"},{"name":"Kræftens Bekæmpelse · Fortæl børnene om sygdommen","url":"https://www.cancer.dk/boern-unge/paaroerende/fortael-om-sygdommen/"}]},{"id":"familie-spoerg","group":"familie","title":"Spørg før du hjælper","summary":"Det er forskelligt, hvad man ønsker hjælp til.","sections":[{"heading":"Undgå at gøre personen til et projekt","text":"Selv velment hjælp kan opleves som kontrol. Aftal konkrete opgaver, og giv plads til et nej. Et tilbud om at handle torsdag er lettere at tage stilling til end ”sig til, hvis du mangler noget”."},{"heading":"Hold fast i de almindelige roller","text":"Tal også om arbejde, børn, sport og interesser. Personen er mere end sin operation. Det kan være rart, at samtaler ikke hele tiden handler om sygdom."}],"try":"Prøv dette: Tilbyd én bestemt hjælp på et bestemt tidspunkt.","talk":"Spørg fx: Skal jeg tage aftensmaden med på onsdag, eller vil du hellere have ro?","sources":[{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"}]},{"id":"familie-kommunikation","group":"familie","title":"Sådan taler du med en strubeløs","summary":"Tålmodighed og små justeringer hjælper.","sections":[{"heading":"Skab ro omkring samtalen","text":"Se på personen, giv taletid, og sænk baggrundsstøj. Hvis du ikke forstår noget, så sig det venligt. Undlad at svare på personens vegne, medmindre I har aftalt det."},{"heading":"Tekst er også en stemme","text":"På dage med træthed kan en besked eller en kommunikationsapp gøre samvær lettere. Undgå at presse personen til at demonstrere taleventilen eller fortælle sin sygehistorie til gæster."}],"try":"Prøv dette: Læg telefonen væk og afsæt lidt ekstra tid til samtalen.","talk":"Spørg fx: Er det lettest at tale nu, eller skal vi skrive sammen?","sources":[{"name":"Atos Medical Danmark · Laryngektomi","url":"https://www.atosmedical.dk/laryngektomi"},{"name":"Atos Medical · CareTips til pårørende (PDF)","url":"https://www.atosmedical.us/download/sites/22/2025/08/MC-0991-CT-CAREGIVER-Helping-a-Loved-One-post-lary-052225.pdf"}]},{"id":"familie-besoeg","group":"familie","title":"Besøg uden at dræne","summary":"Små besøg kan være rare – hvis de er aftalt.","sections":[{"heading":"Aftal tid og længde","text":"Efter en stor operation kan energi og koncentration svinge. Ring eller skriv først, også hvis I plejer at komme uanmeldt. Spørg hvor længe besøget skal vare, og accepter aflysning."},{"heading":"Tænk på omgivelserne","text":"Røg, stærke dufte, støv og høje samtaler kan være belastende. Find en ramme, der fungerer for den opererede, og hjælp til med mad eller oprydning i stedet for at forvente værtskab."}],"try":"Prøv dette: Spørg om et besøg på 20–30 minutter passer bedre end en hel eftermiddag.","talk":"Spørg fx: Har du lyst til besøg, eller er en besked bedre i dag?","sources":[{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"},{"name":"Atos Medical Danmark · Laryngektomi","url":"https://www.atosmedical.dk/laryngektomi"}]},{"id":"familie-udstyr","group":"familie","title":"Forstå HME og taleprotese uden at overtage","summary":"Du behøver ikke kunne alt teknisk for at være en god pårørende.","sections":[{"heading":"De vigtigste begreber","text":"HME er et filter, der hjælper med varme og fugt. En taleprotese er en lille ventil, som nogle bruger til at tale. Et stoma på halsen er luftvejen efter total laryngektomi. Ingen af delene skal håndteres efter ”gode råd” fra familie; følg afdelingens oplæring."},{"heading":"Det vigtigste sikkerhedspunkt","text":"Ved akut alvorlige vejrtrækningsproblemer ringes 112. Fortæl, at personen er totalt laryngektomeret og kun trækker vejret gennem halsstomaet, ikke gennem næse eller mund."}],"try":"Prøv dette: Bed om at få den personlige nødplan forklaret af en fagperson.","talk":"Spørg fx: Vil du vise mig, hvad udstyret hedder, så jeg forstår dine forklaringer?","sources":[{"name":"Atos Medical Danmark · Laryngektomi","url":"https://www.atosmedical.dk/laryngektomi"},{"name":"National Tracheostomy Safety Project · Akut luftvej","url":"https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy"}]},{"id":"familie-langt-sigt","group":"familie","title":"Hjælp også når hverdagen er begyndt","summary":"Behovet for støtte forsvinder ikke nødvendigvis ved udskrivelsen.","sections":[{"heading":"Spørg igen om nogle uger","text":"Den første tid er der ofte mange, der tilbyder hjælp. Senere bliver der stille, selvom der stadig kan være behov for hjælp til transport, aktiviteter eller en svær dag."},{"heading":"Respektér både fremskridt og begrænsninger","text":"Nogle kommer hurtigt i gang med arbejde og fritid; andre bruger lang tid på at finde rutiner. Spørg til personens egne mål i stedet for at sammenligne med tidligere eller andres forløb."}],"try":"Prøv dette: Lav en aftale om at spørge til behov igen efter en måned.","talk":"Spørg fx: Hvad er sværest lige nu – og hvad ville lette denne uge?","sources":[{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"},{"name":"Atos Medical · Læring for patienter og pårørende","url":"https://www.atosmedical.com/online-learning-for-laryngectomy-patients-and-caregivers"}]},{"id":"venner-kontakt","group":"venner","title":"Bliv ved med at invitere","summary":"Venskab behøver ikke vente på fuld energi.","sections":[{"heading":"Et nej betyder ikke farvel","text":"Personen kan sige nej til en middag og ja til en kop kaffe ugen efter. Fortsæt med at invitere på en måde, der gør det trygt at takke nej, uden at der kommer dårlig stemning."},{"heading":"Gør det nemt at være med","text":"En gåtur, et roligt lokale eller et kort besøg kan fungere bedre end en støjende fest. Spørg hvad der passer, i stedet for at beslutte på personens vegne."}],"try":"Prøv dette: Send én invitation med en nem udvej: ”Du må gerne aflyse på dagen.”","talk":"Spørg fx: Kunne du have lyst til en kort gåtur, eller vil du hellere vente?","sources":[{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"}]},{"id":"venner-hvad-sige","group":"venner","title":"Hvad siger man første gang?","summary":"Du behøver ikke have det perfekte svar.","sections":[{"heading":"Tal almindeligt og venligt","text":"Sig fx ”Det er godt at se dig. Hvordan vil du helst have, at jeg spørger til det hele?” Vis interesse uden at kræve detaljer om kræft, ar, stoma eller behandling."},{"heading":"Når noget er svært at forstå","text":"Den nye stemme kan kræve tilvænning for begge. Bed venligt om gentagelse eller brug tekst. Undgå vittigheder om stemmen, medmindre personen selv lægger op til det og tydeligt er med på den."}],"try":"Prøv dette: Begynd med noget velkendt, I begge interesserer jer for.","talk":"Spørg fx: Vil du fortælle om det, der er sket, eller skal vi snakke om noget helt andet?","sources":[{"name":"Atos Medical Danmark · Laryngektomi","url":"https://www.atosmedical.dk/laryngektomi"},{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"}]},{"id":"venner-socialt","group":"venner","title":"Restaurant, sport og fester","summary":"Små ændringer kan gøre store oplevelser mulige.","sections":[{"heading":"Planlæg uden at gøre det kompliceret","text":"Støj kan gøre det sværere at høre en ny stemme. Et bord væk fra høj musik, pauser og god tid kan være en hjælp. Ved mad kan der være individuelle synkehensyn, som personen selv bestemmer, om I skal tage højde for."},{"heading":"Respektér grænser omkring vand og motion","text":"Ved total laryngektomi er vand i halsstomaet farligt. Svømning og vandaktiviteter kræver særlig specialistvurdering og udstyr; pres aldrig nogen til det. Træning genoptages efter aftale med behandlere."}],"try":"Prøv dette: Vælg en aktivitet, hvor I kan snakke uden at råbe.","talk":"Spørg fx: Skal vi finde et roligt sted, hvor du kan være med på dine præmisser?","sources":[{"name":"Atos Medical Danmark · Laryngektomi","url":"https://www.atosmedical.dk/laryngektomi"},{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"}]},{"id":"venner-privatliv","group":"venner","title":"Respekt for privatliv og grænser","summary":"Den opererede bestemmer sin egen historie.","sections":[{"heading":"Del ikke detaljer uden lov","text":"Billeder af stomaet, oplysninger om diagnosen eller videoer med den nye stemme må ikke deles i grupper eller på sociale medier uden et tydeligt ja. Spørg også før du giver oplysninger til andre venner."},{"heading":"Støt uden at gøre personen til en inspiration på kommando","text":"Det kan være rart med anerkendelse, men personen skal også have lov til at være sur, træt eller helt almindelig. Hjælp med at skabe et rum, hvor der ikke skal præsteres eller fortælles en ”modig historie”."}],"try":"Prøv dette: Spørg konkret før du tager billeder eller fortæller andre om forløbet.","talk":"Spørg fx: Hvad er du tryg ved, at jeg fortæller til de andre?","sources":[{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"}]},{"id":"venner-hold-fast","group":"venner","title":"Når den første opmærksomhed lægger sig","summary":"Langvarig støtte kan være mere værd end store ord.","sections":[{"heading":"Hold kontakt uden svarpligt","text":"Send en kort besked, også selvom du ikke altid får svar. Skriv fx ”Du behøver ikke svare. Jeg tænker på dig og er her.”"},{"heading":"Tilbyd noget, der passer til hverdagen","text":"Kørsel til en aftale, en tur med hunden, hjælp med børn eller bare et fælles grin kan være konkret omsorg. Spørg før du aftaler noget på den andens vegne."}],"try":"Prøv dette: Sæt en venlig påmindelse til dig selv om at sende en besked igen om 14 dage.","talk":"Spørg fx: Skal jeg bare blive ved med at invitere, selvom du nogle gange må sige nej?","sources":[{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"}]}],"checklist":[{"id":"pa-01","group":"Kontakt og kommunikation","title":"Jeg ved, hvordan personen helst vil kommunikere.","detail":"Jeg spørger, før jeg hjælper med at svare eller tale på vegne af personen."},{"id":"pa-02","group":"Kontakt og kommunikation","title":"Vi har en rolig måde at tale sammen på.","detail":"Vi kender et alternativ som tekst eller en tavle, hvis tale er svær."},{"id":"pa-03","group":"Kontakt og kommunikation","title":"Jeg ved, hvem jeg må dele oplysninger med.","detail":"Vi har aftalt grænser for diagnoser, billeder og sociale medier."},{"id":"pa-04","group":"Tryghed derhjemme","title":"Jeg ved, at luftvejen er på halsen.","detail":"Efter total laryngektomi går vejrtrækningen ikke gennem næse eller mund."},{"id":"pa-05","group":"Tryghed derhjemme","title":"Jeg har set personens individuelle nødplan.","detail":"Ved akut alvorlig åndenød ringer vi 112 og fortæller om halsstomaet."},{"id":"pa-06","group":"Tryghed derhjemme","title":"Vi har samlet kontaktoplysninger.","detail":"Afdeling, opfølgning og hjælp ved problemer med ordineret udstyr."},{"id":"pa-07","group":"Tryghed derhjemme","title":"Jeg kender min rolle – og mine grænser.","detail":"Jeg håndterer kun stoma og udstyr, hvis jeg er oplært og har aftalt det."},{"id":"pa-08","group":"Børn og familie","title":"Vi har valgt en enkel forklaring til børnene.","detail":"Vi fortæller det, der er sandt, uden for mange detaljer."},{"id":"pa-09","group":"Børn og familie","title":"Børnene ved, hvem de kan komme til.","detail":"En tryg voksen kan lytte, også uden for hjemmet."},{"id":"pa-10","group":"Børn og familie","title":"Vi har tænkt på skole og fritid.","detail":"Vi aftaler, hvad andre voksne må få at vide."},{"id":"pa-11","group":"Børn og familie","title":"Vi har forsøgt at bevare en velkendt rutine.","detail":"Et lille ritual kan være mere værd end mange forklaringer."},{"id":"pa-12","group":"Støtte til dig selv","title":"Jeg har nogen, jeg selv kan tale med.","detail":"Jeg behøver ikke klare alt alene."},{"id":"pa-13","group":"Støtte til dig selv","title":"Vi har fordelt de praktiske opgaver.","detail":"Støtte er en fælles plan – ikke én persons permanente ansvar."},{"id":"pa-14","group":"Støtte til dig selv","title":"Jeg ved, hvor jeg kan søge rådgivning.","detail":"Fx Kræftens Bekæmpelse, sundhedspersonale eller egen læge."}],"check_groups":["Kontakt og kommunikation","Tryghed derhjemme","Børn og familie","Støtte til dig selv"],"conversation_cards":[{"id":"script-child-small","group":"boern","name":"Til et yngre barn","title":"Hvorfor lyder stemmen anderledes?","text":"Efter operationen virker min gamle stemme ikke mere. Nu trækker jeg vejret gennem åbningen på halsen og bruger en ny måde at tale på. Jeg er stadig den samme mor eller far, og du må altid spørge mig om det, du undrer dig over."},{"id":"script-child-teen","group":"boern","name":"Til en teenager","title":"Når der er mange spørgsmål","text":"Operationen har ændret min vejrtrækning og min stemme. Du må spørge om alt, også det svære. Hvis jeg ikke ved svaret, siger jeg det. Du skal ikke passe på mig eller holde styr på sygdommen – det er de voksnes ansvar."},{"id":"script-child-school","group":"boern","name":"Til skolen","title":"En kort besked til læreren","text":"Vi vil gerne fortælle, at der er sket en stor operation i familien. Forælderen trækker nu vejret gennem et stoma på halsen og taler anderledes. Vi vil gerne aftale, hvad barnet ønsker, at andre ved, og hvem barnet kan gå til, hvis det bliver svært."},{"id":"script-partner-practical","group":"partner","name":"Til din partner","title":"Når hjælpen skal aftales","text":"Jeg vil gerne hjælpe dig, men jeg vil også gerne lade dig bestemme. Kan vi sammen finde ud af, hvad du helst vil gøre selv, og hvad jeg kan tage mig af i denne uge?"},{"id":"script-partner-emotional","group":"partner","name":"Til din partner","title":"Når I begge er trætte","text":"Jeg ved, at vi begge har været igennem meget. Jeg vil gerne høre, hvordan du har det, og jeg har også brug for, at vi kan tale om, hvordan det påvirker mig. Kan vi finde et roligt tidspunkt uden at skulle løse alt i dag?"},{"id":"script-family-help","group":"familie","name":"Til familien","title":"Et konkret tilbud om hjælp","text":"Jeg kan købe ind og stille varerne ved døren på torsdag. Hvis det ikke passer, er det helt i orden. Du behøver ikke have gæster eller svare med det samme."},{"id":"script-friend-first","group":"venner","name":"Til en ven","title":"Når I ses første gang","text":"Hvor er det godt at se dig. Du bestemmer selv, om vi skal tale om operationen, eller om vi bare skal snakke om alt det sædvanlige. Sig til, hvis jeg ikke forstår din stemme – så finder vi ud af det."},{"id":"script-friend-invite","group":"venner","name":"Til en ven","title":"Invitation uden pres","text":"Vi vil rigtig gerne have dig med. Vi kan finde et roligt sted og gøre det kort, hvis det passer bedre. Du er velkommen til at sige nej eller aflyse samme dag. Vi spørger igen en anden gang."}],"disclaimer":"Rådene er generel støtte og kan ikke erstatte den enkeltes behandlings- eller nødplan. Ved akut alvorlig vejrtrækningsbesvær ring 112. Sig at personen er totalt laryngektomeret og kun trækker vejret gennem halsstomaet.","sources":[{"name":"Kræftens Bekæmpelse · Til pårørende","url":"https://www.cancer.dk/hverdag/til-paaroerende/"},{"name":"Kræftens Bekæmpelse · Børn og unge som pårørende","url":"https://www.cancer.dk/boern-unge/paaroerende/"},{"name":"Kræftens Bekæmpelse · Fortæl børnene om sygdommen","url":"https://www.cancer.dk/boern-unge/paaroerende/fortael-om-sygdommen/"},{"name":"Kræftens Bekæmpelse · Hvad skal børn vide?","url":"https://www.cancer.dk/boern-unge/paaroerende/behov-under-sygdommen/Information-om-sygdom-og-behandling/"},{"name":"Kræftens Bekæmpelse · Tal med barnet om reaktioner","url":"https://www.cancer.dk/boern-unge/paaroerende/reaktioner-og-foelelser/tal-om-reaktioner/"},{"name":"Kræftens Bekæmpelse · Forbered børn på andres reaktioner","url":"https://www.cancer.dk/boern-unge/paaroerende/behov-under-sygdommen/andres-reaktioner/"},{"name":"Atos Medical Danmark · Laryngektomi","url":"https://www.atosmedical.dk/laryngektomi"},{"name":"Atos Medical · Læring for patienter og pårørende","url":"https://www.atosmedical.com/online-learning-for-laryngectomy-patients-and-caregivers"},{"name":"National Tracheostomy Safety Project · Akut luftvej","url":"https://tracheostomy.org.uk/healthcare-staff/emergency-care/emergency-tracheostomy-laryngectomy"},{"name":"Atos Medical · CareTips til pårørende (PDF)","url":"https://www.atosmedical.us/download/sites/22/2025/08/MC-0991-CT-CAREGIVER-Helping-a-Loved-One-post-lary-052225.pdf"}],"review_status":"Udkast · afventer sundhedsfaglig kvalitetssikring","updated_at":"2026-10-20"}}</script>

          "heading": "Gør det overskueligt",
          "paragraphs": [
            "Find et sted med godt lys, et spejl og de ting, du bruger til daglig. Vask hænder før og efter plejen, og følg den metode, du har fået vist af din klinik.",

        },
        {
          "heading": "Se på hud og stoma",

            "Læg mærke til ny rødme, sår, hævelse, blødning, smerte, skorper eller ændringer i stomaets størrelse. Små ændringer kan have en enkel forklaring, men vedvarende eller tiltagende gener bør vurderes."

        {
          "heading": "Fjern kun slim på den måde, du har lært",

      "id": "infektion-luftveje",
      "category": "Udstyr og pleje",
      "title": "Når slim, hoste eller vejrtrækning ændrer sig",
      "summary": "Tegn du kan holde øje med, og hvornår du bør søge hjælp.",
      "reading_minutes": 4,
      "sections": [
        {
          "heading": "Kend dit eget normale",
